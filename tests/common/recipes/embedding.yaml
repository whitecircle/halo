# Tiny embedding recipe for the entry-script runs (tests/common/entry_scripts.py), which add the
# model, dataset and output_dir and the step counts.
attn_implementation: sdpa
loss_type: mnrl
pooling_mode: lasttoken
max_length: 64
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
dataloader_drop_last: true
learning_rate: 1.0e-3
lr_scheduler_type: constant
logging_steps: 1
report_to: none
seed: 42
