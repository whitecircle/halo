<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory levers</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>
  :root {
    --label-col: 600px;
    --track-h: 28px;
    --tick: 6px;
    --link: color-mix(in oklab, var(--halo-blue) 45%, var(--bg));
  }

  body { width: 1600px; }

  .row,
  .group-head {
    display: grid;
    grid-template-columns: var(--label-col) 1fr;
    align-items: center;
  }

  .group-head .name {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  .group-head + .row { margin-top: var(--heading-gap); }

  .row + .row { margin-top: 26px; }

  .row + .group-head { margin-top: var(--group-gap); }

  .key {
    display: flex;
    gap: 32px;
    font-size: 21px;
    color: var(--body);
  }

  .key span { display: inline-flex; align-items: center; gap: 10px; }

  .key svg { width: 20px; height: 20px; overflow: visible; }

  .label .lever {
    font-size: 25px;
    line-height: 1.2;
    color: var(--body);
    white-space: nowrap;
  }

  .label .run {
    margin-top: 1px;
    font-size: 20px;
    line-height: 1.25;
    color: var(--secondary);
    white-space: nowrap;
  }

  .track {
    position: relative;
    height: var(--track-h);
  }

  .track svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .link { stroke: var(--link); stroke-width: 3; }

  .before { fill: var(--bg); stroke: var(--tertiary); stroke-width: 3; }

  .after { fill: var(--halo-blue); }

  .change {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 23px;
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
  }

  /* The plot prints its values, so it draws no gridlines: an axis line under the dot column carries the scale. */
  .ticks {
    position: relative;
    height: 34px;
    margin: 24px 0 0 var(--label-col);
    font-size: 19px;
    color: var(--secondary);
    font-variant-numeric: tabular-nums;
  }

  .ticks .axis { position: absolute; top: 0; left: 0; right: 0; border-top: 1px solid var(--line); }

  .ticks i { position: absolute; top: 0; height: var(--tick); border-left: 1px solid var(--line); }

  .ticks span { position: absolute; top: calc(var(--tick) + 4px); transform: translateX(-50%); white-space: nowrap; }

  .axis-title {
    margin-left: var(--label-col);
    font-size: 19px;
    line-height: 1.2;
    color: var(--secondary);
  }

</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1><span id="title-count"></span> peak memory by <span id="title-range"></span></h1>
  </header>

  <div class="figure">
    <div class="plot" id="plot"></div>
    <div class="ticks" id="ticks"></div>
    <p class="axis-title">Per GPU, in each group’s unit</p>
  </div>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  // [group heading, [[lever, run, before, after]]]
  const GROUPS = [
    ["Peak allocated, GiB", [
      ["fsdp_shard_ep1_experts", "gpt-oss-20b at EP1, batch 1 · Halo 1.1.0 or earlier", 148.3, 60.3],
      ["Length-ordered deal", "Async GRPO six-GPU test row · Halo 1.2.0", 210.25, 183.35],
      ["CP fused head loss", "GLM-4.7-Flash at EP8 × CP4, 65,536 tokens · Halo 1.2.0", 53.30, 46.99],
    ]],
    ["Peak reserved, GB", [
      ["Expandable segments", "Dense packed SFT, Qwen3-8B · Halo 1.1.0 or earlier", 41.3, 35.4],
      ["Expandable segments", "DPO · Halo 1.1.0 or earlier", 61.6, 52.7],
      ["Expandable segments", "SMPO · Halo 1.1.0 or earlier", 41.1, 35.8],
    ]],
  ];
  const NUMBER_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
  /** The dot after the lever's radius, and the ring before it's to the middle of its stroke. */
  const R_AFTER = 9;
  const R_BEFORE = 8;
  /** Distance from a dot's edge to the change beside it. */
  const LABEL_GAP = 10;

  const plot = document.getElementById("plot");
  const tickRow = document.getElementById("ticks");
  const marks = [];

  function key() {
    const node = el("div", "key");

    for (const [name, className] of [["Without the lever", "before"], ["With it", "after"]]) {
      const item = el("span");
      const icon = svgEl("svg", { viewBox: "0 0 20 20" });
      icon.append(svgEl("circle", { class: className, cx: 10, cy: 10, r: className === "after" ? R_AFTER : R_BEFORE }));
      item.append(icon, name);
      node.append(item);
    }

    return node;
  }

  GROUPS.forEach(([heading, rows], g) => {
    const head = el("div", "group-head");
    head.append(el("div", "name", heading), g === 0 ? key() : el("div"));
    plot.append(head);

    for (const [lever, run, before, after] of rows) {
      const row = el("div", "row");
      const label = el("div", "label");
      label.append(el("div", "lever", lever), el("div", "run", run));
      const track = el("div", "track");
      row.append(label, track);
      plot.append(row);
      marks.push({ track, before, after, change: Math.round((after / before - 1) * 100) });
    }
  });

  const width = marks[0].track.clientWidth;

  /** Draws each row's dumbbell on an axis to `max`: the ring before the lever, the dot after it, a line between, and the change beside the rightmost. */
  function draw(max) {
    const x = (value) => (value / max) * width;

    for (const { track, before, after, change } of marks) {
      const cy = track.clientHeight / 2;
      const way = Math.sign(after - before) || 1;
      const svg = svgEl("svg", {});
      track.replaceChildren(svg);

      if (Math.abs(x(after) - x(before)) > R_BEFORE + R_AFTER) {
        svg.append(svgEl("line", { class: "link", x1: x(before) + way * R_BEFORE, x2: x(after) - way * R_AFTER, y1: cy, y2: cy }));
      }

      svg.append(
        svgEl("circle", { class: "before", cx: x(before), cy, r: R_BEFORE }),
        svgEl("circle", { class: "after", cx: x(after), cy, r: R_AFTER }),
      );
      const label = el("div", "change", `${change < 0 ? "−" : "+"}${Math.abs(change)}%`);
      label.style.left = `${Math.max(x(before) + R_BEFORE, x(after) + R_AFTER) + LABEL_GAP}px`;
      track.append(label);
    }
  }

  // The axis from zero ends at the smallest maximum that holds every dot and change inside the plot.
  const axis = niceAxis(Math.max(...marks.flatMap(({ before, after }) => [before, after])), (max) => {
    draw(max);
    const right = marks[0].track.getBoundingClientRect().right;

    return marks.every(({ track }) => [...track.querySelectorAll("circle, .change")].every((node) => node.getBoundingClientRect().right <= right));
  });

  drawAxis(tickRow, axis, String);

  const levers = new Set(GROUPS.flatMap(([, rows]) => rows.map(([lever]) => lever))).size;
  const count = NUMBER_WORDS[levers] ?? String(levers);
  const cuts = marks.map(({ change }) => -change);
  const [least, most] = [Math.min(...cuts), Math.max(...cuts)];
  const subject = levers === 1 ? `${count} lever cuts` : `${count} levers cut`;
  document.getElementById("title-count").textContent = subject[0].toUpperCase() + subject.slice(1);
  document.getElementById("title-range").textContent = least === most ? `${most}%` : `${least}–${most}%`;
  console.log(`changes ${marks.map(({ change }) => change).join(" ")}`);
</script>
</body>
</html>
