<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Separate inference node</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>
  :root {
    --card-gap: 24px;
    --name-size: 33px;
  }

  body { width: 1600px; }

  /* The top padding holds the half of the node names above the outline's top edge. */
  .figure {
    position: relative;
    padding-top: calc(var(--name-size) / 2);
  }

  /* Two nodes side by side, a gutter between them for the lines that cross. */
  .nodes {
    display: grid;
    grid-template-columns: 680px 1fr 560px;
    align-items: center;
  }

  /* A node is a thin outline with its serif name on the top edge: the top padding holds the half of the name
     below the edge, then the heading gap. */
  .node {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: calc(var(--name-size) / 2 + var(--heading-gap)) 24px 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  .node-name {
    position: absolute;
    top: 0;
    left: 18px;
    padding: 0 10px;
    transform: translateY(-50%);
    font-family: var(--serif);
    font-weight: 400;
    font-size: var(--name-size);
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--heading);
    background: var(--bg);
  }

  .node .card + .card { margin-top: 64px; }

  .card {
    padding: 24px 22px 26px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .card .name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    line-height: 1.2;
    color: var(--text);
  }

  .card .name i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  .card .lines {
    margin-top: 12px;
    font-size: 22px;
    line-height: 1.4;
    color: var(--body);
    white-space: nowrap;
  }

  /* What each link needs, one card per link, each column as wide as its longest line. */
  .strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(max-content, 1fr));
    column-gap: var(--card-gap);
    margin-top: var(--group-gap);
  }

  .wire-label {
    position: absolute;
    font-size: 21px;
    line-height: 1.3;
    color: var(--body);
    white-space: nowrap;
  }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>The inference node dials back to the trainer</h1>
  </header>

  <div class="figure" id="figure">
    <div class="nodes" id="nodes"></div>
    <div class="strip" id="strip"></div>
    <svg class="wires" id="wires"></svg>
  </div>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  const TRAINER = "var(--halo-blue)";
  const ENGINE = "var(--halo-violet)";
  const ACTORS = "var(--halo-indigo)";

  const GROUP_PORT = 51216;
  const VLLM_PORT = 8000;
  const SGLANG_PORT = 30000;
  const RAY_DASHBOARD_PORT = 8265;
  const ENGINE_PORTS = `vLLM :${VLLM_PORT} · SGLang :${SGLANG_PORT}`;

  const NODES = [
    {
      name: "Node 1: training + actors",
      column: 1,
      cards: [
        {
          id: "trainer",
          name: "Trainer: torchrun ranks",
          hue: TRAINER,
          lines: [
            "model + optimizer, FSDP2 / EP / TP",
            "WeightSyncPool on the main process",
            "rank 0 binds the sync store, one per server",
            "a push pauses the server, then resumes it",
          ],
        },
        {
          id: "actors",
          name: "Ray actors: same node, CPU",
          hue: ACTORS,
          lines: [
            "rollout_actor_budget actors per node, split over its ranks",
            "each holds the environment: tools, sandbox, grader",
            "no tokenizer: the engine renders the template",
            "max_concurrent_rollouts bounds in-flight episodes",
          ],
        },
      ],
    },
    {
      name: "Node 2: inference",
      column: 3,
      cards: [
        {
          id: "server",
          name: "Rollout server",
          hue: ENGINE,
          lines: [
            ENGINE_PORTS,
            "rollout_backend picks the client",
            "its workers join the sync group",
            "and dial the trainer’s store",
            "MoE backend triton on either engine",
            "GPUs no trainer rank uses",
          ],
        },
      ],
    },
  ];
  const NETWORK = [
    {
      name: "HTTP",
      lines: [ENGINE_PORTS, "actors → engine, per turn", "round-robin over the pool", "resolves from every node"],
    },
    {
      name: "NCCL group",
      lines: [`rollout_group_port ${GROUP_PORT}`, "bound on the trainer host", "+1 per extra server", "multi-homed: *_GROUP_HOST"],
    },
    {
      name: "Ray",
      lines: [
        "ray_address: null = local",
        "each rank’s ray.init starts Ray",
        `dashboard off, no port ${RAY_DASHBOARD_PORT}`,
        "actors inherit the trainer’s env",
      ],
    },
    {
      name: "EFA",
      lines: [
        "docker-compose.<engine>.efa.yml",
        "+ make EFA=1 on the trainer",
        "else the sync runs on sockets",
        "preflight: weight_sync_transport.py",
      ],
    },
  ];
  const WIRES = {
    sync: `NCCL :${GROUP_PORT}`,
    http: `HTTP :${VLLM_PORT}`,
    ray: "Ray: local, ray_address null",
  };
  /** Where the Ray link leaves the trainer card, as a share of its width. */
  const RAY_AT = 0.5;

  function buildCard(spec) {
    const card = el("div", "card");
    const name = el("div", "name");

    if (spec.hue !== undefined) {
      const dot = el("i");
      dot.style.setProperty("--hue", spec.hue);
      name.append(dot);
    }

    name.append(spec.name);
    const lines = el("div", "lines");

    for (const line of spec.lines) {
      lines.append(el("div", undefined, line));
    }

    card.append(name, lines);

    return card;
  }

  const nodes = document.getElementById("nodes");
  const cards = {};

  for (const spec of NODES) {
    const node = el("div", "node");
    node.style.gridColumn = String(spec.column);
    node.append(el("div", "node-name", spec.name));

    for (const card of spec.cards) {
      cards[card.id] = buildCard(card);
      node.append(cards[card.id]);
    }

    nodes.append(node);
  }

  document.getElementById("strip").append(...NETWORK.map(buildCard));

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const css = (value) => getComputedStyle(document.documentElement).getPropertyValue(value.slice(4, -1)).trim();

  /** The middle of the height two boxes share, where a level line can join them. Raises when they share none. */
  function sharedMiddle(p, q) {
    const top = Math.max(p.t, q.t);
    const bottom = Math.min(p.b, q.b);

    if (bottom <= top) {
      throw new Error("A link's two cards share no height for a level line: centre the server's node on the other.");
    }

    return (top + bottom) / 2;
  }

  function label(text, left, top, width) {
    const node = el("div", "wire-label", text);
    node.style.left = `${left}px`;
    node.style.top = `${top}px`;

    if (width !== undefined) {
      node.style.width = `${width}px`;
      node.style.textAlign = "center";
    }

    figure.append(node);

    return node;
  }

  const t = box(cards.trainer);
  const a = box(cards.actors);
  const s = box(cards.server);
  // Each link runs level from node to node, at the height its card shares with the server.
  const gutter = { l: box(nodes.children[0]).r, r: box(nodes.children[1]).l };
  const links = [
    [WIRES.sync, sharedMiddle(t, s), ENGINE],
    [WIRES.http, sharedMiddle(a, s), ACTORS],
  ];

  for (const [text, y, hue] of links) {
    arrow(wires, gutter.l, y, gutter.r - 1, y, css(hue));
    const above = label(text, gutter.l, 0, gutter.r - gutter.l);
    above.style.top = `${y - 10 - above.offsetHeight}px`;
  }

  const rayX = t.l + RAY_AT * (t.r - t.l);
  arrow(wires, rayX, t.b, rayX, a.t - 1, css("var(--tertiary)"));
  const ray = label(WIRES.ray, rayX + 14, 0);
  ray.style.top = `${(t.b + a.t) / 2 - ray.offsetHeight / 2}px`;
</script>
</body>
</html>
