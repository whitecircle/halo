<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standard dataloader path</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --line: #222222;
    --heading: #efefef;
    --text: #ffffff;
    --body: #c6c9cd;
    --secondary: #7e8186;
    --tertiary: #6f6f74;
    --halo-blue: #73bbff;
    --halo-violet: #c572ff;
    --halo-indigo: #7287ff;

    --sans: "ABC Monument Grotesk", "ABC Monument Grotesk Variable", Arial, Helvetica, sans-serif;
    --serif: "ABC Otto", "ABC Otto Variable", Georgia, "Times New Roman", serif;

    --label-col: 132px;
    --cell-gap: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    color: var(--body);
    font-family: var(--sans);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-wrap: pretty;
  }

  .canvas {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 52px 64px 48px;
  }

  .nw { white-space: nowrap; }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 67px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: var(--heading);
    text-wrap: balance;
  }

  .subtitle {
    margin-top: 16px;
    font-size: 27px;
    line-height: 1.35;
    color: var(--secondary);
  }

  .figure {
    position: relative;
    margin-block: auto;
    padding-block: 30px;
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .card .name {
    font-size: 27px;
    line-height: 1.2;
    color: var(--text);
    white-space: nowrap;
  }

  /* A card's facts: a quiet label beside the value it names. */
  .card dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 16px;
    row-gap: 4px;
    margin-top: 12px;
    font-size: 23px;
    line-height: 1.3;
  }

  .card dt {
    color: var(--tertiary);
    white-space: nowrap;
  }

  .card dd {
    color: var(--body);
    white-space: nowrap;
  }

  .gate {
    width: max-content;
    padding: 20px 24px 22px;
  }

  /* Four stage cards, each as wide as its facts, with what is left between them for the arrows. */
  .stages {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: space-between;
    column-gap: 36px;
    margin-top: 40px;
  }

  .stages .card { padding: 20px 22px 22px; }

  .strip-head {
    margin-top: 44px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  .strip {
    display: grid;
    grid-template-columns: var(--label-col) repeat(var(--ranks), 1fr);
    column-gap: var(--cell-gap);
    row-gap: 8px;
    margin-top: 20px;
    align-items: center;
  }

  .row-label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 25px;
    color: var(--body);
  }

  .row-label i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    border-radius: 9px;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }

  .cell.rank {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--body);
  }

  .cell.batch {
    background: var(--halo-blue);
    color: var(--bg);
  }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  footer {
    font-size: 20px;
    line-height: 1.55;
    color: var(--secondary);
  }

  footer .s { display: inline-block; }
</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Each of the {ranks} ranks reads its own batch</h1>
    <p class="subtitle">Standard dataloader path at {ranks} ranks under DDP, FSDP or EP alone: data parallel size = world = {dp}</p>
  </header>

  <div class="figure" id="figure">
    <div class="card gate" id="gate"></div>
    <div class="stages" id="stages"></div>
    <div class="strip-head" id="strip-head"></div>
    <div class="strip" id="strip"></div>
    <svg class="wires" id="wires"></svg>
  </div>

  <footer>
    <p>
      <span class="s">EP stays on this path: DeepEP returns every token to the rank it came from, so EP never reduces the data parallel size.</span>
    </p>
  </footer>
</div>

<script>
  /** Every number on the canvas is drawn from these. */
  const SETUP = { ranks: 16 };

  /** Every rank reads its own batch: data parallel size = world. */
  const dp = SETUP.ranks;
  const fmt = (n) => n.toLocaleString("en-US");
  /** Text for each `{name}` in the page's static text. */
  const VALUES = { ranks: fmt(SETUP.ranks), dp: fmt(dp) };
  const PATH = {
    gate: {
      name: "_needs_custom_dataloader() → False",
      rows: [["Custom when", "non_dp_replication_factor > 1, or a pre-sharded dataset"], ["Here", "neither holds"]],
    },
    stages: [
      { name: "Trainer (HF / TRL)", rows: [["Call", "get_train_dataloader()"], ["Then", "accelerator.prepare(dl)"]] },
      { name: "Sampler (not distributed)", rows: [["Call", "_get_train_sampler()"], ["Returns", "RandomSampler"]] },
      { name: "Accelerate prepare", rows: [["num_processes", fmt(dp)], ["process_index", "rank"]] },
      { name: "Batch sharding", rows: [["Class", "BatchSamplerShard"], ["Keeps", `idx % ${fmt(dp)} == rank`]] },
    ],
    stripHead: `What each rank reads: ${fmt(dp)} distinct batches per step`,
  };

  function el(tag, className, text) {
    const node = document.createElement(tag);

    if (className !== undefined) {
      node.className = className;
    }

    if (text !== undefined) {
      node.textContent = text;
    }

    return node;
  }

  function svgEl(tag, attrs) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);

    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, value);
    }

    return node;
  }

  function fillCard(card, name, rows) {
    card.append(el("div", "name", name));
    const facts = el("dl");

    for (const [label, value] of rows) {
      facts.append(el("dt", undefined, label), el("dd", undefined, value));
    }

    card.append(facts);
  }

  /** Replaces each `{name}` in the canvas text with VALUES[name], in place, so no text node splits. */
  function fillValues() {
    const walker = document.createTreeWalker(document.querySelector(".canvas"), NodeFilter.SHOW_TEXT);

    for (let node = walker.nextNode(); node !== null; node = walker.nextNode()) {
      node.nodeValue = node.nodeValue.replace(/\{(\w+)\}/g, (_, name) => {
        if (!(name in VALUES)) {
          throw new Error(`no value named ${name}`);
        }

        return VALUES[name];
      });
    }
  }

  fillValues();

  fillCard(document.getElementById("gate"), PATH.gate.name, PATH.gate.rows);

  const stages = document.getElementById("stages");
  const cards = PATH.stages.map((stage) => {
    const card = el("div", "card");
    fillCard(card, stage.name, stage.rows);
    stages.append(card);

    return card;
  });

  document.getElementById("strip-head").textContent = PATH.stripHead;

  const strip = document.getElementById("strip");
  strip.style.setProperty("--ranks", SETUP.ranks);
  strip.append(el("div", "row-label", "Rank"));

  for (let r = 0; r < SETUP.ranks; r += 1) {
    strip.append(el("div", "cell rank", String(r)));
  }

  const batchLabel = el("div", "row-label");
  const dot = el("i");
  dot.style.setProperty("--hue", "var(--halo-blue)");
  batchLabel.append(dot, "Batch");
  strip.append(batchLabel);

  for (let b = 0; b < dp; b += 1) {
    const cell = el("div", "cell batch", String(b));
    cell.style.gridColumn = String(2 + b);
    strip.append(cell);
  }

  console.log(`ranks ${SETUP.ranks} · batches ${dp}`);

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--secondary").trim();

  /** A straight line from (x1, y1) to (x2, y2), ending in a small head. */
  function arrow(x1, y1, x2, y2, hue) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const len = 8;
    const half = 5;
    const bx = x2 - len * Math.cos(angle);
    const by = y2 - len * Math.sin(angle);
    const px = half * Math.sin(angle);
    const py = -half * Math.cos(angle);
    wires.append(svgEl("line", { x1, y1, x2, y2, stroke: hue, "stroke-width": 2 }));
    wires.append(svgEl("polyline", { points: `${bx + px},${by + py} ${x2},${y2} ${bx - px},${by - py}`, fill: "none", stroke: hue, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }

  /** A straight line from the right edge of `from` to the left edge of `to`, at their middles. */
  function connect(from, to, hue) {
    const a = box(from);
    const z = box(to);
    arrow(a.r, (a.t + a.b) / 2, z.l - 1, (z.t + z.b) / 2, hue);
  }

  // The gate hands the loader to the trainer: straight down into the first stage's middle.
  const gate = box(document.getElementById("gate"));
  const first = box(cards[0]);
  const mid = (first.l + first.r) / 2;
  arrow(mid, gate.b, mid, first.t - 1, ink);

  for (let i = 0; i + 1 < cards.length; i += 1) {
    connect(cards[i], cards[i + 1], ink);
  }
</script>
</body>
</html>
