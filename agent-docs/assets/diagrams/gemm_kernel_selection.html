<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GEMM kernel selection</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>

  body { width: 1600px; }

  h1 { font-variant-numeric: lining-nums; }

  /* Each panel's key sits in a column left of its plot. */
  .figure {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    column-gap: 40px;
    row-gap: var(--group-gap);
    align-items: start;
  }

  .key h3 {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: var(--heading-gap);
    font-family: var(--serif);
    font-weight: 400;
    font-size: 31px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  .key svg {
    flex: none;
    width: 36px;
    height: 24px;
    overflow: visible;
  }

  .key p {
    font-size: 21px;
    line-height: 1.4;
    color: var(--secondary);
  }

  .key p + p { margin-top: 12px; }

  /* A mark's line in the key: its swatch, then what it is. */
  .key p.mark {
    display: grid;
    grid-template-columns: 36px 1fr;
    column-gap: 14px;
    color: var(--body);
  }

  .key p.mark svg { margin-top: 3px; }

  svg.chart {
    display: block;
    width: 100%;
    overflow: visible;
    font-family: var(--sans);
  }

  svg text { font-variant-numeric: tabular-nums; }

  svg .tick { font-size: 21px; fill: var(--secondary); }

  svg .axis { font-size: 23px; fill: var(--body); }

  svg .tile { font-size: 20px; fill: var(--body); }

  svg .point { font-size: 21px; fill: var(--text); }

</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1 id="title"></h1>
  </header>

  <div class="figure" id="figure">
    <div class="key" id="rate-key"></div>
    <svg class="chart" id="rate"></svg>
    <div class="key" id="clock-key"></div>
    <svg class="chart" id="clock"></svg>
  </div>

  <footer>
    <p>
      <span class="s">Each point is the median of 7 samples of back-to-back calls, timed on the device.</span>
      <span class="s">A change is a different cuBLAS kernel name from one M to the next.</span>
      <span class="s">The tile is read from that name.</span>
    </p>
  </footer>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>

  ];
  /** The cuBLAS kernel names the profiler reported, in order of first use. */
  const KERNELS = [
    "nvjet_sm103_tst_32x64_64x16_4x1_v_bz_NNN",
    "nvjet_sm103_tst_64x16_64x16_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_64x32_64x16_2x2_2cta_h_bz_NNT",

    "nvjet_sm103_tst_64x64_64x16_2x2_2cta_h_bz_NNT",
    "nvjet_sm103_tst_64x48_64x16_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_64x64_64x16_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_64x80_64x16_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_96x64_64x13_2x2_2cta_h_bz_NNN",
    "nvjet_sm103_tst_64x96_64x15_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_64x112_64x14_2x1_2cta_v_bz_NNT",

    "nvjet_sm103_tst_128x80_64x8_1x2_h_bz_NNT",
    "nvjet_sm103_tst_160x64_64x9_1x2_2cta_h_bz_NNN",
    "nvjet_sm103_tst_128x88_64x7_1x2_h_bz_NNT",
    "nvjet_sm103_tst_128x96_64x7_1x2_h_bz_NNT",
    "nvjet_sm103_tst_128x104_64x7_1x2_h_bz_NNT",
    "nvjet_sm103_tst_128x112_64x9_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x128_64x8_4x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x120_64x6_1x2_h_bz_NNT",
    "nvjet_sm103_tst_128x128_64x8_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x136_64x6_1x2_h_bz_NNT",
    "nvjet_sm103_tst_128x144_64x8_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x160_64x8_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_192x112_64x6_2x2_2cta_h_bz_NNT",
    "nvjet_sm103_tst_192x128_64x6_2x2_2cta_h_bz_NNT",
    "nvjet_sm103_tst_128x176_64x7_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x192_64x7_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x208_64x7_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_256x128_64x5_2x2_2cta_h_bz_NNT",
    "nvjet_sm103_tst_192x160_64x6_2x2_2cta_h_bz_NNT",
    "nvjet_sm103_tst_192x144_64x6_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x224_64x7_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_160x192_64x5_1x2_2cta_h_bz_NNN",
    "nvjet_sm103_tst_192x176_64x6_2x2_2cta_h_bz_NNT",
    "nvjet_sm103_tst_192x176_64x6_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x160_64x8_2x2_2cta_h_bz_NNT",
    "nvjet_sm103_tst_128x272_64x4_2x1_v_bz_NNT",
    "nvjet_sm103_tst_128x160_64x8_4x1f_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x192_64x7_4x1f_2cta_v_bz_NNT",
    "nvjet_sm103_tst_256x128_64x5_2x4f_2cta_h_bz_NNT",
    "nvjet_sm103_tst_256x128_64x5_2x2f_2cta_h_bz_NNT",
    "nvjet_sm103_tst_128x256_64x6_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x160_64x8_2x2f_2cta_h_bz_NNT",
    "nvjet_sm103_tst_160x192_64x5_2x2f_2cta_h_bz_NNN",
    "nvjet_sm103_tst_128x192_64x7_2x2f_2cta_h_bz_NNT",
    "nvjet_sm103_tst_256x128_64x5_2x1_2cta_v_bz_NNT",
    "nvjet_sm103_tst_128x256_64x4_1x1_h_bz_NNT",
    "nvjet_sm103_tst_128x256_64x4_1x2_h_bz_NNT",
    "nvjet_sm103_tst_128x256_64x6_2x2f_2cta_h_bz_NNT",
    "nvjet_sm103_tst_192x128_64x5_1x2_h_bz_NNT",
    "nvjet_sm103_tst_256x128_64x4_1x2_h_bz_NNT",
    "nvjet_sm103_tst_128x256_64x6_4x1f_2cta_v_bz_NNT",
  ];
  /** msweep-fine.json, gpu.max_sm_clock_mhz. */
  const MAX_CLOCK = 2032;
  /** roofline.json, sections.bandwidth[], pattern "copy" at 64 GiB, tb_per_s_median: read plus write, TB/s. */
  const COPY_TB_PER_S = 6.652;
  /** peaks-sustained.json, the 8192³ bf16 row, eager.tflops_median: ten samples of 0.5 s back to back. */
  const SUSTAINED_PEAK = 1388;
  /** The weight's two dimensions in this sweep. */
  const K = 2880;
  const N = 2880;
  /** A fall in rate from one M to the next counts as a drop from this share on. */
  const DROP = 0.08;
  /** The values of M that carry a tick label: powers of four, with a small tick at the powers of two between. */
  const MAJOR_EVERY = 2;

  // cuBLAS hands the product to its column-major kernels transposed, so in a name `tst_AxB` the tile spans A of
  // the lecture's N (the output's columns) and B of its M (the rows): with K = N = 4096 the launch grid equals
  // ceil(N / A) × ceil(M / B) at 570 of the 576 points of the same sweep.
  const tileOf = (name) => {
    const [, columns, rows] = name.match(/tst_(\d+)x(\d+)_/).map(Number);

    return { rows, columns };
  };
  /** NVML's clock-event reason for the driver's software power cap. */
  const POWER_CAP = 4;
  const points = SWEEP.map(([m, rate, clock, reasons, kernel]) => ({ m, rate, clock, capped: reasons === POWER_CAP, kernel, tile: tileOf(KERNELS[kernel]) }));
  const pairs = points.slice(1).map((p, i) => ({ from: points[i], to: p }));
  const changes = pairs.filter(({ from, to }) => from.kernel !== to.kernel);
  const drops = pairs.filter(({ from, to }) => to.rate <= from.rate * (1 - DROP));
  const dropsAtChange = drops.filter(({ from, to }) => from.kernel !== to.kernel).length;
  const ridge = SUSTAINED_PEAK / COPY_TB_PER_S;
  /** Where a square-weight GEMM's arithmetic intensity M × K / (K + 2M) reaches the ridge. */
  const crossover = (ridge * K) / (K - 2 * ridge);
  const fmt = (v) => Math.round(v).toLocaleString("en-US");
  const dropPercent = Math.round(100 * DROP);

  document.getElementById("title").textContent =
    dropsAtChange === drops.length
      ? "Each sharp drop in a GEMM’s rate falls where cuBLAS changes kernel"
      : `${dropsAtChange} of ${drops.length} sharp drops in a GEMM’s rate fall where cuBLAS changes kernel`;

  const HUES = { rate: "var(--halo-blue)", clock: "var(--halo-indigo)" };
  /** A key swatch: a 36 × 24 drawing of the mark. */
  const swatch = (draw) => {
    const svg = svgEl("svg", { viewBox: "0 0 36 24", "aria-hidden": "true" });
    draw(svg);

    return svg;
  };
  const SWATCHES = {
    rate: (svg) => svg.append(svgEl("line", { x1: 2, y1: 12, x2: 34, y2: 12, stroke: HUES.rate, "stroke-width": 3, "stroke-linecap": "round" })),
    clock: (svg) => [8, 18, 28].forEach((x) => svg.append(svgEl("circle", { cx: x, cy: 12, r: 2.5, fill: HUES.clock }))),
    change: (svg) => [6, 14, 18, 30].forEach((x) => svg.append(svgEl("line", { x1: x, y1: 4, x2: x, y2: 18, stroke: "var(--secondary)", "stroke-width": 1 }))),
    drop: (svg) => svg.append(svgEl("line", { x1: 18, y1: 1, x2: 18, y2: 23, stroke: "var(--text)", "stroke-width": 1.25 })),
    crossover: (svg) => svg.append(svgEl("line", { x1: 18, y1: 1, x2: 18, y2: 23, stroke: "var(--tertiary)", "stroke-width": 1.5, "stroke-dasharray": "5 4" })),
  };

  /** Fills a key column: its heading with a swatch, plain lines, then one line per mark. */
  function fillKey(id, { name, mark, lines, marks = [] }) {
    const key = document.getElementById(id);
    const heading = el("h3");
    heading.append(swatch(SWATCHES[mark]), name);
    key.append(heading);

    for (const line of lines) {
      key.append(el("p", undefined, line));
    }

    for (const [kind, text] of marks) {
      const p = el("p", "mark");
      p.append(swatch(SWATCHES[kind]), el("span", undefined, text));
      key.append(p);
    }
  }

  fillKey("rate-key", {
    name: "Rate on the device",
    mark: "rate",
    lines: [
      `A bf16 GEMM [M, ${K}] @ [${K}, ${N}] on one B300, the weight read from HBM on every call, at ${points.length} values of M`,
      "Above the plot: the output tile of one block at that M, rows\u00a0×\u00a0columns",
    ],
    marks: [
      ["change", `cuBLAS changes kernel, ${changes.length} times in all`],
      ["drop", `A drop of ${dropPercent}% or more from one M to the next: ${drops.length} of them`],
      ["crossover", `Crossover M, ${fmt(crossover)}: the GEMM’s arithmetic intensity reaches the ridge`],
    ],
  });
  const slowed = points.filter((p) => p.clock < MAX_CLOCK);
  /** The first M after the last point that read the full clock. */
  const slowFrom = points[points.indexOf(points.filter((p) => p.clock >= MAX_CLOCK).at(-1)) + 1];
  fillKey("clock-key", {
    name: "SM clock",
    mark: "clock",
    lines: [
      `Read after each point. It first reads below its ${fmt(MAX_CLOCK)}\u00a0MHz maximum at M\u00a0=\u00a0${fmt(slowed[0].m)}, and stays below from M\u00a0=\u00a0${fmt(slowFrom.m)} on`,
      `At ${slowed.filter((p) => p.capped).length} of the ${slowed.length} points below it the driver reports a power cap`,
    ],
  });

  /** Plot-area insets inside each SVG: room for the y title and ticks on the left. */
  const PAD = { l: 118, r: 24 };
  /** Height of the kernel-change ticks hanging from the top of the rate plot. */
  const RUG = 16;
  const first = Math.log2(points[0].m);
  const last = Math.log2(points.at(-1).m);

  /** Sets up one panel's SVG and returns its plot box, x scale and an element adder. */
  function panel(id, height, top, bottom) {
    const chart = document.getElementById(id);
    const width = chart.getBoundingClientRect().width;
    chart.setAttribute("height", height);
    chart.setAttribute("viewBox", `0 0 ${width} ${height}`);
    const plot = { l: PAD.l, r: width - PAD.r, t: top, b: height - bottom };
    // The M axis is logarithmic, from the first M of the sweep to the last, with a little room at each end.
    const sx = (m) => plot.l + 10 + ((Math.log2(m) - first) / (last - first)) * (plot.r - plot.l - 20);
    const add = (tag, attrs, text) => chart.appendChild(svgEl(tag, attrs, text));

    return { chart, plot, sx, add, height };
  }

  /** Draws a panel's frame: gridlines and labels at the y ticks, its axis lines and its rotated title. */
  function frame({ plot, add }, axis, sy, title) {
    for (const v of axis.ticks) {
      if (v > 0) {
        add("line", { x1: plot.l, x2: plot.r, y1: sy(v), y2: sy(v), stroke: "var(--line)", "stroke-width": 1 });
      }

      add("text", { class: "tick", x: plot.l - 14, y: sy(v), "text-anchor": "end", "dominant-baseline": "central" }, v.toLocaleString("en-US"));
    }

    add("line", { x1: plot.l, x2: plot.r, y1: plot.b, y2: plot.b, stroke: "var(--secondary)", "stroke-width": 1 });
    add("line", { x1: plot.l, x2: plot.l, y1: plot.t, y2: plot.b, stroke: "var(--secondary)", "stroke-width": 1 });
    add("text", { class: "axis", transform: `translate(14 ${(plot.t + plot.b) / 2}) rotate(-90)`, "text-anchor": "middle", "dominant-baseline": "hanging" }, title);
  }

  /** The powers of two the sweep spans, each with whether it carries a label. */
  const powers = Array.from({ length: Math.floor(last + 1e-9) - Math.ceil(first - 1e-9) + 1 }, (_, i) => {
    const exponent = Math.ceil(first - 1e-9) + i;

    return { m: 2 ** exponent, major: (exponent - Math.ceil(first - 1e-9)) % MAJOR_EVERY === 0 };
  });

  // The rate panel: the tile labels above it, the kernel changes hanging from its top, the curve under them.
  {
    const p = panel("rate", 520, 44, 8);
    const { plot, sx, add } = p;
    const top = Math.max(...points.map((q) => q.rate));
    const axis = niceAxis(top * 1.02);
    // The curve stays below the kernel-change ticks.
    const sy = (v) => plot.b - (v / axis.max) * (plot.b - plot.t - RUG - 8);
    frame(p, axis, sy, "Rate, TFLOP/s");

    for (const { m, major } of powers) {
      add("line", { x1: sx(m), x2: sx(m), y1: plot.b, y2: plot.b + (major ? 8 : 5), stroke: "var(--secondary)", "stroke-width": 1 });

      if (major) {
        const { rows, columns } = points.find((q) => q.m === m).tile;
        add("text", { class: "tile", x: sx(m), y: plot.t - 16, "text-anchor": "middle" }, `${rows} × ${columns}`);
      }
    }

    // The row's name sits left of its first label, which is centred on the axis's first tick.
    const firstTile = p.chart.querySelector("text.tile").getBBox();
    add("text", { class: "tick", x: firstTile.x - 16, y: plot.t - 16, "text-anchor": "end" }, "Tile");

    // A change falls between two measured values of M: the tick sits midway on the axis.
    const between = ({ from, to }) => (sx(from.m) + sx(to.m)) / 2;

    for (const pair of changes) {
      add("line", { x1: between(pair), x2: between(pair), y1: plot.t, y2: plot.t + RUG, stroke: "var(--secondary)", "stroke-width": 1 });
    }

    for (const pair of drops) {
      add("line", { x1: between(pair), x2: between(pair), y1: plot.t, y2: sy(pair.to.rate), stroke: "var(--text)", "stroke-width": 1.25 });
    }

    add("line", { x1: sx(crossover), x2: sx(crossover), y1: plot.t + RUG + 8, y2: plot.b, stroke: "var(--tertiary)", "stroke-width": 1.5, "stroke-dasharray": "5 4" });
    add("polyline", {
      points: points.map((q) => `${sx(q.m)},${sy(q.rate)}`).join(" "),
      fill: "none",
      stroke: HUES.rate,
      "stroke-width": 2.5,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
    });
  }

  // The clock panel, on the same M axis, which it labels.
  {
    const p = panel("clock", 292, 8, 84);
    const { plot, sx, add, height } = p;
    const axis = niceAxis(MAX_CLOCK, undefined, { most: 2 });
    const sy = (v) => plot.b - (v / axis.max) * (plot.b - plot.t);
    frame(p, axis, sy, "Clock, MHz");

    for (const { m, major } of powers) {
      add("line", { x1: sx(m), x2: sx(m), y1: plot.b, y2: plot.b + (major ? 8 : 5), stroke: "var(--secondary)", "stroke-width": 1 });

      if (major) {
        add("text", { class: "tick", x: sx(m), y: plot.b + 34, "text-anchor": "middle" }, m.toLocaleString("en-US"));
      }
    }

    add("text", { class: "axis", x: (plot.l + plot.r) / 2, y: height - 6, "text-anchor": "middle" }, "M, rows of the GEMM");

    for (const q of points) {
      add("circle", { cx: sx(q.m), cy: sy(q.clock), r: 2.5, fill: HUES.clock });
    }
  }
