<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dedicated rollout nodes</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --line: #222222;
    --heading: #efefef;
    --text: #ffffff;
    --body: #c6c9cd;
    --secondary: #7e8186;
    --tertiary: #6f6f74;
    --halo-blue: #73bbff;
    --halo-violet: #c572ff;
    --halo-indigo: #7287ff;

    --sans: "ABC Monument Grotesk", "ABC Monument Grotesk Variable", Arial, Helvetica, sans-serif;
    --serif: "ABC Otto", "ABC Otto Variable", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    color: var(--body);
    font-family: var(--sans);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-wrap: pretty;
  }

  .canvas {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 52px 64px 48px;
  }

  .nw { white-space: nowrap; }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 67px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: var(--heading);
    text-wrap: balance;
  }


  .figure {
    position: relative;
    margin-block: auto;
    /* The extra top padding holds the node names, which sit on the outline's top edge. */
    padding: 39px 0 22px;
  }

  /* Training and actor nodes on the left, inference nodes on the right, a gutter for the lines. */
  .nodes {
    display: grid;
    grid-template-columns: 600px 1fr 560px;
    row-gap: 44px;
  }

  /* A node is a thin outline with its serif name on the top edge. */
  .node {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 28px 20px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  .node-name {
    position: absolute;
    top: 0;
    left: 18px;
    padding: 0 10px;
    transform: translateY(-50%);
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--heading);
    background: var(--bg);
  }

  .card {
    padding: 20px 26px 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .card .name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    color: var(--text);
  }

  .card .name i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  /* A card's facts: a quiet label and its value, in two aligned columns. */
  .rows {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 16px;
    row-gap: 4px;
    margin-top: 12px;
    font-size: 22px;
    line-height: 1.35;
  }

  .rows dt { color: var(--tertiary); }

  .rows dd { color: var(--body); }

  /* The run config that wires the nodes together: its name, then its fields in two pairs of columns. */
  .config {
    display: grid;
    grid-template-columns: max-content 1fr;
    align-items: baseline;
    column-gap: 48px;
    margin-top: 24px;
  }

  .config .rows {
    grid-template-columns: max-content 1fr max-content 1fr;
    margin-top: 0;
  }

  .config .rows dt:nth-of-type(2n) { padding-left: 32px; }

  .wire-label {
    position: absolute;
    font-size: 21px;
    line-height: 1.35;
    color: var(--body);
    white-space: nowrap;
  }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Each inference node gets its own sync group</h1>
  </header>

  <div class="figure" id="figure">
    <div class="nodes" id="nodes"></div>
    <div class="card config" id="config"></div>
    <svg class="wires" id="wires"></svg>
  </div>
</div>

<script>
  const TRAINER = "var(--halo-blue)";
  const ENGINE = "var(--halo-violet)";
  const ACTORS = "var(--halo-indigo)";

  const NODES = [
    {
      name: "Training node",
      area: "1 / 1",
      card: {
        id: "trainer",
        name: "Trainer",
        hue: TRAINER,
        rows: [
          ["Groups", "one NCCL group per server"],
          ["Sync", "rank 0 in each"],
          ["Ports", "all bound on this host"],
        ],
      },
    },
    {
      name: "Actor tier · CPU nodes",
      area: "2 / 1",
      card: {
        id: "actors",
        name: "Ray environment actors",
        hue: ACTORS,
        rows: [
          ["Placement", "soft-pinned to their rank’s node"],
          ["Overflow", "spills onto this tier"],
          ["Env", "ray start’s, not the trainer’s"],
        ],
      },
    },
    {
      name: "Inference node 1",
      area: "1 / 3",
      card: {
        id: "server1",
        name: "Rollout server",
        hue: ENGINE,
        rows: [
          ["Engine", "vLLM or SGLang"],
          ["URL", "http://inf1:8000"],
          ["Sync", "group port 51216"],
        ],
      },
    },
    {
      name: "Inference node 2",
      area: "2 / 3",
      card: {
        id: "server2",
        name: "Rollout server",
        hue: ENGINE,
        rows: [
          ["Engine", "vLLM or SGLang"],
          ["URL", "http://inf2:8000"],
          ["Sync", "group port 51217"],
        ],
      },
    },
  ];
  const CONFIG = {
    name: "Run config",
    rows: [
      ["ray_address", "ray-head:6379"],
      ["rollout_actor_budget", "64, across the whole cluster"],
      ["rollout_server_configs", "one entry per inference node"],
      ["enable_prefetch", "true, the default with two servers"],
    ],
  };
  /** Vertical offset of a line's ends from a card's middle, so no two arrowheads meet. */
  const PORT = 14;
  /** Where the Ray link leaves the trainer card, as a share of its width. */
  const RAY_AT = 0.75;

  function el(tag, className, text) {
    const node = document.createElement(tag);

    if (className !== undefined) {
      node.className = className;
    }

    if (text !== undefined) {
      node.textContent = text;
    }

    return node;
  }

  function svgEl(tag, attrs) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);

    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, value);
    }

    return node;
  }

  function buildCard(spec, card = el("div", "card")) {
    const name = el("div", "name");

    if (spec.hue !== undefined) {
      const dot = el("i");
      dot.style.setProperty("--hue", spec.hue);
      name.append(dot);
    }

    name.append(spec.name);
    const rows = el("dl", "rows");

    for (const [term, value] of spec.rows) {
      rows.append(el("dt", undefined, term), el("dd", undefined, value));
    }

    card.append(name, rows);

    return card;
  }

  const nodes = document.getElementById("nodes");
  const cards = {};

  for (const spec of NODES) {
    const node = el("div", "node");
    node.style.gridArea = spec.area;
    cards[spec.card.id] = buildCard(spec.card);
    node.append(el("div", "node-name", spec.name), cards[spec.card.id]);
    nodes.append(node);
  }

  buildCard(CONFIG, document.getElementById("config"));

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const css = (value) => getComputedStyle(document.documentElement).getPropertyValue(value.slice(4, -1)).trim();

  /** A straight 2px line from (x1, y1) to (x2, y2), ending in a small head. */
  function arrow(x1, y1, x2, y2, hue) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const len = 8;
    const half = 5;
    const bx = x2 - len * Math.cos(angle);
    const by = y2 - len * Math.sin(angle);
    const px = half * Math.sin(angle);
    const py = -half * Math.cos(angle);
    wires.append(svgEl("line", { x1, y1, x2, y2, stroke: hue, "stroke-width": 2 }));
    wires.append(svgEl("polyline", { points: `${bx + px},${by + py} ${x2},${y2} ${bx - px},${by - py}`, fill: "none", stroke: hue, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }

  /** A straight line from the right edge of `from` to the left edge of `to`, ending in a small head. */
  function connect(from, to, hue, fromDy, toDy) {
    const a = box(from);
    const z = box(to);
    arrow(a.r, (a.t + a.b) / 2 + fromDy, z.l - 1, (z.t + z.b) / 2 + toDy, hue);
  }

  function label(text, left, top, width) {
    const node = el("div", "wire-label", text);
    node.style.left = `${left}px`;
    node.style.top = `${top}px`;

    if (width !== undefined) {
      node.style.width = `${width}px`;
      node.style.textAlign = "center";
    }

    figure.append(node);

    return node;
  }

  const t = box(cards.trainer);
  const a = box(cards.actors);
  const servers = [cards.server1, cards.server2];

  // The trainer syncs both servers and the actors round-robin over both: each line leaves and lands
  // above the middle for the first server or the trainer, below it for the second or the actors.
  servers.forEach((server, j) => {
    connect(cards.trainer, server, css(TRAINER), (j === 0 ? -1 : 1) * PORT, -PORT);
    connect(cards.actors, server, css(ACTORS), (j === 0 ? -1 : 1) * PORT, PORT);
  });
  const gutter = box(nodes.children[0]).r;
  const width = box(nodes.children[2]).l - gutter;
  const above = label("NCCL weight sync", gutter, 0, width);
  above.style.top = `${(t.t + t.b) / 2 - PORT - 12 - above.offsetHeight}px`;
  label("HTTP requests", gutter, (a.t + a.b) / 2 + PORT + 12, width);

  const rayX = t.l + RAY_AT * (t.r - t.l);
  arrow(rayX, t.b, rayX, a.t - 1, css("var(--tertiary)"));
  const ray = label("Ray cluster", rayX + 14, 0);
  ray.style.top = `${(t.b + a.t) / 2 - ray.offsetHeight / 2}px`;
</script>
</body>
</html>
