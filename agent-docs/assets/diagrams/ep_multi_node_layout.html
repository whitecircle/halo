<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EP + TP on two nodes</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>

  body { width: 1600px; }

  .figure { position: relative; }

  /* Each node is a thin outline around its rank strip and its TP group. */
  .nodes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 40px;
  }

  .node {
    padding: 24px 28px 28px;
    border: 1px solid var(--line);
    border-radius: 16px;
  }

  .node-head {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 31px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    font-variant-numeric: lining-nums;
    color: var(--heading);
  }

  .strip {
    display: grid;
    grid-template-columns: repeat(var(--ranks), 1fr);
    gap: 6px;
    margin-top: 20px;
  }

  .chip {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface);
    font-size: 21px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .card {
    padding: 24px 28px 26px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .card .name {
    font-size: 27px;
    line-height: 1.25;
    color: var(--text);
    white-space: nowrap;
  }

  .card .lines {
    font-size: 23px;
    line-height: 1.4;
    color: var(--body);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .card .name + .lines { margin-top: 10px; }

  .tp {
    margin-top: 16px;
    padding-block: 18px 20px;
  }

  /* Room under the nodes for the tokens arrows into the EP group. */
  .ep { margin-top: 88px; }

  .mesh { margin-top: 28px; }

  .tag {
    position: absolute;
    font-size: 21px;
    color: var(--body);
    white-space: nowrap;
  }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Across nodes, EP with TP is one global group</h1>
  </header>

  <div class="figure" id="figure">
    <div class="nodes" id="nodes"></div>
    <div class="card ep" id="ep"></div>
    <div class="card mesh" id="mesh"></div>
    <svg class="wires" id="wires"></svg>
  </div>

  <footer>
    <p>
      <span class="s">Above one NVLink domain, EP under TP must be a single group spanning the job: ep{gpusPerNode}/tp2 on {nodes}×{gpusPerNode} forms {nodesWord} groups and is rejected at config time.</span>
    </p>
  </footer>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  /** Every number on the canvas is drawn from these. TP fills each node and EP spans every rank. */
  const SETUP = { nodes: 2, gpusPerNode: 8, experts: 128 };
  const NUMBER_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];

  if (SETUP.nodes !== 2) {
    throw new Error("this layout draws two nodes side by side, so dp 2 pairs");
  }

  const world = SETUP.nodes * SETUP.gpusPerNode;
  const tp = SETUP.gpusPerNode;
  const dp = world / tp;

  if (SETUP.experts % world !== 0) {
    throw new Error(`${SETUP.experts} experts do not split evenly over ep_size ${world}`);
  }

  const perRank = SETUP.experts / world;
  const fmt = (n) => n.toLocaleString("en-US");
  /** Text for each `{name}` in the page's static text. */
  const VALUES = { nodes: fmt(SETUP.nodes), nodesWord: NUMBER_WORDS[SETUP.nodes], gpusPerNode: fmt(SETUP.gpusPerNode) };
  /** The ranks sharing a TP position, one per node: the first two pairs and the last. */
  const pair = (position) => `(${Array.from({ length: SETUP.nodes }, (_, n) => n * tp + position).join(",")})`;
  const pairs = `${pair(0)} ${pair(1)} … ${pair(tp - 1)}`;
  const EP_CARD = {
    name: `One global EP group: all ${fmt(world)} ranks (ep_scope='global')`,
    lines: [
      `${fmt(SETUP.experts)} experts / ep ${fmt(world)} = ${fmt(perRank)} per rank`,
      `Rank r owns experts ${perRank}r … ${perRank}r+${perRank - 1}`,
      "DeepEP all-to-all crosses RDMA between the nodes",
    ],
  };
  const MESH_CARD = {
    name: `FSDP2 mesh (dp ${fmt(dp)}, tp ${fmt(tp)})`,
    lines: [
      `Ranks sharing a TP position form a DP pair: ${pairs}`,
      "Non-expert params shard over the pair: RDMA all-gather / reduce-scatter",
    ],
  };

  fillValues(VALUES);

  function fillCard(node, spec) {
    if (spec.name !== undefined) {
      node.append(el("div", "name", spec.name));
    }

    const lines = el("div", "lines");

    for (const line of spec.lines) {
      lines.append(el("div", undefined, line));
    }

    node.append(lines);

    return node;
  }

  const nodesEl = document.getElementById("nodes");
  const nodes = [];

  for (let n = 0; n < SETUP.nodes; n += 1) {
    const first = n * SETUP.gpusPerNode;
    const node = el("div", "node");
    node.append(el("div", "node-head", `Node ${n}: ranks ${fmt(first)}–${fmt(first + SETUP.gpusPerNode - 1)}`));
    const strip = el("div", "strip");
    strip.style.setProperty("--ranks", SETUP.gpusPerNode);

    for (let i = 0; i < SETUP.gpusPerNode; i += 1) {
      strip.append(el("div", "chip", `R${first + i}`));
    }

    node.append(strip, fillCard(el("div", "card tp"), { lines: [`TP group, ${fmt(tp)} ranks: attention sharded over NVLink`] }));
    nodesEl.append(node);
    nodes.push(node);
  }

  const epEl = fillCard(document.getElementById("ep"), EP_CARD);
  fillCard(document.getElementById("mesh"), MESH_CARD);

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const lineHue = getComputedStyle(document.documentElement).getPropertyValue("--secondary").trim();

  // Each node's tokens go down into the one EP group, the label to the right of its arrow.
  const ep = box(epEl);

  for (const node of nodes) {
    const b = box(node);
    const x = (b.l + b.r) / 2;
    arrow(wires, x, b.b + 1, x, ep.t - 1, lineHue);
    const tag = el("div", "tag", "tokens");
    figure.append(tag);
    tag.style.left = `${x + 14}px`;
    tag.style.top = `${(b.b + ep.t - tag.offsetHeight) / 2}px`;
  }
</script>
</body>
</html>
