<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EP token routing</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>

  body { width: 1600px; }

  .figure { position: relative; }

  /* Three card columns, a rank per row, with wide gutters for the all-to-all lines. The labels row names the gutters. */
  .lanes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto auto auto;
    column-gap: 200px;
  }

  .hop-row {
    grid-column: 1 / -1;
    height: 62px;
    margin-bottom: 20px;
  }

  /* The second rank's row sits well below the first, so the lines crossing between the rows stay apart. */
  .card.lower { margin-top: 142px; }

  .card {
    padding: 28px 32px 30px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .card .name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    line-height: 1.25;
    color: var(--text);
  }

  .card .name i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  .card .lines {
    margin-top: 10px;
    font-size: 23px;
    line-height: 1.4;
    color: var(--body);
    white-space: nowrap;
  }

  /* The label of an all-to-all sits centred over its gutter, above the cards. */
  .hop {
    position: absolute;
    text-align: center;
    font-size: 21px;
    line-height: 1.35;
    color: var(--body);
  }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Every token returns to the rank it came from</h1>
  </header>

  <div class="figure" id="figure">
    <div class="lanes" id="lanes"><div class="hop-row" id="hop-row"></div></div>
    <svg class="wires" id="wires"></svg>
  </div>

  <footer>
    <p>
      <span class="s">EP size {ranks} over {experts} experts, {perRank} per rank, at data parallel {ranks}.</span>
      <span class="s">Lines carry the colour of the batch their tokens came from.</span>
      <span class="s">EP is orthogonal to DP: every token returns to the rank it came from, so rank 0 still trains on batch A.</span>
    </p>
  </footer>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  /** Every number on the canvas is drawn from these. */
  const SETUP = { ranks: 2, experts: 32 };
  /** Colour marks the batch a rank trains on. */
  const RANK_HUES = ["--halo-blue", "--halo-violet"];

  if (SETUP.ranks !== 2) {
    throw new Error("this layout draws 2 ranks, one row each");
  }

  if (SETUP.experts % SETUP.ranks !== 0) {
    throw new Error(`${SETUP.experts} experts do not split evenly over ${SETUP.ranks} ranks`);
  }

  const perRank = SETUP.experts / SETUP.ranks;
  const fmt = (n) => n.toLocaleString("en-US");
  /** Text for each `{name}` in the page's static text. */
  const VALUES = { ranks: fmt(SETUP.ranks), experts: fmt(SETUP.experts), perRank: fmt(perRank) };
  const LANES = Array.from({ length: SETUP.ranks }, (_, rank) => ({
    rank,
    batch: String.fromCharCode(65 + rank),
    hue: `var(${RANK_HUES[rank]})`,
    experts: `${fmt(rank * perRank)}–${fmt((rank + 1) * perRank - 1)}`,
  }));
  /** The three cards of a lane: the rank's batch going out, the experts it holds, the batch coming back. */
  const COLUMNS = [
    (l) => ({ name: `R${l.rank} · batch ${l.batch}`, hue: l.hue, lines: ["[B·S, hidden] flat rows", "Router top-k per token"] }),
    (l) => ({ name: `Experts ${l.experts}`, lines: ["grouped_mm(x, w, offs)", "Tokens sorted by expert"] }),
    (l) => ({ name: `R${l.rank} · batch ${l.batch}`, hue: l.hue, lines: ["Same rows, same order", "Weighted by top-k probs"] }),
  ];
  const HOPS = [["DeepEP dispatch", "all-to-all"], ["DeepEP combine", "all-to-all"]];
  /** Vertical offset of a line's ends from a card's middle, toward the row it leaves for or comes from. */
  const PORT = 16;

  fillValues(VALUES);

  const lanes = document.getElementById("lanes");
  const cards = COLUMNS.map(() => []);

  for (const lane of LANES) {
    COLUMNS.forEach((build, i) => {
      const spec = build(lane);
      const card = el("div", lane.rank === 0 ? "card" : "card lower");
      const name = el("div", "name");

      if (spec.hue !== undefined) {
        const dot = el("i");
        dot.style.setProperty("--hue", spec.hue);
        name.append(dot);
      }

      name.append(spec.name);
      const lines = el("div", "lines");

      for (const line of spec.lines) {
        lines.append(el("div", undefined, line));
      }

      card.append(name, lines);
      lanes.append(card);
      cards[i].push(card);
    });
  }

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const hue = (rank) => getComputedStyle(document.documentElement).getPropertyValue(RANK_HUES[rank]).trim();
  const side = (row) => (row === 0 ? -1 : 1);

  // Dispatch sends each rank's tokens to both expert slices, combine sends every token home: each line leaves
  // its card on the side of the row it heads for and lands on the side of the row it came from.
  for (const [src, dst] of [[0, 1], [1, 2]]) {
    for (let i = 0; i < SETUP.ranks; i += 1) {
      for (let j = 0; j < SETUP.ranks; j += 1) {
        const a = box(cards[src][i]);
        const z = box(cards[dst][j]);
        const batch = src === 0 ? i : j;
        arrow(wires, a.r + 1, (a.t + a.b) / 2 + side(j) * PORT, z.l - 1, (z.t + z.b) / 2 + side(i) * PORT, hue(batch));
      }
    }
  }

  // Each hop label sits centred over its gutter, above the first row of cards.
  const labelsBottom = box(document.getElementById("hop-row")).t + 62;

  HOPS.forEach((text, i) => {
    const left = box(cards[i][0]);
    const right = box(cards[i + 1][0]);
    const label = el("div", "hop");

    for (const line of text) {
      label.append(el("div", undefined, line));
    }

    label.style.left = `${left.r}px`;
    label.style.width = `${right.l - left.r}px`;
    figure.append(label);
    label.style.top = `${labelsBottom - label.offsetHeight}px`;
  });
</script>
</body>
</html>
