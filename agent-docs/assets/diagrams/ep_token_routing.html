<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EP token routing</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --line: #222222;
    --heading: #efefef;
    --text: #ffffff;
    --body: #c6c9cd;
    --secondary: #7e8186;
    --tertiary: #6f6f74;
    --halo-blue: #73bbff;
    --halo-violet: #c572ff;
    --halo-indigo: #7287ff;

    --sans: "ABC Monument Grotesk", "ABC Monument Grotesk Variable", Arial, Helvetica, sans-serif;
    --serif: "ABC Otto", "ABC Otto Variable", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    color: var(--body);
    font-family: var(--sans);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-wrap: pretty;
  }

  .canvas {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 52px 64px 48px;
  }

  .nw { white-space: nowrap; }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 67px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: var(--heading);
    text-wrap: balance;
  }


  .figure {
    position: relative;
    margin-block: auto;
    padding-block: 40px;
  }

  /* Three stage columns with a wide gutter between them for the all-to-all lines. */
  .stages {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 240px;
    row-gap: 44px;
  }

  .stage-head b {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  /* What the stage does, under its name. */
  .stage-head span {
    display: block;
    margin-top: 8px;
    font-size: 23px;
    line-height: 1.3;
    color: var(--secondary);
  }

  .card {
    padding: 28px 34px 30px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  /* The second rank's row sits further down, so the crossing lines between the rows stay apart. */
  .card.lower { margin-top: 96px; }

  .card .name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    color: var(--text);
  }

  .card .name i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  /* A card's facts: a quiet label and its value, in two aligned columns. */
  .facts {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 16px;
    margin-top: 10px;
    font-size: 23px;
    line-height: 1.3;
  }

  .facts dt { color: var(--tertiary); }

  .facts dd { color: var(--body); }

  /* The label of an all-to-all sits centred in the gutter above the lines it names. */
  .hop {
    position: absolute;
    text-align: center;
    font-size: 21px;
    line-height: 1.35;
    color: var(--body);
  }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  footer {
    font-size: 20px;
    line-height: 1.55;
    color: var(--secondary);
  }

  footer .s { display: inline-block; }
</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Every token returns to the rank it came from</h1>
  </header>

  <div class="figure" id="figure">
    <div class="stages" id="stages"></div>
    <svg class="wires" id="wires"></svg>
  </div>

  <footer>
    <p>
      <span class="s">Lines carry the colour of the batch their tokens came from.</span>
      <span class="s">Dispatch and combine are DeepEP all-to-alls.</span>
      <span class="s">EP is orthogonal to DP, so rank 0 still trains on batch A.</span>
    </p>
  </footer>
</div>

<script>
  /** Every number on the canvas is drawn from these. */
  const SETUP = { ranks: 2, experts: 32 };
  /** Colour marks the batch a rank trains on. */
  const RANK_HUES = ["--halo-blue", "--halo-violet"];
  const NUMBER_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];

  if (SETUP.ranks !== 2) {
    throw new Error("this layout draws 2 ranks");
  }

  if (SETUP.experts % SETUP.ranks !== 0) {
    throw new Error(`${SETUP.experts} experts do not split evenly over ${SETUP.ranks} ranks`);
  }

  const perRank = SETUP.experts / SETUP.ranks;
  const fmt = (n) => n.toLocaleString("en-US");
  /** Text for each `{name}` in the page's static text. */
  const VALUES = {
    ranksWord: NUMBER_WORDS[SETUP.ranks],
    experts: fmt(SETUP.experts),
    perRank: fmt(perRank),
  };
  const BATCHES = Array.from({ length: SETUP.ranks }, (_, rank) => ({
    rank,
    batch: String.fromCharCode(65 + rank),
    hue: `var(${RANK_HUES[rank]})`,
    experts: `${fmt(rank * perRank)}–${fmt((rank + 1) * perRank - 1)}`,
  }));
  const STAGES = [
    {
      head: "Route",
      does: "Router picks the top-k experts of each token",
      card: (b) => ({ name: `R${b.rank}`, hue: b.hue, facts: [["Batch", b.batch]] }),
    },
    {
      head: "Compute",
      does: "One grouped GEMM over the tokens sorted by expert",
      card: (b) => ({ name: `Experts ${b.experts}`, facts: [["Held by", `R${b.rank}`]] }),
    },
    {
      head: "Return",
      does: "Same rows in the same order, weighted by top-k",
      card: (b) => ({ name: `R${b.rank}`, hue: b.hue, facts: [["Batch", b.batch]] }),
    },
  ];
  const HOPS = ["Dispatch all-to-all", "Combine all-to-all"];
  /** Vertical offset of a line's ends from a card's middle, so no two arrowheads meet. */
  const PORT = 14;

  function el(tag, className, text) {
    const node = document.createElement(tag);

    if (className !== undefined) {
      node.className = className;
    }

    if (text !== undefined) {
      node.textContent = text;
    }

    return node;
  }

  function svgEl(tag, attrs) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);

    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, value);
    }

    return node;
  }

  /** Replaces each `{name}` in the canvas text with VALUES[name], in place, so no text node splits. */
  function fillValues() {
    const walker = document.createTreeWalker(document.querySelector(".canvas"), NodeFilter.SHOW_TEXT);

    for (let node = walker.nextNode(); node !== null; node = walker.nextNode()) {
      node.nodeValue = node.nodeValue.replace(/\{(\w+)\}/g, (_, name) => {
        if (!(name in VALUES)) {
          throw new Error(`no value named ${name}`);
        }

        return VALUES[name];
      });
    }
  }

  fillValues();

  const stages = document.getElementById("stages");
  const cards = STAGES.map(() => []);

  for (const stage of STAGES) {
    const head = el("div", "stage-head");
    head.append(el("b", undefined, stage.head), el("span", undefined, stage.does));
    stages.append(head);
  }

  for (const b of BATCHES) {
    STAGES.forEach((stage, i) => {
      const spec = stage.card(b);
      const card = el("div", b.rank === 0 ? "card" : "card lower");
      const name = el("div", "name");

      if (spec.hue !== undefined) {
        const dot = el("i");
        dot.style.setProperty("--hue", spec.hue);
        name.append(dot);
      }

      name.append(spec.name);
      const facts = el("dl", "facts");

      for (const [label, value] of spec.facts) {
        facts.append(el("dt", undefined, label), el("dd", undefined, value));
      }

      card.append(name, facts);

      stages.append(card);
      cards[i].push(card);
    });
  }

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };

  /** A straight line from the right edge of `from` to the left edge of `to`, ending in a small head. */
  function connect(from, to, hue, fromDy, toDy) {
    const a = box(from);
    const z = box(to);
    const x1 = a.r;
    const y1 = (a.t + a.b) / 2 + fromDy;
    const x2 = z.l - 1;
    const y2 = (z.t + z.b) / 2 + toDy;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const len = 8;
    const half = 5;
    const bx = x2 - len * Math.cos(angle);
    const by = y2 - len * Math.sin(angle);
    const px = half * Math.sin(angle);
    const py = -half * Math.cos(angle);
    wires.append(svgEl("line", { x1, y1, x2, y2, stroke: hue, "stroke-width": 2 }));
    wires.append(svgEl("polyline", { points: `${bx + px},${by + py} ${x2},${y2} ${bx - px},${by - py}`, fill: "none", stroke: hue, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }

  const hue = (i) => getComputedStyle(document.documentElement).getPropertyValue(RANK_HUES[i]).trim();

  // Dispatch: each rank's tokens reach both expert slices. Combine: each slice sends every token home.
  for (const [src, dst] of [[0, 1], [1, 2]]) {
    for (let i = 0; i < SETUP.ranks; i += 1) {
      for (let j = 0; j < SETUP.ranks; j += 1) {
        const batch = src === 0 ? i : j;
        const fromCard = cards[src][i];
        const toCard = cards[dst][j];
        connect(fromCard, toCard, hue(batch), (j === 0 ? -1 : 1) * PORT, (i === 0 ? -1 : 1) * PORT);
      }
    }
  }

  // Each hop label sits centred in its gutter, just under the lines it names.
  HOPS.forEach((text, i) => {
    const left = box(cards[i][1]);
    const right = box(cards[i + 1][1]);
    const label = el("div", "hop", text);
    label.style.left = `${left.r}px`;
    label.style.width = `${right.l - left.r}px`;
    figure.append(label);
    label.style.top = `${box(cards[i][1]).b + 14}px`;
  });
</script>
</body>
</html>
