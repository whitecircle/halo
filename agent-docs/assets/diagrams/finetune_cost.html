<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What a step costs by what is trained</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>
  :root {
    --label-col: 400px;
    --bar-h: 40px;
  }

  body { width: 1600px; }

  h1 { font-variant-numeric: lining-nums; }

  /* One row per case: its name, then one stacked bar per column. A group's heading spans the row. */
  .rows {
    display: grid;
    grid-template-columns: var(--label-col) repeat(var(--columns), 1fr);
    column-gap: 40px;
    row-gap: 22px;
    align-items: center;
  }

  .rows .group {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: calc(var(--heading-gap) - 22px);
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  .rows .group.later { margin-top: calc(var(--group-gap) - 22px); }

  .rows .group span {
    font-family: var(--sans);
    font-size: 22px;
    letter-spacing: 0;
    color: var(--secondary);
  }

  .rows .head .name {
    font-size: 25px;
    line-height: 1.2;
    color: var(--text);
  }

  .rows .head .of {
    margin-top: 2px;
    font-size: 20px;
    line-height: 1.25;
    color: var(--secondary);
  }

  .label .case {
    font-size: 25px;
    line-height: 1.2;
    color: var(--body);
    white-space: nowrap;
  }

  .label .sub {
    margin-top: 1px;
    font-size: 20px;
    line-height: 1.25;
    color: var(--secondary);
    white-space: nowrap;
  }

  .track {
    position: relative;
    height: var(--bar-h);
  }

  .track .seg {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: var(--hue);
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #000;
    white-space: nowrap;
    overflow: hidden;
  }

  .track .total {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 21px;
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
  }

  .track .total.none {
    font-weight: 400;
    color: var(--danger);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 36px;
    margin-top: 40px;
    font-size: 21px;
    color: var(--body);
  }

  .legend span { display: inline-flex; align-items: center; gap: 12px; }

  .legend i {
    width: 30px;
    height: 20px;
    border-radius: 5px;
    background: var(--hue);
  }

  .rows .head { margin-bottom: calc(var(--heading-gap) - 22px + 6px); }

  .legend .of {
    min-width: 150px;
    color: var(--secondary);
  }
</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1 id="title"></h1>
  </header>

  <div class="figure" id="figure">
    <div class="rows" id="rows"></div>
    <div class="legend" id="legend"></div>
  </div>

  <footer>
    <p>
      <span class="s">Qwen3-4B in bf16 on one B300: a full step on one row of 4,096 tokens, with Flash Attention and no gradient checkpointing, median of 7 steps.</span>
      <span class="s">LoRA is rank 16 on the four attention projections of every layer.</span>
      <span class="s">Memory is what PyTorch has allocated.</span>
    </p>
  </footer>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  // Measured on one B300 by tests/gpu/profiling/benchmark_training_step.py --experiment trainable --shapes 1x4096
  // --gc off: Qwen/Qwen3-4B-Instruct-2507 in bf16, one row of 4,096 tokens, a full step (forward, backward, AdamWBF16,
  // zero_grad), the model reloaded for each scope.
  // The runs, each named by its --output:
  //   python tests/gpu/profiling/benchmark_training_step.py --experiment trainable --shapes 1x4096 --gc off
  //     --output step-trainable-4b.json
  // step-trainable-4b.json, rows[] by scope: trainable_parameters, seconds_summary.forward / .backward /
  // .optimizer .median and step_seconds_summary.median in ms (7 steps), and in GiB allocated_before_step_bytes,
  // saved_by_forward_bytes and peak_allocated_bytes.
  const RUNS = [
    { scope: "full", trainable: 4022468096, forward: 63.1, backward: 116.1, optimizer: 9.174, step: 188.8, before: 22.51, saved: 26.95, peak: 54.09 },
    { scope: "lora", trainable: 11796480, forward: 85.23, backward: 114.3, optimizer: 8.529, step: 208.2, before: 7.64, saved: 26.48, peak: 38.76 },
    { scope: "first_two", trainable: 201861632, forward: 62.53, backward: 84.23, optimizer: 0.4834, step: 147.3, before: 8.264, saved: 20.36, peak: 33.26 },
    { scope: "last_two", trainable: 201861632, forward: 61.68, backward: 10.21, optimizer: 0.4813, step: 72.38, before: 8.261, saved: 5.314, peak: 18.21 },
  ];
  /** What each scope trains, by its id in the data. */
  const SCOPES = {
    full: "Every parameter",
    lora: "LoRA adapters",
    first_two: "The first two layers",
    last_two: "The last two layers",
  };
  const PHASES = [
    { id: "forward", name: "Forward", hue: "var(--halo-blue)" },
    { id: "backward", name: "Backward", hue: "var(--halo-violet)" },
    { id: "optimizer", name: "Optimizer", hue: "var(--halo-indigo)" },
  ];
  /** The parts of the peak: what is held before the step, what the forward saves, and the rest of the peak. */
  const MEMORY = [
    { id: "before", name: "Held before the step: weights and optimizer state", hue: "var(--body)" },
    { id: "saved", name: "Saved by the forward", hue: "var(--halo-blue)" },
    { id: "rest", name: "Added by the backward at the peak", hue: "var(--halo-violet)" },
  ];

  /** Space between two segments of a bar, and from a bar's end to its total, in px. */
  const SEGMENT_GAP = 3;
  const TOTAL_GAP = 12;

  /**
   * Builds the rows into `root`: per group a heading, per row a label and one stacked bar per column. Every
   * column has its own scale from zero, the longest bar ending where its total still fits in the column. A row's
   * bar for a column is { segments: [{ value, hue, text }], total } or { none: "why there is no bar" }. A column
   * with a name is headed by it and its unit.
   */
  function drawRows(root, { columns, groups }) {
    root.style.setProperty("--columns", columns.length);
    const tracks = [];

    // Columns that carry a name get a row of headings above the first row.
    if (columns.some((column) => column.name !== undefined)) {
      root.append(el("div"));

      for (const column of columns) {
        const head = el("div", "head");
        head.append(el("div", "name", column.name), el("div", "of", column.of));
        root.append(head);
      }
    }

    groups.forEach((group, g) => {
      if (group.heading !== undefined) {
        const heading = el("div", g === 0 ? "group" : "group later", group.heading);

        if (group.note !== undefined) {
          heading.append(el("span", undefined, group.note));
        }

        root.append(heading);
      }

      for (const row of group.rows) {
        const label = el("div", "label");
        label.append(el("div", "case", row.name), el("div", "sub", row.sub));
        root.append(label);

        for (const column of columns) {
          const track = el("div", "track");
          root.append(track);
          tracks.push({ track, column, bar: row.bars[column.id] });
        }
      }
    });

    for (const column of columns) {
      const mine = tracks.filter((t) => t.column === column && t.bar.none === undefined);
      const sum = (bar) => bar.segments.reduce((total, s) => total + s.value, 0);
      const totals = mine.map(({ track, bar }) => {
        const node = el("div", "total", bar.total);
        track.append(node);

        return node;
      });
      const width = mine[0].track.getBoundingClientRect().width;
      // The scale that lets the longest bar and its total end at the column's right edge.
      const scale = Math.min(...mine.map(({ bar }, i) => (width - TOTAL_GAP - totals[i].getBoundingClientRect().width - SEGMENT_GAP * (bar.segments.length - 1)) / sum(bar)));

      mine.forEach(({ track, bar }, i) => {
        let x = 0;

        for (const segment of bar.segments) {
          const node = el("div", "seg");
          const length = segment.value * scale;
          node.style.cssText = `left:${x}px; width:${length}px; --hue:${segment.hue}`;
          track.append(node);

          // A segment prints its value where it is wide enough to hold it. A bar of one segment has its total.
          if (segment.text !== undefined && bar.segments.length > 1) {
            const text = el("span", undefined, segment.text);
            node.append(text);

            if (text.getBoundingClientRect().width + 16 > length) {
              text.remove();
            }
          }

          x += length + SEGMENT_GAP;
        }

        totals[i].style.left = `${x - SEGMENT_GAP + TOTAL_GAP}px`;
      });
    }

    for (const { track, bar } of tracks.filter((t) => t.bar.none !== undefined)) {
      const node = el("div", "total none", bar.none);
      node.style.left = "0";
      track.append(node);
    }
  }

  /** Fills the legend under the rows: one swatch and name per segment kind. */
  function drawLegend(root, items) {
    for (const [hue, text] of items) {
      const item = el("span");
      const dot = el("i");
      dot.style.setProperty("--hue", hue);
      item.append(dot, text);
      root.append(item);
    }
  }

  const fmt = (v) => Math.round(v).toLocaleString("en-US");
  const short = (v) => (v >= 10 ? fmt(v) : v.toFixed(1));
  /** A parameter count as printed: billions to two decimals, millions whole or to one decimal. */
  const count = (n) => (n >= 1e9 ? `${(n / 1e9).toFixed(2)}B` : `${n >= 1e8 ? fmt(n / 1e6) : (n / 1e6).toFixed(1)}M`);
  const byScope = Object.fromEntries(RUNS.map((run) => [run.scope, run]));
  const { full, lora } = byScope;

  document.getElementById("title").textContent =
    `A LoRA step takes ${fmt(lora.step)} ms against the full model’s ${fmt(full.step)}, and peaks at ${fmt(lora.peak)} GiB against ${fmt(full.peak)}`;

  drawRows(document.getElementById("rows"), {
    columns: [
      { id: "time", name: "Step time", of: "Milliseconds" },
      { id: "memory", name: "Peak memory", of: "GiB" },
    ],
    groups: [{
      rows: RUNS.map((run) => {
        const memory = { before: run.before, saved: run.saved, rest: run.peak - run.before - run.saved };

        return {
          name: SCOPES[run.scope],
          sub: `${count(run.trainable)} parameters trained`,
          bars: {
            time: { segments: PHASES.map((phase) => ({ value: run[phase.id], hue: phase.hue, text: short(run[phase.id]) })), total: fmt(run.step) },
            memory: { segments: MEMORY.map((part) => ({ value: memory[part.id], hue: part.hue, text: short(memory[part.id]) })), total: short(run.peak) },
          },
        };
      }),
    }],
  });

  // One legend line per column, each opened by the column's name.
  const legend = document.getElementById("legend");
  const second = el("div", "legend");
  second.style.marginTop = "12px";
  legend.after(second);
  legend.append(el("span", "of", "Step time"));
  second.append(el("span", "of", "Peak memory"));
  drawLegend(legend, PHASES.map((phase) => [phase.hue, phase.name]));
  drawLegend(second, MEMORY.map((part) => [part.hue, part.name]));
</script>
</body>
</html>
