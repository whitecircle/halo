<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fusion round trips</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>

  body { width: 1600px; height: 900px; }

  .figure {
    position: relative;
    margin-block: auto;
    padding-block: 24px;
  }

  /* Two columns in the original's 6.1 : 4.1 split: three naive kernels on the left, the fused one on the right. */
  .columns {
    display: grid;
    grid-template-columns: 6.1fr 4.1fr;
    column-gap: 92px;
  }

  .column { display: flex; flex-direction: column; }

  .column-head {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  .column-head span {
    margin-left: 14px;
    font-family: var(--sans);
    font-size: 23px;
    letter-spacing: 0;
    color: var(--secondary);
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .hbm {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 76px;
    margin-top: 22px;
    font-size: 27px;
    color: var(--text);
  }

  .kernels {
    display: flex;
    gap: 20px;
    margin-top: 196px;
  }

  .column.fused .kernels { justify-content: center; }

  .kernel {
    flex: 1;
    padding: 22px 0 24px;
    text-align: center;
  }

  /* The fused kernel spans the original's 2.8 of its column's 4.1. */
  .column.fused .kernel { flex: 0 0 68%; }

  .kernel .name {
    font-size: 27px;
    color: var(--text);
    white-space: nowrap;
  }

  .kernel p {
    margin-top: 8px;
    font-size: 23px;
    color: var(--body);
  }

  .total {
    margin-top: 34px;
    font-size: 27px;
    color: var(--text);
  }

  .why {
    margin-top: 8px;
    font-size: 23px;
    line-height: 1.35;
    color: var(--body);
  }

  .why em {
    font-style: normal;
    color: var(--hue);
  }

  /* The tensor a pass carries, beside its arrow. */
  .tensor {
    position: absolute;
    font-size: 25px;
    line-height: 1;
    transform: translateY(-50%);
  }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Fusion turns {naive} HBM passes into {fused}</h1>
  </header>

  <div class="figure" id="figure">
    <div class="columns" id="columns"></div>
    <svg class="wires" id="wires"></svg>
  </div>

  <footer>
    <p>
      <span class="s">y = silu(a) · b is elementwise: at an arithmetic intensity near 1, its runtime is its HBM traffic.</span>
    </p>
  </footer>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  const PASS = "var(--halo-blue)";
  const INTERMEDIATE = "var(--halo-violet)";
  /** Tensors that exist only to be re-read by the next kernel. */
  const THROWAWAY = ["s", "t"];
  const COLUMNS = [
    {
      head: "Naive",
      sub: "3 kernels",
      kernels: [
        { name: "s = sigmoid(a)", reads: ["a"], writes: ["s"] },
        { name: "t = a · s", reads: ["a", "s"], writes: ["t"] },
        { name: "y = t · b", reads: ["t", "b"], writes: ["y"] },
      ],
    },
    {
      head: "Fused",
      sub: "1 kernel, Liger or torch.compile",
      kernels: [{ name: "y = silu(a) · b", reads: ["a", "b"], writes: ["y"] }],
    },
  ];

  const passes = (column) => column.kernels.reduce(
    (sum, k) => ({ reads: sum.reads + k.reads.length, writes: sum.writes + k.writes.length }),
    { reads: 0, writes: 0 },
  );
  const [naive, fused] = COLUMNS.map(passes);
  const total = (p) => p.reads + p.writes;

  fillValues({ naive: total(naive), fused: total(fused) });

  /** The line under each column's total. The naive one names the throwaway tensors in their arrows' colour. */
  const why = [
    () => {
      const line = el("p", "why", `${naive.reads} reads + ${naive.writes} writes: `);
      const names = el("em", undefined, `${THROWAWAY.join(" and ")}`);
      names.style.setProperty("--hue", INTERMEDIATE);
      line.append(names, " exist only to be re-read by the next kernel");

      return line;
    },
    () => el("p", "why", "Same math, same FLOPs, intermediates never leave registers"),
  ];
  const totals = [
    `${total(naive)} tensor passes over HBM`,
    `${total(fused)} tensor passes, ~${(total(naive) / total(fused)).toFixed(1)}× less traffic`,
  ];

  const columns = document.getElementById("columns");
  const built = COLUMNS.map((column, i) => {
    const node = el("div", i === 0 ? "column" : "column fused");
    const head = el("div", "column-head", column.head);
    head.append(el("span", undefined, column.sub));
    const hbm = el("div", "card hbm", "HBM");
    const row = el("div", "kernels");
    const cards = column.kernels.map((k) => {
      const card = el("div", "card kernel");
      card.append(el("div", "name", k.name), el("p", undefined, "In registers"));
      row.append(card);

      return card;
    });
    node.append(head, hbm, row, el("div", "total", totals[i]), why[i]());
    columns.append(node);

    return { column, hbm, cards };
  });

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const color = (token) => getComputedStyle(document.documentElement).getPropertyValue(token.slice(4, -1)).trim();

  // Reads run down from HBM into a kernel, writes run back up, spread evenly across the kernel's top.
  for (const { column, hbm, cards } of built) {
    const top = box(hbm).b;

    column.kernels.forEach((k, i) => {
      const card = box(cards[i]);
      const flows = [...k.reads.map((t) => [t, "read"]), ...k.writes.map((t) => [t, "write"])];

      flows.forEach(([tensor, way], j) => {
        const x = card.l + ((card.r - card.l) * (j + 1)) / (flows.length + 1);
        const hue = THROWAWAY.includes(tensor) ? INTERMEDIATE : PASS;
        const [from, to] = way === "read" ? [top + 1, card.t - 3] : [card.t - 1, top + 3];
        arrow(wires, x, from, x, to, color(hue));
        const label = el("div", "tensor", tensor);
        label.style.cssText = `left:${x + 12}px; top:${(top + card.t) / 2}px; color:${hue}`;
        figure.append(label);
      });
    });
  }
</script>
</body>
</html>
