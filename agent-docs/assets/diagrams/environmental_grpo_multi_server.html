<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two rollout servers</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>

  body { width: 1600px; height: 900px; }

  .figure {
    position: relative;
    margin-block: auto;
    padding-block: 22px;
  }

  /* Trainer and actors on the left, the server on the right, a gutter between for the lines. */
  .topology {
    display: grid;
    grid-template-columns: 580px 1fr 580px;
    align-items: center;
    row-gap: 50px;
  }

  .card {
    padding: 24px 30px 26px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .card .name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    color: var(--text);
  }

  .card .name i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  /* A card's facts: a quiet label and its value, in two aligned columns. */
  .rows {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 16px;
    row-gap: 4px;
    margin-top: 16px;
    font-size: 23px;
    line-height: 1.35;
  }

  .rows dt { color: var(--tertiary); }

  .rows dd { color: var(--body); }

  /* The GPUs a component holds, numbered, in its colour. */
  .gpus {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    font-size: 20px;
    color: var(--secondary);
  }

  .gpus span { margin-right: 6px; }

  .gpus b {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    font-weight: 400;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: var(--bg);
    background: var(--hue);
  }

  .wire-label {
    position: absolute;
    font-size: 21px;
    line-height: 1.35;
    color: var(--body);
    white-space: nowrap;
  }

  .wire-label .quiet { color: var(--secondary); }

  /* One step on the clock: a lane per side, segments drawn to one scale. */
  .clock { margin-top: 42px; }

  .clock-head {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  .lane {
    display: grid;
    grid-template-columns: 150px 1fr;
    align-items: center;
  }

  .clock-head + .lane { margin-top: 20px; }

  .lane + .lane { margin-top: 6px; }

  .lane-name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    color: var(--body);
  }

  .lane-name i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  .track {
    display: flex;
    gap: 5px;
  }

  .seg {
    display: grid;
    place-items: center;
    height: 48px;
    border-radius: 12px;
    font-size: 21px;
    white-space: nowrap;
  }

  .seg.work { background: var(--hue); color: var(--bg); }

  .seg.sync { background: color-mix(in oklab, var(--hue) 30%, var(--surface)); color: var(--text); }

  .seg.idle { background: var(--surface); border: 1px solid var(--line); color: var(--secondary); }

  .seg.gone { border: 1px dashed var(--tertiary); color: var(--secondary); }

  .seg.space { visibility: hidden; }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Two servers overlap the round and the update</h1>
  </header>

  <div class="figure" id="figure">
    <div class="topology" id="topology"></div>
    <div class="clock" id="clock"></div>
    <svg class="wires" id="wires"></svg>
  </div>

  <footer>
    <p>
      <span class="s">Bar lengths are illustrative.</span>
      <span class="s">Each push pauses both servers, and prefetch holds <span class="nw">prefetch_depth</span> rounds in flight, one by default.</span>
    </p>
  </footer>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  const TRAINER = "var(--halo-blue)";
  const ENGINE = "var(--halo-violet)";
  const ACTORS = "var(--halo-indigo)";

  const TRAINER_GPUS = [0, 1, 2, 3, 4, 5];
  const CARDS = {
    trainer: {
      name: "Trainer",
      hue: TRAINER,
      gpus: TRAINER_GPUS,
      rows: [
        ["Ranks", `${TRAINER_GPUS.length} under torchrun`],
        ["Sync", "rank 0, binds both stores"],
      ],
    },
    actors: {
      name: "Ray environment actors",
      hue: ACTORS,
      rows: [
        ["Budget", "rollout_actor_budget per node"],
        ["Runs on", "the CPUs"],
      ],
    },
    server1: {
      name: "Rollout server 1",
      hue: ENGINE,
      gpus: [6],
      rows: [
        ["Engine", "vLLM :8000 or SGLang :30000"],
        ["Sync", "own group, store :51216"],
      ],
    },
    server2: {
      name: "Rollout server 2",
      hue: ENGINE,
      gpus: [7],
      rows: [
        ["Engine", "vLLM :8001 or SGLang :30001"],
        ["Sync", "own group, store :51217"],
      ],
    },
  };
  const LINKS = {
    sync: ["NCCL weight sync"],
    http: ["HTTP requests", "round-robin over the two URLs"],
  };

  /** Phase lengths in one unit, shared by both server figures so their bars compare. */
  const SYNC = 0.65;
  const ROUND = 4.9;
  const UPDATE = 2.6;
  const LANES = [
    {
      name: "Trainer",
      hue: TRAINER,
      segs: [
        ["sync", SYNC, "sync"],
        ["update on the round before", UPDATE, "work"],
        ["waiting", ROUND - UPDATE, "idle"],
        ["", UPDATE, "space"],
      ],
    },
    {
      name: "Engines",
      hue: ENGINE,
      segs: [["paused", SYNC, "sync"], ["generating this round", ROUND, "work"], ["what prefetch removes", UPDATE, "gone"]],
    },
  ];
  const STEP = "One step = sync + max(round, update)";
  /** Vertical offset of a line's ends from a card's middle, so no two arrowheads meet. */
  const PORT = 14;
  /** Where the Ray link leaves the trainer card, as a share of its width. */
  const RAY_AT = 0.3;

  function buildCard(spec) {
    const card = el("div", "card");
    const name = el("div", "name");
    const dot = el("i");
    dot.style.setProperty("--hue", spec.hue);
    name.append(dot, spec.name);

    if (spec.gpus !== undefined) {
      const gpus = el("div", "gpus");
      gpus.style.setProperty("--hue", spec.hue);
      gpus.append(el("span", undefined, spec.gpus.length > 1 ? "GPUs" : "GPU"));

      for (const gpu of spec.gpus) {
        gpus.append(el("b", undefined, String(gpu)));
      }

      name.append(gpus);
    }

    const rows = el("dl", "rows");

    for (const [term, value] of spec.rows) {
      rows.append(el("dt", undefined, term), el("dd", undefined, value));
    }

    card.append(name, rows);

    return card;
  }

  const topology = document.getElementById("topology");
  const trainer = buildCard(CARDS.trainer);
  const actors = buildCard(CARDS.actors);
  const servers = [buildCard(CARDS.server1), buildCard(CARDS.server2)];
  trainer.style.gridArea = "1 / 1";
  actors.style.gridArea = "2 / 1";
  servers[0].style.gridArea = "1 / 3";
  servers[1].style.gridArea = "2 / 3";
  topology.append(trainer, actors, ...servers);

  const clock = document.getElementById("clock");
  const total = SYNC + ROUND + UPDATE;
  clock.append(el("div", "clock-head", STEP));

  for (const lane of LANES) {
    const row = el("div", "lane");
    const name = el("div", "lane-name");
    const dot = el("i");
    dot.style.setProperty("--hue", lane.hue);
    name.append(dot, lane.name);
    const track = el("div", "track");

    for (const [text, units, kind] of lane.segs) {
      const seg = el("div", `seg ${kind}`, text);
      seg.style.setProperty("--hue", lane.hue);
      // Every edge lands at its share of the track whatever the number of gaps before it.
      seg.style.flex = `0 0 calc(${units / total} * (100% + 5px) - 5px)`;
      track.append(seg);
    }

    row.append(name, track);
    clock.append(row);
  }

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const css = (value) => getComputedStyle(document.documentElement).getPropertyValue(value.slice(4, -1)).trim();

  /** A straight 2px line from (x1, y1) to (x2, y2), ending in a small head. */

  /** A straight line from the right edge of `from` to the left edge of `to`, ending in a small head. */
  function connect(from, to, hue, fromDy, toDy) {
    const a = box(from);
    const z = box(to);
    arrow(wires, a.r, (a.t + a.b) / 2 + fromDy, z.l - 1, (z.t + z.b) / 2 + toDy, hue);
  }

  /** A label of one or more lines, every line after the first quieter. */
  function label(lines, left, top, width) {
    const node = el("div", "wire-label");
    lines.forEach((line, i) => node.append(el("div", i === 0 ? undefined : "quiet", line)));
    node.style.left = `${left}px`;
    node.style.top = `${top}px`;

    if (width !== undefined) {
      node.style.width = `${width}px`;
      node.style.textAlign = "center";
    }

    figure.append(node);

    return node;
  }

  const t = box(trainer);
  const a = box(actors);
  const s = box(servers[0]);

  // The trainer syncs both servers and the actors round-robin over both: each line leaves and lands
  // above the middle for the first server or the trainer, below it for the second or the actors.
  servers.forEach((server, j) => {
    connect(trainer, server, css(TRAINER), (j === 0 ? -1 : 1) * PORT, -PORT);
    connect(actors, server, css(ACTORS), (j === 0 ? -1 : 1) * PORT, PORT);
  });
  const above = label(LINKS.sync, t.r, 0, s.l - t.r);
  above.style.top = `${(t.t + t.b) / 2 - PORT - 12 - above.offsetHeight}px`;
  label(LINKS.http, a.r, (a.t + a.b) / 2 + PORT + 12, s.l - a.r);

  const rayX = t.l + RAY_AT * (t.r - t.l);
  arrow(wires, rayX, t.b, rayX, a.t - 1, css("var(--tertiary)"));
  const ray = label(["Ray, on this host"], rayX + 14, 0);
  ray.style.top = `${(t.b + a.t) / 2 - ray.offsetHeight / 2}px`;
</script>
</body>
</html>
