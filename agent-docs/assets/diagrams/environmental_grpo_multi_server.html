<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two rollout servers</title>
<link rel="stylesheet" href="../../../skills/visuals/kit/figure.css">
<style>
  :root {
    --section-gap: 36px;
    --lane-label: 190px;
  }

  body { width: 1600px; height: 900px; }

  .figure {
    position: relative;
    margin-block: auto;
  }

  .section-head {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 33px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--heading);
  }

  /* The host's GPUs in a row after the section name, then the key to their colours. */
  .split {
    display: flex;
    align-items: center;
  }

  .split .section-head { width: var(--lane-label); }

  .chips {
    display: flex;
    gap: 8px;
  }

  .chip {
    display: grid;
    place-items: center;
    width: 64px;
    height: 46px;
    border-radius: 9px;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    color: var(--bg);
    background: var(--hue);
  }

  .key {
    display: flex;
    gap: 36px;
    margin-left: 56px;
    font-size: 22px;
    color: var(--body);
  }

  .key span {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .key i {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--hue);
  }

  .split + .section-head,
  .topology + .section-head { margin-top: var(--section-gap); }

  /* Trainer and actors on the left, the servers on the right, a gutter between for the lines. */
  .topology {
    display: grid;
    grid-template-columns: 560px 1fr 620px;
    row-gap: 14px;
    margin-top: 16px;
  }

  .card {
    padding: 18px 26px 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }

  .card .name {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 27px;
    line-height: 1.2;
    color: var(--text);
  }

  .card .name i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--hue);
  }

  .card .lines {
    margin-top: 10px;
    font-size: 23px;
    line-height: 1.32;
    color: var(--body);
    white-space: nowrap;
  }

  .wire-label {
    position: absolute;
    font-size: 21px;
    line-height: 1.3;
    color: var(--body);
    text-align: center;
    white-space: nowrap;
  }

  .wire-label .quiet { color: var(--secondary); }

  /* One step on the clock: a lane per side, segments drawn to one scale. */
  .lane {
    display: grid;
    grid-template-columns: var(--lane-label) 1fr;
    align-items: center;
  }

  .section-head + .lane { margin-top: 16px; }

  .lane + .lane { margin-top: 6px; }

  .lane-name {
    font-size: 22px;
    color: var(--body);
  }

  .track {
    display: flex;
    gap: 5px;
  }

  .seg {
    display: grid;
    place-items: center;
    height: 46px;
    border-radius: 10px;
    font-size: 21px;
    white-space: nowrap;
  }

  .seg.work { background: var(--hue); color: var(--bg); }

  .seg.sync { background: color-mix(in oklab, var(--hue) 30%, var(--surface)); color: var(--text); }

  .seg.idle { background: var(--surface); border: 1px solid var(--line); color: var(--secondary); }

  .seg.gone { border: 1px dashed var(--tertiary); color: var(--secondary); }

  .seg.space { visibility: hidden; }

  svg.wires {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="canvas">
  <header>
    <h1>Two servers overlap the round and the update</h1>
  </header>

  <div class="figure" id="figure">
    <div class="split" id="split"></div>
    <div class="section-head">Topology</div>
    <div class="topology" id="topology"></div>
    <div class="section-head" id="clock-head"></div>
    <div id="lanes"></div>
    <svg class="wires" id="wires"></svg>
  </div>

  <footer>
    <p>
      <span class="s">The streamed sync pauses both servers for the whole push.</span>
      <span class="s">Prefetch holds <span class="nw">prefetch_depth</span> rounds, one by default.</span>
      <span class="s">Bar lengths are illustrative.</span>
    </p>
  </footer>
</div>

<script src="../../../skills/visuals/kit/figure.js"></script>
<script>
  const TRAINER = "var(--halo-blue)";
  const ENGINE = "var(--halo-violet)";
  const ACTORS = "var(--halo-indigo)";

  const GPUS = 8;
  /** One entry per server, in rollout_server_configs order: its GPU and the line its card ends on. */
  const SERVERS = [
    { gpu: 6, note: "ranks 1+, dials the trainer host" },
    { gpu: 7, note: "group port = rollout_group_port + index" },
  ];
  const SERVER_GPUS = SERVERS.map((server) => server.gpu);
  const TRAINER_GPUS = [...Array(GPUS).keys()].filter((g) => !SERVER_GPUS.includes(g));
  const GROUP_PORT = 51216;
  const VLLM_PORT = 8000;
  const groupPort = (i) => GROUP_PORT + i;

  const CARDS = {
    trainer: {
      name: `Trainer, GPU ${TRAINER_GPUS[0]}–${TRAINER_GPUS.at(-1)}`,
      hue: TRAINER,
      lines: [
        `torchrun --nproc_per_node=${TRAINER_GPUS.length}`,
        "rank 0 of both sync groups",
        `binds ${SERVERS.map((_, i) => `:${groupPort(i)}`).join(" and ")}`,
      ],
    },
    actors: {
      name: "Ray environment actors",
      hue: ACTORS,
      lines: ["rollout_actor_budget per node", "round-robin over the server URLs"],
    },
    servers: SERVERS.map((server, i) => ({
      name: `Server ${i + 1}, GPU ${server.gpu}`,
      hue: ENGINE,
      lines: [`:${VLLM_PORT + i} · NCCL group port ${groupPort(i)}`, server.note],
    })),
  };
  const LINKS = {
    sync: ["NCCL weight sync"],
    http: ["POST", "/v1/chat/completions"],
  };

  /** Phase lengths in one unit, shared by both server figures so their bars compare. */
  const SYNC = 0.65;
  const ROUND = 4.9;
  const UPDATE = 2.6;
  const LANES = [
    {
      name: "Trainer",
      segs: [
        ["sync", SYNC, "sync", ENGINE],
        ["update on the round before", UPDATE, "work", TRAINER],
        ["waiting", ROUND - UPDATE, "idle"],
        ["", UPDATE, "space"],
      ],
    },
    {
      name: "Engines",
      segs: [
        ["paused", SYNC, "sync", ENGINE],
        ["generating this round", ROUND, "work", ACTORS],
        ["what prefetch removes", UPDATE, "gone"],
      ],
    },
  ];
  const STEP = "One step on the clock: sync + max(round, update)";
  /** How far the bracket that gathers the servers stands off their left edge, and the reach of its end ticks. */
  const BRACKET = { off: 26, tick: 12 };

  function buildCard(spec) {
    const card = el("div", "card");
    const name = el("div", "name");
    const dot = el("i");
    dot.style.setProperty("--hue", spec.hue);
    name.append(dot, spec.name);
    const lines = el("div", "lines");

    for (const line of spec.lines) {
      lines.append(el("div", undefined, line));
    }

    card.append(name, lines);

    return card;
  }

  const split = document.getElementById("split");
  const chips = el("div", "chips");

  for (let gpu = 0; gpu < GPUS; gpu += 1) {
    const chip = el("div", "chip", String(gpu));
    chip.style.setProperty("--hue", SERVER_GPUS.includes(gpu) ? ENGINE : TRAINER);
    chips.append(chip);
  }

  const key = el("div", "key");

  for (const [hue, text] of [[TRAINER, "trainer rank"], [ENGINE, "rollout engine"]]) {
    const item = el("span");
    const swatch = el("i");
    swatch.style.setProperty("--hue", hue);
    item.append(swatch, text);
    key.append(item);
  }

  split.append(el("div", "section-head", "GPU split"), chips, key);

  // The first server tops the trainer's row, the last floors the actors' row.
  const topology = document.getElementById("topology");
  const trainer = buildCard(CARDS.trainer);
  const actors = buildCard(CARDS.actors);
  const servers = CARDS.servers.map(buildCard);
  trainer.style.gridArea = "1 / 1";
  actors.style.gridArea = "2 / 1";
  servers.forEach((server, i) => {
    server.style.gridArea = `${i + 1} / 3`;
    server.style.alignSelf = i === 0 ? "start" : "end";
  });
  topology.append(trainer, actors, ...servers);

  document.getElementById("clock-head").textContent = STEP;
  const lanes = document.getElementById("lanes");
  const total = SYNC + ROUND + UPDATE;

  for (const lane of LANES) {
    const row = el("div", "lane");
    const track = el("div", "track");

    for (const [text, units, kind, hue] of lane.segs) {
      const seg = el("div", `seg ${kind}`, text);
      seg.style.setProperty("--hue", hue ?? "var(--surface)");
      // Every edge lands at its share of the track whatever the number of gaps before it.
      seg.style.flex = `0 0 calc(${units / total} * (100% + 5px) - 5px)`;
      track.append(seg);
    }

    row.append(el("div", "lane-name", lane.name), track);
    lanes.append(row);
  }

  const figure = document.getElementById("figure");
  const wires = document.getElementById("wires");
  const origin = figure.getBoundingClientRect();
  const box = (node) => {
    const r = node.getBoundingClientRect();

    return { l: r.left - origin.left, r: r.right - origin.left, t: r.top - origin.top, b: r.bottom - origin.top };
  };
  const css = (value) => getComputedStyle(document.documentElement).getPropertyValue(value.slice(4, -1)).trim();

  /** A label of one or more lines, centred over [left, right], every line after the first quieter. */
  function label(lines, left, right) {
    const node = el("div", "wire-label");
    lines.forEach((line, i) => node.append(el("div", i === 0 ? undefined : "quiet", line)));
    node.style.left = `${left}px`;
    node.style.width = `${right - left}px`;
    figure.append(node);

    return node;
  }

  const t = box(trainer);
  const a = box(actors);
  const first = box(servers[0]);
  const last = box(servers.at(-1));
  // A bracket gathers the servers: the sync reaches every one of them, and the requests round-robin over them.
  const bx = first.l - BRACKET.off;
  const engine = css(ENGINE);
  wires.append(
    svgEl("polyline", {
      points: `${bx + BRACKET.tick},${first.t} ${bx},${first.t} ${bx},${last.b} ${bx + BRACKET.tick},${last.b}`,
      fill: "none",
      stroke: engine,
      "stroke-width": 2,
      "stroke-linejoin": "round",
    }),
  );
  const syncY = (t.t + t.b) / 2;
  const httpY = (a.t + a.b) / 2;
  arrow(wires, t.r, syncY, bx - 1, syncY, engine);
  arrow(wires, a.r, httpY, bx - 1, httpY, css(ACTORS));
  const above = label(LINKS.sync, t.r, bx);
  above.style.top = `${syncY - 12 - above.offsetHeight}px`;
  label(LINKS.http, a.r, bx).style.top = `${httpY + 12}px`;
</script>
</body>
</html>
