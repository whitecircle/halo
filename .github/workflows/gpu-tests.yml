name: gpu-tests

# Core GPU test tier on a trusted self-hosted runner on the GPU box — Halo needs Blackwell (SM100)
# or Hopper (SM90) for FA3/FA4 + DeepEP, which no GitHub-hosted runner provides. Only
# `workflow_dispatch` is active until that runner is registered; enabling the `pull_request` trigger
# below keeps it label-gated (`run-ci-gpu`), and contributor code runs creds-free (`ENV_FILE=
# AWS_DIR=`) under `pull_request`, never `pull_request_target`. Setup: agent-docs/infrastructure/ci.md.

on:
  workflow_dispatch:
  # pull_request:
  #   types: [opened, synchronize, reopened, labeled]

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-core:
    # Label must match the self-hosted runner registered on the GPU box.
    runs-on: [self-hosted, halo]
    # Run on manual dispatch; on PRs only when non-draft AND labeled run-ci-gpu.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       contains(github.event.pull_request.labels.*.name, 'run-ci-gpu'))
    # Ceiling for the whole tier; the launches it runs are listed in tests/gpu/manifest.py.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify the runtime image is present
        run: |
          docker image inspect "${IMAGE:-halo:blackwell}" >/dev/null 2>&1 \
            || { echo "::error::${IMAGE:-halo:blackwell} not found on this runner — build it with 'make build-blackwell'"; exit 1; }

      - name: Core GPU tests (in image, creds-free)
        run: make test-gpu-core ENV_FILE= AWS_DIR= PYTEST_ARGS="--junitxml=gpu-junit.xml -ra"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gpu-junit
          path: gpu-junit.xml
          if-no-files-found: warn
