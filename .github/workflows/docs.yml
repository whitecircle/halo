name: docs

# mkdocs is light pure-Python, so docs build on the host. Builds agent-docs/ with --strict
# (nav/link integrity) and link-checks the unbuilt trees (human-docs/, root markdown) on pushes
# to main and on PRs. Deploying the built site is left to the maintainer.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  # Superseding runs cancel PR runs only: on main, github.ref is the same for every push, and a
  # merge burst would leave the earlier commits with no status at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install mkdocs-material at the locked version
        run: pip install --quiet "mkdocs-material==$(awk '/^name = "mkdocs-material"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)"
      - name: mkdocs build --strict (docs)
        run: mkdocs build --strict
      - name: relative-link check (human-docs, skills, root markdown)
        run: ./scripts/docs/check_links.sh

  diagrams:
    # The figures under agent-docs/assets/ are generated by scripts/diagrams/ and committed as binaries,
    # so an edit to a generator that skips the regeneration ships a figure teaching a config key or
    # class name the code no longer has, and no other gate sees it. Regenerate and byte-compare.
    #
    # Runs in python:3.12-slim with matplotlib pinned to uv.lock (the training image's version), NOT
    # on the bare runner: rendering is byte-reproducible only while the font set is, and matplotlib
    # resolves the flow figures' sans stack to its own bundled DejaVu exactly when no system fonts
    # are installed. The container reproduces `make diagrams` in `halo:blackwell` byte for byte; a
    # fonts-carrying runner image is not guaranteed to.
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v5
      - name: Install matplotlib at the locked version
        run: pip install --quiet "matplotlib==$(awk '/^name = "matplotlib"$/{f=1} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' uv.lock)"
      - name: Regenerate the figures
        # Each generator writes at import time and most carry no `__main__` guard, so run them one
        # per interpreter. This mirrors `make diagrams`.
        run: |
          find agent-docs/assets -name '*.png' | sort > /tmp/before.list
          xargs -a /tmp/before.list sha256sum > /tmp/before.sha256
          for g in scripts/diagrams/gen_*.py; do python "$g" >/dev/null; done
      - name: Fail on a stale committed figure
        run: |
          find agent-docs/assets -name '*.png' | sort > /tmp/after.list
          diff /tmp/before.list /tmp/after.list \
            || { echo "::error::A generator writes a figure that is not committed — add it."; exit 1; }
          sha256sum --check --quiet /tmp/before.sha256 \
            || { echo "::error::Committed figures are stale — run 'make diagrams' and commit the result."; exit 1; }

  markdownlint:
    # Warn-mode: surfaces markdown-hygiene issues as annotations without blocking the PR
    # (human-docs/ is in the globs and is not held to a lints-clean bar). The action pins
    # markdownlint-cli2 0.17.x; a bump past 0.18 adds MD060 (table-column-style), which needs a
    # config decision in the same change.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: markdownlint (docs)
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        continue-on-error: true
        with:
          globs: |
            agent-docs/**/*.md
            human-docs/**/*.md
            skills/**/*.md
