name: docs

# All docs are plain GitHub-rendered markdown — there is no site build.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  # Superseding runs cancel PR runs only: on main, github.ref is the same for every push, and a
  # merge burst would leave the earlier commits with no status at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: links, anchors and code references (agent-docs, human-docs, skills, root markdown)
        run: ./scripts/docs/check_links.sh
