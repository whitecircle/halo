name: cpu-tests

# CPU test tier. The tests import torch, so they run inside the prebuilt `halo:blackwell` image on
# a self-hosted runner, without `--gpus`; `make test-cpu` uses the creds-free DOCKER_RUN_CPU (no
# `.env`/`~/.aws` mount), so contributor code is safe to run here. Only `workflow_dispatch` is
# active until that runner is registered. This tier has no label gate, so per-run fork approval is
# its only maintainer opt-in — set it up before enabling `pull_request`: agent-docs/infrastructure/ci.md.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu:
    # The label must match the registered self-hosted runner on the GPU box.
    runs-on: [self-hosted, halo]
    # Skip draft PRs (still runs on pushes to main and on ready PRs).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # The tier takes ~1.5 h in one pytest process.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the runtime image is present
        run: |
          docker image inspect "${IMAGE:-halo:blackwell}" >/dev/null 2>&1 \
            || { echo "::error::${IMAGE:-halo:blackwell} not found on this runner — build it with 'make build-blackwell'"; exit 1; }

      - name: CPU tests (in image, no GPU)
        run: make test-cpu PYTEST_ARGS="--junitxml=cpu-junit.xml -ra"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-junit
          path: cpu-junit.xml
          if-no-files-found: warn
