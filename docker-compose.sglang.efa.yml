# EFA overlay for docker-compose.sglang.yml — the weight-sync group rides the fabric. Layer it after
# the base:
#   SGLANG_MODEL=... docker compose -f docker-compose.sglang.yml -f docker-compose.sglang.efa.yml up -d
# The host supplies the EFA driver and /dev/infiniband, the trainer container the same devices and
# net (`make ... EFA=1`), plus SGLANG_GROUP_HOST when the default-route NIC is not reachable.

services:
  sglang-server:
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
    environment:
      # Naming the plugin's net makes a missing or broken plugin fail group formation instead of
      # silently falling back to sockets.
      - NCCL_NET=${NCCL_NET:-Libfabric}
      - NCCL_NET_PLUGIN=${NCCL_NET_PLUGIN:-ofi}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-0}
      # The bootstrap and rendezvous ride the ENA interface. NCCL's exclusion list must name lo: an
      # excluded-only list still ranks loopback first, and a server advertising 127.0.0.1 to a
      # trainer on another node fails formation. Name the interface outright when it is too coarse.
      - NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-^lo,docker,veth,tailscale}
