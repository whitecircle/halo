# SDPG self-distillation (text) — GPT-OSS 20B (EP=8) on OpenR1-Math-220k. See agent-docs/training-methods/distillation/self-distillation.md.
# Dataset: raw SFT conversations plus privileged answer/solution fields; do not pre-tokenize.
# Launch: torchrun --nproc_per_node=8 scripts/training/distillation/self_distill.py <this config>

model_name_or_path: unsloth/gpt-oss-20b-BF16
dataset: open-r1/OpenR1-Math-220k:default
conversation_field: messages
test_size: 0.02

# --- Parallelism ---
expert_parallel_size: 8

# --- Self-distillation (OPD) loss ---
sdpg_beta_warmup_steps: 50
sdpg_beta_decay_steps: 100

# The multiturn jinja renders EVERY assistant turn with <|channel|>final and ends each with <|return|>,
# the completion-span terminator, so completion-only masking trains every turn. Harmony renders a plain
# assistant turn channel-less (<|start|>assistant<|message|>...) and ends only the final turn with
# <|return|> (earlier turns close with <|end|>, not a terminator): the marker below would then match no
# turn at all, and its channel-less spelling would train only the last assistant turn.
chat_template: jinja-templates/gpt-oss/gpt-oss-multiturn.jinja
force_chat_template: true
assistant_message_template: <|start|>assistant<|channel|>final<|message|>

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: false   # ~65 GB of activations at 16,384 tokens; set true on 80 GB GPUs
learning_rate: 1.0e-5
num_train_epochs: 1
max_length: 16384   # OpenR1 R1-traces run long; the self-distill collator raises on over-length rows

output_dir: checkpoints/self-distill-gptoss-20b
report_to: wandb
