# Embedding fine-tune — Qwen3-Embedding-4B on Natural Questions (MNRL, in-batch negatives).
# Launch: python scripts/training/embedding.py <this config>
#   or: torchrun --nproc_per_node=2 scripts/training/embedding.py <this config> --tensor_parallel_size=2

# --- Model ---
model_name_or_path: Qwen/Qwen3-Embedding-4B
attn_implementation: flash_attention_2

# --- Dataset ---
dataset: sentence-transformers/natural-questions
test_size: 0.01

# --- Training ---
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
num_train_epochs: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-05
lr_scheduler_type: cosine
warmup_steps: 32
weight_decay: 0.01
seed: 42

# --- Embedding-specific ---
loss_type: mnrl
pooling_mode: lasttoken
max_length: 512
batch_sampler: no_duplicates
dataloader_drop_last: true
# matryoshka_dimensions: [2560, 1024, 512, 256, 128, 64]

# --- Output ---
output_dir: checkpoints/embedding-qwen3-4b-nq
save_strategy: steps
save_steps: 500
eval_strategy: steps
eval_steps: 500
report_to: wandb

# --- Logging ---
logging_steps: 50
