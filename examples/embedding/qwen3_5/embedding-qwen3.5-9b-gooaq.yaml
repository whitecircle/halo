# Embedding fine-tune — Qwen3.5-9B chat model turned into an embedder on GooAQ (MNRL, in-batch negatives).
# The two dataset columns (question, answer) map positionally to anchor/positive in the ST collator.
# Launch: python scripts/training/embedding.py <this config>
#   or: torchrun --nproc_per_node=2 scripts/training/embedding.py <this config> --tensor_parallel_size=2

# --- Model ---
model_name_or_path: Qwen/Qwen3.5-9B
attn_implementation: sdpa   # embedding batches are right-padded, and FA2 unpads them into the
                            #   M-RoPE varlen path that crashes this family (FA2 is only safe with
                            #   packing: true — see agent-docs/models/qwen3_5.md)

# --- Dataset ---
dataset: sentence-transformers/gooaq:pair
test_size: 0.01

# --- Training ---
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
num_train_epochs: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-05
lr_scheduler_type: cosine
warmup_steps: 32
weight_decay: 0.01
seed: 42

# --- Embedding-specific ---
loss_type: mnrl
pooling_mode: lasttoken
max_length: 512
batch_sampler: no_duplicates
dataloader_drop_last: true

# --- Output ---
output_dir: checkpoints/embedding-qwen3.5-9b-gooaq
save_strategy: steps
save_steps: 500
eval_strategy: steps
eval_steps: 500
report_to: wandb

# --- Logging ---
logging_steps: 50
