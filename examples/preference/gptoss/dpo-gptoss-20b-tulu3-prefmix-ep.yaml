# DPO — GPT-OSS 20B on the Tulu-3 preference mixture, EP=8, LoRA (the PEFT adapters are the implicit
# reference; full fine-tuning under EP/TP takes precompute_ref_log_probs: true, or loads a frozen
# reference as a whole dense replica on every rank).
# Blackwell only: attention is pinned to FA4, which the Hopper image does not carry.
# Launch: torchrun --nproc_per_node=8 scripts/training/preference/dpo.py <this config>

# --- Model ---
model_name_or_path: unsloth/gpt-oss-20b-BF16
model_init_kwargs:
  router_aux_loss_coef: 0.001         # the hub config ships 0.9, which would dominate the DPO loss
attn_implementation: flash_attention_4   # these scripts' unset pick on Blackwell (SDPA elsewhere); sinks stay reset (the default)

# --- Parallelism ---
expert_parallel_size: 8

# --- Dataset ---
dataset: allenai/llama-3.1-tulu-3-8b-preference-mixture
test_size: 0.005

# --- DPO Hyperparameters ---
beta: 0.1
loss_type: sigmoid

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
num_train_epochs: 2
gradient_accumulation_steps: 8
gradient_checkpointing: false   # a full 2 x 4,096 pair holds ~33 GB of activations
learning_rate: 5.0e-07
lr_scheduler_type: cosine
warmup_steps: 20

# --- Sequence Lengths ---
# DPO has no training-side prompt cap: TRL truncates prompt + completion to max_length keep_start,
# so an over-long prompt eats its own completion. generation_max_prompt_length bounds eval generation only.
max_length: 4096
generation_max_prompt_length: 2048

# --- Output ---
output_dir: checkpoints/dpo-gptoss-20b-tulu3-prefmix-ep
save_steps: 200
eval_strategy: steps
eval_steps: 200
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb

# --- Data ---
dataloader_num_workers: 2

# --- PEFT (disabling the adapters gives the reference model) ---
use_peft: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0                  # disable_dropout (on by default) zeroes LoRA dropout after the wrap
lora_target_modules:               # attention only; expert projections need EP grouped adapters (split_expert_lora_targets)
- q_proj
- k_proj
- v_proj
- o_proj
