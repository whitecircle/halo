# DPO — Gemma-4 26B-A4B on the Tulu-3 preference mixture, EP=8, LoRA (the PEFT adapters ARE the implicit
# reference — an explicit reference model is rejected under EP/TP; full fine-tuning there needs
# precompute_ref_log_probs: true instead).
# Launch: torchrun --nproc_per_node=8 scripts/training/preference/dpo.py <this config>

# --- Model ---
model_name_or_path: google/gemma-4-26B-A4B-it
attn_implementation: sdpa             # only viable backend (global_head_dim=512; mem-efficient SDPA auto-forced)
# Gemma4 has no aux-loss term and no EP bias-update support — no active load-balancing path exists.
moe_balancing: none

# --- Parallelism ---
expert_parallel_size: 8

# --- Dataset ---
dataset: allenai/llama-3.1-tulu-3-8b-preference-mixture
test_size: 0.005   # 273k rows — 0.005 keeps each eval pass near ~1.4k pair forwards

# --- DPO Hyperparameters ---
beta: 0.1
loss_type: sigmoid

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
num_train_epochs: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true   # EP requires reentrant GC (the trainer force-promotes false)
optim: adamw_torch_fused
learning_rate: 5.0e-07
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 20
seed: 42

# --- Sequence Lengths ---
# DPO has no training-side prompt cap: TRL truncates prompt + completion to max_length keep_start,
# so an over-long prompt eats its own completion. generation_max_prompt_length bounds eval generation only.
max_length: 4096
generation_max_prompt_length: 2048

# --- Output ---
output_dir: checkpoints/dpo-gemma4-26b-a4b-tulu3-prefmix-ep
save_strategy: steps
save_steps: 200
eval_strategy: steps
eval_steps: 200
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb
generate_eval_examples: true

# --- Data ---
dataloader_num_workers: 2
remove_unused_columns: true

# --- PEFT (the adapters ARE this run's reference model) ---
use_peft: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_task_type: CAUSAL_LM
lora_target_modules:               # attention only; expert projections need EP grouped adapters (split_expert_lora_targets)
- q_proj
- k_proj
- v_proj
- o_proj
