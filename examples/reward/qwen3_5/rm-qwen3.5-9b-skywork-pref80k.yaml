# Bradley-Terry reward model — Qwen3.5-9B on Skywork-Reward-Preference-80K-v0.2.
# Launch: accelerate launch --config_file launcher-configs/accelerate/fsdp2_gradop_config.yaml scripts/training/reward/reward_model.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3.5-9B
attn_implementation: sdpa   # reward batches are right-padded, and FA2 unpads them into the M-RoPE
                            #   varlen path that crashes this family

# --- Dataset ---
dataset: Skywork/Skywork-Reward-Preference-80K-v0.2
test_size: 0.05

# --- Training ---
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
num_train_epochs: 1
gradient_accumulation_steps: 8
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-05
lr_scheduler_type: cosine
warmup_steps: 20

# --- Sequence Length ---
max_length: 4096

# --- Output ---
output_dir: checkpoints/rm-qwen3.5-9b-skywork-pref80k
eval_strategy: steps
eval_steps: 500
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb

# --- Data ---
dataloader_num_workers: 2

# --- PEFT (optional) ---
use_peft: false
lora_task_type: SEQ_CLS   # read once use_peft is on: PEFT then trains and saves the score head
# lora_r: 64
# lora_alpha: 128
# lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
# lora_modules_to_save: [score]   # the freshly-initialized BT head must train and be saved with the adapter
