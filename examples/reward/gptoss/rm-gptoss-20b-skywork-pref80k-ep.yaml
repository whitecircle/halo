# Bradley-Terry reward model — GPT-OSS 20B on Skywork-Reward-Preference-80K-v0.2, EP=8 (scalar score head on the backbone).
# Blackwell only: attention is pinned to FA4, which the Hopper image does not carry.
# Launch: torchrun --nproc_per_node=8 scripts/training/reward/reward_model.py <this config>

# --- Model ---
model_name_or_path: unsloth/gpt-oss-20b-BF16
attn_implementation: flash_attention_4   # these scripts' unset pick on Blackwell (SDPA elsewhere); sinks stay reset (the default)

# --- Parallelism ---
expert_parallel_size: 8

# --- Dataset ---
dataset: Skywork/Skywork-Reward-Preference-80K-v0.2
test_size: 0.05

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
num_train_epochs: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false   # a full 2 x 4,096 pair holds ~33 GB of activations
learning_rate: 1.0e-05
lr_scheduler_type: cosine
warmup_steps: 20

# --- Sequence Length ---
max_length: 4096

# --- Output ---
output_dir: checkpoints/rm-gptoss-20b-skywork-pref80k-ep
eval_strategy: steps
eval_steps: 500
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb

# --- Data ---
dataloader_num_workers: 2

# --- PEFT ---
use_peft: false
