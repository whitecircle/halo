# Bradley-Terry reward model — Gemma-4 26B-A4B on Skywork-Reward-Preference-80K-v0.2, EP=8 (scalar score head on the backbone).
# Launch: torchrun --nproc_per_node=8 scripts/training/reward/reward_model.py <this config>

# --- Model ---
model_name_or_path: google/gemma-4-26B-A4B-it
attn_implementation: sdpa             # only viable backend (global_head_dim=512; mem-efficient SDPA auto-forced)
# Gemma4 has no aux-loss term and no EP bias-update support — no active load-balancing path exists.
moe_balancing: none

# --- Parallelism ---
expert_parallel_size: 8

# --- Dataset ---
dataset: Skywork/Skywork-Reward-Preference-80K-v0.2
test_size: 0.05

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
num_train_epochs: 1
gradient_accumulation_steps: 8
gradient_checkpointing: false   # a full 2 x 4,096 pair holds ~52 GB of activations; set true on 80 GB GPUs
learning_rate: 1.0e-05
lr_scheduler_type: cosine
warmup_steps: 20

# --- Sequence Length ---
max_length: 4096

# --- Output ---
output_dir: checkpoints/rm-gemma4-26b-a4b-skywork-pref80k-ep
eval_strategy: steps
eval_steps: 500
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb

# --- Data ---
dataloader_num_workers: 2

# --- PEFT ---
use_peft: false
