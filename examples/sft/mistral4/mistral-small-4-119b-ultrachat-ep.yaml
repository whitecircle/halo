# Mistral-Small-4-119B — EP=8 SFT example on UltraChat 200K. See agent-docs/models/mistral4.md.
# Launch: torchrun --nproc_per_node=8 scripts/training/sft.py <this config>

# --- Model ---
# The public mistralai/Mistral-Small-4-119B-2603 checkpoint ships FP8 expert weights — dequantize
# once with scripts/before_training/convert_mistral4_bf16.py and point this at the result.
model_name_or_path: /mnt/models/Mistral-Small-4-119B-BF16   # placeholder — your converted checkpoint
# Mistral4's DeepSeek-V3-style router has no aux-loss term (output_router_logits is inert) and no exportable
# bias slot: the bias balances training-time routing only, and every exported checkpoint serves without it
# (near-tied top-k picks flip vs training). The _transient spelling is the explicit opt-in for that trade-off.
moe_balancing: bias_update_transient

# --- Dataset ---
dataset:
- HuggingFaceH4/ultrachat_200k@train_sft
conversation_field: messages
test_size: 0.01

# --- Parallelism & MoE precision ---
expert_parallel_size: 8               # 128 routed experts → 16/rank
fp32_router: true
fp32_experts: true
fp32_non_ep_params: true

# --- Attention & kernels ---
attn_implementation: flash_attention_2
packing: true
max_length: 32000

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 1.0
gradient_checkpointing: true

# --- Optimizer & LR schedule ---
optim: adamw_torch_fused
learning_rate: 5.0e-06
lr_scheduler_type: cosine
warmup_steps: 32
max_grad_norm: 1.0

# --- Checkpointing & evaluation ---
save_strategy: steps
save_steps: 1000
eval_strategy: steps
eval_steps: 300
save_total_limit: 1
save_only_model: true
output_dir: checkpoints/mistral-small-4-119b-ultrachat-ep

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb
remove_unused_columns: false
dataloader_num_workers: 2

# --- PEFT ---
use_peft: false

# --- Tokens & chat template ---
# [/INST] immediately precedes the assistant content, so it is the completions marker; span ends at </s>.
assistant_message_template: "[/INST]"
pad_token: <pad>
eos_token: </s>
# Multi-turn data needs mistral4-multiturn.jinja — mistral4-instruct.jinja raises on >1 assistant turn.
chat_template: jinja-templates/mistral4/mistral4-multiturn.jinja
force_chat_template: true
