# Step-3.7-Flash (step3p7, 198B total / ~11B active) — EP=8 LoRA (attention PEFT + native grouped
# expert-LoRA) SFT pilot on UltraChat 200K, single 8x Blackwell node. See agent-docs/models/step3p7.md.
#
# The hub release is plain bf16 — no conversion step; train from the repo id directly.
#
# PREFLIGHT (memory, expected — not yet measured): ~190B of the 198B is routed expert weight
# (42 MoE layers x 288 experts x 15.7M params), so ep8 puts ~24B of experts (~48 GB bf16) per rank
# and ZeRO-2 keeps the ~8.5B of non-expert weights gathered (~17 GB, vision tower included) — ~65 GB
# static of a 275 GB card. LoRA keeps optimizer state adapter-only, where full FT at ep8 would add
# ~143 GB of AdamWBF16 expert state + ~48 GB of grads per rank (use the 2-node full-FT config
# instead). Confirm free GPU memory with nvidia-smi first.
# Launch: torchrun --nproc_per_node=8 scripts/training/sft.py <this config>

# --- Model — hub bf16 release; transformers 5.16 drops the 3 trailing MTP layers at load ---
model_name_or_path: stepfun-ai/Step-3.7-Flash
# Upstream declares no flash support (_supports_flash_attn = False); SDPA is the fast backend.
attn_implementation: sdpa
# Native gate.e_score_correction_bias buffer (hub key moe.router_bias) — auto resolves here too;
# stated explicitly. The forward never consults output_router_logits (no aux-loss route).
moe_balancing: bias_update

# --- Dataset ---
dataset:
- HuggingFaceH4/ultrachat_200k@train_sft
conversation_field: messages
test_size: 0.01

# --- Parallelism & MoE precision ---
expert_parallel_size: 8               # 288 routed experts -> 36/rank; one dispatch group on 8 GPUs
save_sharded_ep: false                # consolidate expert shards into a single checkpoint
fp32_grad_reduce: true                # ~2.2x tighter grad reduce at world=8; LoRA-cheap (adapter grads only)

# --- LoRA — attention via PEFT; gate_up_proj/down_proj peel to native EP grouped expert-LoRA ---
use_peft: true
lora_r: 32
lora_alpha: 64                        # scaling = alpha/r = 2
lora_dropout: 0.05
lora_task_type: CAUSAL_LM
lora_target_modules:
# Attention (all 45 layers): projections plus the per-head sigmoid gate g_proj
- q_proj
- k_proj
- v_proj
- o_proj
- g_proj
# Routed experts (288 x 42 layers, fused storage): peeled by split_expert_lora_targets to grouped
# adapters inside the EP layers. The 3 dense leading layers, the shared experts (inside the EP
# wrapper — no LoRA route) and the router gate stay frozen.
- gate_up_proj
- down_proj
merge_expert_lora_on_save: true       # fold both halves into the base at every save -> servable HF
                                      #   checkpoint; without it the mixed adapter resumes here but
                                      #   merge_peft_adapters.py refuses it

# --- Attention & sequence ---
# Packing note: plain full/sliding attention only (no conv or linear-attention mixers), and the
# forward feeds position_ids into mask construction — packed documents stay isolated under SDPA.
packing: true
max_length: 16384                     # expected fit at the ~65 GB static footprint above; raise after measuring

# --- Training schedule ---
per_device_train_batch_size: 1        # SDPA takes no cu_seqlens — batch>1 flattens into one wider row
                                      #   and the 12 quadratic full-attention layers pay for it; scale with GA
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8        # 1 x 8 x 8 GPUs = a 64-sequence effective batch
num_train_epochs: 1.0
gradient_checkpointing: true

# --- Optimizer & LR schedule ---
optim: adamw_torch_fused
learning_rate: 1.0e-04                # the generic LoRA SFT start (agent-docs/optimization/peft.md)
lr_scheduler_type: cosine
warmup_steps: 32
max_grad_norm: 1.0

# --- Checkpointing & evaluation ---
save_strategy: steps
save_steps: 1000
eval_strategy: steps
eval_steps: 300
save_total_limit: 1
save_only_model: true
output_dir: checkpoints/step-3.7-flash-ultrachat-ep-lora

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb
remove_unused_columns: false
dataloader_num_workers: 2

# --- Tokens & chat template ---
# the tokenizer ships everything: <|im_start|>/<|im_end|> roles, a distinct
# pad token, and the chat template (reasoning_effort variable, forced <think> generation prompt).
# The 128896-row embedding is deliberately wider than the 128815-entry tokenizer — do not resize.
assistant_message_template: "<|im_start|>assistant"
train_on_completions_only: true
