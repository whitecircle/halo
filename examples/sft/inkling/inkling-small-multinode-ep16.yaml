# Inkling-Small (266B total / 12B active) — cross-node EP SFT on 2 nodes × 8 GPUs, EP=16 global
# (532 GB of BF16 weights do not fit node-local EP=8 with full-FT optimizer states).
# Launch per node:
#   torchrun --nnodes=2 --node-rank=<r> --nproc-per-node=8 \
#     --master-addr=<addr> --master-port=29500 scripts/training/sft.py <this config>

# --- Model ---
model_name_or_path: thinkingmachines/Inkling-Small
# No Inkling flash-attention dispatch in transformers — pin sdpa so ranks cannot fall back unevenly.
attn_implementation: sdpa
# The causal-LM loss never reads router_logits — no aux-loss path; auto resolves here anyway.
moe_balancing: bias_update

# --- Dataset ---
dataset:
- HuggingFaceH4/ultrachat_200k@train_sft
conversation_field: messages
test_size: 0.01
dataset_num_proc: 32
# Model ships its own chat_template.jinja; assistant turns open with <|message_model|>.
assistant_message_template: "<|message_model|>"
# The tokenizer ships no pad_token; <|unused|> (id 199998) is a dedicated special token
# that never appears in text — safer than aliasing EOS.
pad_token: "<|unused|>"

# --- Parallelism & MoE ---
expert_parallel_size: 16              # 256 routed experts → 16/rank across both nodes
ep_scope: global
max_concurrent_loading: 4             # only the from_pretrained fallback reads it (~2.1 TB peak CPU RAM); lazy loading is the default

# --- Kernels / attention ---
# Packing stays off: Inkling's four depthwise convs per layer cross packed documents (the modeling
# never forwards seq_idx to them). mbs × max_length must stay within the cross-node Gin dispatch cap
# of 8192 tokens/rank (HALO_DEEPEP_GIN_MAX_TOKENS_PER_RANK); 2 × 4096 sits exactly at it.
packing: false
max_length: 4096

# --- Training schedule ---
per_device_train_batch_size: 2
per_device_eval_batch_size: 2      # the cross-node ceiling binds eval batches too
gradient_accumulation_steps: 1
num_train_epochs: 1.0

# --- Optimizer & LR ---
learning_rate: 5.0e-06
lr_scheduler_type: cosine
warmup_steps: 32

# --- Checkpointing & eval ---
output_dir: checkpoints/inkling-small-sft-ep16
save_steps: 1000
save_total_limit: 1
save_only_model: true
eval_strategy: steps
eval_steps: 300
logging_steps: 1
