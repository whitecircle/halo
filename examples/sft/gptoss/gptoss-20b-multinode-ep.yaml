# GPT-OSS 20B — multi-node EP SFT example (2 nodes x 8 GPUs). See agent-docs/parallelism/multi-node.md.
# Launch on EACH node (MASTER_ADDR = node0 IP; SLURM: exactly ONE srun task per node):
#   torchrun --nnodes=2 --node_rank=$NODE_RANK --nproc_per_node=8 \
#     --master_addr=$MASTER_ADDR --master_port=29500 scripts/training/sft.py <this config>

# --- Model ---
# The release as OpenAI ships it: the lazy EP and PP loaders decode its MXFP4 experts to bf16 while reading, and every
# save is plain bf16. The BF16 mirror unsloth/gpt-oss-20b-BF16 loads too, at about three times the download.
model_name_or_path: openai/gpt-oss-20b
model_init_kwargs:
  output_router_logits: true          # moe_balancing auto resolves to aux_loss, which sets this too
  router_aux_loss_coef: 0.001         # the hub config ships 0.9, which would dominate the loss

# --- Dataset ---
# For large corpora, pre-shard (scripts/before_training/prepare_dataset.py); num_shards must be >= dp_size.
# See agent-docs/data/dataset-preparation.md.
dataset:
- HuggingFaceH4/ultrachat_200k@train_sft
test_size: 0.01
conversation_field: messages
# The multiturn jinja renders EVERY assistant turn with <|channel|>final and ends each with <|return|>,
# the completion-span terminator, so completion-only masking trains every turn. Harmony renders a plain
# assistant turn channel-less (<|start|>assistant<|message|>...) and ends only the final turn with
# <|return|> (earlier turns close with <|end|>, not a terminator): the marker below would then match no
# turn at all, and its channel-less spelling would train only the last assistant turn.
chat_template: jinja-templates/gpt-oss/gpt-oss-multiturn.jinja
force_chat_template: true
assistant_message_template: <|start|>assistant<|channel|>final<|message|>
dataset_num_proc: 32

# --- Parallelism (pick one layout) ---
# (A) Cross-node EP (this example): experts across all 16 GPUs, DP = world_size.
# Cross-node dispatch rides the EFA proxy GIN, validated to 8192 tokens/rank per MoE forward
# (HALO_DEEPEP_GIN_MAX_TOKENS_PER_RANK) — hence per_device_train_batch_size: 1 below, since packing
# fills every row. Layout (B) keeps dispatch on NVLink and is not bound by it.
expert_parallel_size: 16
ep_scope: global

# (B) Node-local EP + DP across nodes (lower comms): uncomment instead of (A), and set
#     use_grouped_gemm: true below (the loop path is 28% slower at ep8).
# expert_parallel_size: 8
# ep_scope: node

# (C) EP + node-local TP: shard attention too.
# expert_parallel_size: 16
# tensor_parallel_size: 8        # TP must stay within one NVLink domain (<= 8 here)
# ep_scope: global

# (D) GB200/GB300 NVL72: pure EP must be one dispatch group (72) or ep2, and 72 does not divide gpt-oss's
#     32 experts — ep2 is the only pure-EP width there; needs Fabric Manager + IMEX + NCCL >= 2.25.2.
# expert_parallel_size: 2
# ep_scope: node
# nvlink_domain_size: 72         # or `export NVLINK_DOMAIN_SIZE=72`

use_grouped_gemm: false               # 2 experts/rank at ep16, square non-128-aligned FFN: see agent-docs/models/gpt-oss.md
max_concurrent_loading: 2             # ranks loading at once per node

# --- Attention & kernels ---
# attn_implementation unset — auto-selects FA4 on Blackwell, FA3/FA2 on Hopper
packing: true
max_length: 8192

# --- Training schedule ---
per_device_train_batch_size: 1     # layout (A) ceiling: pdbs x max_length <= 8192 tokens/rank
per_device_eval_batch_size: 1      # the same ceiling binds eval batches
gradient_accumulation_steps: 4
gradient_checkpointing: false   # ~33 GB of activations per 8,192-token row
num_train_epochs: 1.0

# --- Optimizer & LR schedule ---
learning_rate: 5.0e-06
lr_scheduler_type: cosine
warmup_steps: 32

# --- Checkpointing & evaluation ---
output_dir: checkpoints/oss-20b-multinode-ep
save_steps: 1000
eval_strategy: steps
eval_steps: 300
save_total_limit: 1
save_only_model: true
logging_steps: 5
report_to: wandb
