# Laguna S 2.1 — EP=4 SFT example on UltraChat 200K.
# Launch: torchrun --nproc_per_node=4 scripts/training/sft.py <this config>

# --- Model ---
model_name_or_path: poolside/Laguna-S-2.1
# Pin the remote implementation and checkpoint layout used for validation.
model_revision: e80da38da3ed4c4e56888cc1ba39582946a164ba
trust_remote_code: true

# --- Dataset ---
dataset:
- HuggingFaceH4/ultrachat_200k@train_sft
conversation_field: messages
test_size: 0.01

# --- Parallelism ---
expert_parallel_size: 4               # 256 routed experts → 64/rank
# ep_size must equal the launch size: gpus_per_node resolves from LOCAL_WORLD_SIZE, so ep=4 is one
# dispatch group under --nproc_per_node=4, but two racy groups on 8 — rejected at config time.
save_sharded_ep: false

# --- Attention & kernels ---
# The pinned revision provides no Flash-Attention path — sdpa is the only supported backend.
attn_implementation: sdpa
packing: true
max_length: 2048

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 1.0
gradient_checkpointing: true

# --- Optimizer & LR schedule ---
optim: flash_adamw
learning_rate: 5.0e-06
lr_scheduler_type: cosine
warmup_steps: 32
max_grad_norm: 1.0

# --- Checkpointing & evaluation ---
save_strategy: steps
save_steps: 1000
eval_strategy: steps
eval_steps: 300
save_total_limit: 1
save_only_model: true
output_dir: checkpoints/laguna-s-2.1-ultrachat-ep

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb
remove_unused_columns: false
dataloader_num_workers: 2

# --- PEFT ---
use_peft: false

# --- Tokens & chat template ---
assistant_message_template: "<assistant>"
pad_token: "〈|PAD|〉"
eos_token: "〈|EOS|〉"
