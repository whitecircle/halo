# Environmental GRPO — Gemma-4 26B-A4B LoRA (r=64, attention projections) on code_contests, SGLang backend, no EP, ZeRO-2, KL-free (IS bands as the trust region).
# rollout_max_thinking_tokens is vLLM-only here. Adapters land on the language model only: the vision and audio towers share the projection names but wrap them in a `Gemma4ClippableLinear` PEFT cannot adapt, so those matches are excluded.
# Serve with: 2 sglang-servers on GPUs 4-7, ports 30000/30001, --moe-runner-backend triton --tool-call-parser auto,
#   NCCL_CUMEM_ENABLE=1 in the server env, no SGLANG_ENABLE_R3 (routing replay is refused for Gemma 4).
# Launch: CUDA_VISIBLE_DEVICES=0,1,2,3 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=4 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: google/gemma-4-26B-A4B-it
attn_implementation: sdpa  # only viable backend (global_head_dim=512; mem-efficient SDPA auto-forced)

# --- Parallelism (4 train GPUs: pure data-parallel, DP=4, ZeRO-2) ---
expert_parallel_size: 1            # pure DP; attention-only LoRA fits per-rank
fsdp_reshard_after_forward: false  # ZeRO-2

# --- LoRA (r=64, attention projections only) ---
# Expert projections need EP grouped adapters (split_expert_lora_targets) — attention-only stays on plain PEFT.
use_peft: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_task_type: CAUSAL_LM
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj

# --- Environment ---
environment_type: codeforces
max_turns: 14               # a cut turn costs a turn, not the episode
environment_kwargs:
  language: python
  timeout_per_test: 5
  stop_on_first_failure: false
  max_grading_seconds: 150   # wall-clock budget per submission grade, no test-count limit
  reasoning_effort: random
  max_length_cutoff_recoveries: 2  # past two recoveries the episode ends truncated
  # One profile per effort level. thinking_tokens is an engine cap on vLLM only; on SGLang it reaches
  # the trajectory, so nothing caps CoT below rollout_max_tokens.
  reasoning_effort_profiles:
    low: {thinking_tokens: 8192, max_submissions: 2, max_test_calls: 2}
    medium: {thinking_tokens: 12288, max_submissions: 3, max_test_calls: 4}
    high: {thinking_tokens: 16384, max_submissions: 3, max_test_calls: 6}
  submission_reward: 0.1     # bonus for reaching the graded channel
  execution_progress_reward: 0.05
  verdict_detail: outcome    # FAIL / pass count only; expected/got would make the judge a test oracle
  resubmission_penalty: 0.1  # magnitude, >= 0 — each graded submission after the first
  no_tool_use_penalty: 0.1
  multi_turn_reward: 0
  tool_success_reward: 0
  turn_overflow_penalty: 0.1
  tool_error_penalty: 0.05

# --- Rewards ---
rewards:
  - source: environment   # the pass fraction of the submitted solution
    exponent: 2.0         # convex partial credit: half-right earns a quarter

# --- Ray Workers ---
num_rollout_workers: 32
max_concurrent_rollouts: 50  # = eval_rollout_batch_size: an eval round fits one wave

# --- Rollout servers (SGLang) ---
rollout_backend: sglang
rollout_server_configs:
- url: "http://localhost:30000"
  group_port: 51216
- url: "http://localhost:30001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 1200.0       # per HTTP call = one turn; at least twice the turn cap over the
                              # per-sequence decode speed at peak concurrency
max_retries: 1                # a timeout re-runs the WHOLE episode; 2 attempts x 1200 s stays under
                              # the retry budget at DIST_NCCL_TIMEOUT_MINUTES=60
episode_timeout: 2700         # whole-episode wall clock; must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # the trainer scores at this temperature and the engine's IS reference must match
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_max_tokens: 24000              # per-turn total (CoT + a 6k answer headroom) and the only CoT
                                       # bound on this backend
reasoning_compliance_weight: 0.15            # a turn that thinks past 0.9x its budget pays up to this
reasoning_compliance_under_use_weight: 0

# --- Prefetch ---
enable_prefetch: true

# --- Dataset ---
# HardTests problems with sound checkers, banded by Codeforces rating; `medium` is 1500-1999.
dataset:
- your-org/code-contests-hardtests-rl:medium

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 8
use_chunked_grpo_logprobs: true # required for gemma-4 (~262k vocab)
loss_type: dapo
advantage_mode: asymmetric   # long failures otherwise carry the gradient mass under the token-level
advantage_neg_scale: 0.7     #   normalizer and push entropy up
beta: 0.0
num_iterations: 1
epsilon: 0.2
epsilon_high: 0.28
isr_engine_reference: false  # the engine re-score costs server headroom and removes only the
                             #   trainer<->engine part of the numerical floor
isr_geo_band_min: 0.95       # on sustained masking at LOW entropy fix the disagreement, never widen
isr_geo_band_max: 1.05
isr_veto_min: 1.0e-4
isr_opsm_delta: 0.05
skip_update_masked_frac: 0.4
scale_rewards_std_floor: 0.2
num_generations_eval: 1
scale_rewards: batch
drop_degenerate_groups: true
top_entropy_quantile: 1.0
mask_truncated_completions: false  # `truncated` covers only the max_turns overflow (a length-cut turn
                                   # is charged and retried in-episode), which is a failure worth its
                                   # negative advantage

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1      # one eval trajectory per loss forward; eval_rollout_batch_size sizes the rollout round
eval_rollout_batch_size: 50
gradient_accumulation_steps: 24
max_steps: 300              # the cosine horizon matches the run's useful length, not the dataset's
num_train_epochs: 1
learning_rate: 3.0e-06
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 10

# --- Optimization ---
optim: adamw_torch_fused
moe_balancing: none          # Gemma4 has no aux-loss wiring and no bias-update support
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-gemma4-26b-a4b-code-contests-lora-ep1-sglang
save_strategy: steps
save_steps: 15
save_total_limit: 6        # archive the eval-peak checkpoint before it rotates out

# --- Eval ---
eval_strategy: steps
eval_steps: 50
eval_on_start: true         # eval the starting checkpoint

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
log_completions: false
save_completions: true       # trajectories → <output_dir>/completions/*.parquet
num_completions_to_print: 2

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42
