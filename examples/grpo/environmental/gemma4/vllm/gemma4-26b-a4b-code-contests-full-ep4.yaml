# Environmental GRPO — Gemma-4 26B-A4B full fine-tune on Codeforces, EP=4, ZeRO-2, KL-free (IS bands as the trust region).
# Serve with: --moe-backend triton --enable-auto-tool-choice --tool-call-parser hermes on the patched vllm-server --chat-template jinja-templates/gemma4/gemma4-reasoning-effort.jinja (the file chat_template: pins below)
#   image; code_contests is a native-tool env, and a server with no tool parser 400s every rollout.
# Launch: start 2 vLLM servers on GPUs 4-7 with --weight-transfer-config '{"backend":"nccl"}', then
#   CUDA_VISIBLE_DEVICES=0,1,2,3 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=4 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: google/gemma-4-26B-A4B-it
chat_template: jinja-templates/gemma4/gemma4-reasoning-effort.jinja  # states the episode's reasoning effort and thinking budget; the hub template has no effort variable and its thinking toggle would differ between the server and the trainer's renders
force_chat_template: true      # the checkpoint ships the stock template; serve with the same file
attn_implementation: sdpa  # only viable backend (global_head_dim=512; mem-efficient SDPA auto-forced)
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (4 train GPUs: EP=4 single dispatch group, DP=4) ---
expert_parallel_size: 4            # ep_size == GPUs-in-the-job = one DeepEP group; EP ⊥ DP
fsdp_reshard_after_forward: false  # ZeRO-2 for the non-expert base params; ZeRO-3 is rejected under EP
ep_buffer_backend: legacy          # DeepEP V1 Buffer, intranode only; elastic's 32-bit wire-index guard
                                   # breaks at these tokens/rank
# fp32_router is omitted: Gemma-4's router is a sibling module OUTSIDE the EP wrapper (FSDP-managed),
# so the knob has no fp32 route to take and only logs a per-layer no-op warning.
fp32_experts: true
fp32_non_ep_params: false          # dense params stay bf16 (memory)

# --- Full fine-tune (no PEFT) ---
use_peft: false

# --- Environment ---
environment_type: codeforces
max_turns: 14
environment_kwargs:
  language: python
  timeout_per_test: 5
  stop_on_first_failure: false
  max_grading_seconds: 150   # seconds of wall clock per submission grade; a budget stop scores the graded prefix
  reasoning_effort: random   # drawn once per generation group (shared conditioning), not per episode
  max_length_cutoff_recoveries: 1  # one recovery: the second turn cut inside its budget ends the episode truncated
  # One profile per effort level: CoT budget + interaction budgets. thinking_tokens is an ENGINE cap
  # that also bounds the turn total (thinking + answer headroom).
  reasoning_effort_profiles:
    low: {thinking_tokens: 8192, max_submissions: 2, max_test_calls: 2}
    medium: {thinking_tokens: 12288, max_submissions: 3, max_test_calls: 4}
    high: {thinking_tokens: 16384, max_submissions: 3, max_test_calls: 6}
  # Reward ladder: see code_contests.py _grade_episode.
  submission_reward: 0.1     # bonus for reaching the graded channel
  execution_progress_reward: 0.05
  verdict_detail: outcome    # FAIL / pass count only (the Codeforces contract)
  resubmission_penalty: 0.2  # magnitude, >= 0 — charged per graded submission after the first
  no_tool_use_penalty: 0.1   # ending with 0 tool calls
  multi_turn_reward: 0
  tool_success_reward: 0
  turn_overflow_penalty: 0.1 # magnitude, >= 0 — charged when the episode burns max_turns
  tool_error_penalty: 0.05   # magnitude, >= 0 — per call that fails to parse/execute

# --- Rewards ---
rewards:
  - source: environment   # the pass fraction of the submitted solution
    exponent: 2.0         # convex partial credit: half-right earns a quarter

# --- Ray Workers ---
num_rollout_workers: 32
max_concurrent_rollouts: 50  # = eval_rollout_batch_size: the eval round must fit one wave

# --- vLLM Servers ---
rollout_server_configs:
- url: "http://localhost:8000"
  group_port: 51216
- url: "http://localhost:8001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 1200.0       # seconds per HTTP call = one turn
                              # (agent-docs/training-methods/grpo/async-grpo/performance.md#sizing-a-run)
max_retries: 1                # a timeout re-runs the WHOLE episode; attempts x request_timeout must stay
                              # under the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)
episode_timeout: 2700         # whole-episode wall clock; must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # on-policy; the trainer scores at this temperature and the engine's IS reference must match
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_max_tokens: 24000              # per-turn total (CoT + answer headroom) and the ONLY CoT bound here:
                                       # rollout_max_thinking_tokens needs the server on VLLM_REASONING_PARSER=gemma4
                                       # AND VLLM_USE_V2_MODEL_RUNNER=0, else every rollout 400s
reasoning_compliance_weight: 0.15            # a turn that thinks past 0.9x its budget pays up to this, averaged over the episode's turns
reasoning_compliance_under_use_weight: 0     # no under-use floor

# --- Prefetch ---
enable_prefetch: true       # one-step staleness corrected by the sampling-logprob IS ratio

# --- Dataset ---
# HardTests problems with sound checkers, banded by Codeforces rating; `medium` = 1500-1999
# (agent-docs/training-methods/grpo/environments/code-contests.md#dataset).
dataset:
- your-org/code-contests-hardtests-rl:medium

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 8
use_chunked_grpo_logprobs: true # required for gemma-4 (~262k vocab)
loss_type: dapo
advantage_mode: asymmetric   # scales negative advantages, which dominate the token-level normalizer
advantage_neg_scale: 0.7
beta: 0.0                   # KL-free; drift observability = sampling/logratio_mean + entropy + eval
num_iterations: 1
epsilon: 0.2
epsilon_high: 0.28        # inert at num_iterations=1 (PPO ratio ≡ 1)
# --- IS trust region (vLLM↔trainer ratio; see agent-docs/reference/configuration-reference.md) ---
# Requires train_on_sampled_tokens + vllm_importance_sampling_correction (trainer raises otherwise).
isr_engine_reference: false  # an engine re-score costs server headroom (--gpu-memory-utilization <= 0.80)
isr_geo_band_min: 0.95       # geometric-mean ratio band; on sustained masking fix the disagreement,
isr_geo_band_max: 1.05       #   never widen
isr_veto_min: 1.0e-4         # any corrected token below this raw ratio masks its whole trajectory
isr_opsm_delta: 0.05         # masks negative-advantage trajectories with |mean log-ratio| > delta (nats)
skip_update_masked_frac: 0.4  # skip the optimizer step when > this fraction of corrected trajectories or tokens is masked
scale_rewards_std_floor: 0.2  # floor (reward units) on the batch-std divisor
num_generations_eval: 1
scale_rewards: batch        # global batch std — never per-group
drop_degenerate_groups: true  # all-alike groups would still inflate the DAPO normalizer
top_entropy_quantile: 1.0   # train ALL tokens
mask_truncated_completions: false  # `truncated` means ONLY the max_turns overflow; a length-cut TURN is
                                   # priced and retried in-episode

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1      # one eval trajectory per loss forward; eval_rollout_batch_size sizes the rollout round
eval_rollout_batch_size: 50
gradient_accumulation_steps: 24 # dp 4 x 24 = 96 episodes/step; per-rank value must divide by num_generations. One optimizer step per generation round (steps_per_generation defaults to it).
max_steps: 300              # the cosine horizon must match the run's useful length, not the dataset's
num_train_epochs: 1
learning_rate: 2.0e-07
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 10

# --- Optimization ---
optim: adamw_torch_fused    # AdamWBF16 (bf16 master + stochastic rounding)
moe_balancing: none          # Gemma4 has no aux-loss wiring and no bias-update support
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true       # EP requires reentrant GC
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-gemma4-26b-a4b-code-contests-full-ep4
save_strategy: steps
save_steps: 50
save_total_limit: 2

# --- Eval (held-out test split, 400 problems, pass@1) ---
eval_strategy: steps
eval_steps: 50
eval_on_start: true         # eval the starting checkpoint

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
log_completions: false
save_completions: true       # trajectories → <output_dir>/completions/*.parquet
num_completions_to_print: 2

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42
