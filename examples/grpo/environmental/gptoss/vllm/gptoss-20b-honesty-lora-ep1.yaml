# Environmental GRPO — gpt-oss-20b on the agent honesty harness, LoRA (r=64, all linears), no EP, ZeRO-2, KL-free (IS bands as the trust region) + routing_replay: rollout.
# Each episode is one honesty probe instance acting in its own world (a downloads folder and an email store, six tools, no send tool);
#   the harness grades whether the final reply matches what the tools did (agent-docs/training-methods/async-grpo/environments/tasks/honesty.md).
# Every node that builds the environment (the Ray actor nodes included) needs the harness: pip install -e <agent-honesty-harness checkout>.
# Serve on the patched vllm-server image (agent-docs/infrastructure/rollout-servers.md#vllm): --enable-return-routed-experts --moe-backend triton,
#   --enable-auto-tool-choice --tool-parser-plugin /opt/gpt_oss_text_tool_parser.py
#   --tool-call-parser gpt_oss_text, --reasoning-parser-plugin /opt/gpt_oss_reasoning_parser.py --reasoning-parser openai_gptoss.
# Launch: 4 train GPUs + 2 vLLM servers TP=2 on the other 4; WHITECIRCLE_API_KEY=wc-... CUDA_VISIBLE_DEVICES=4,5,6,7 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=4 scripts/training/grpo/environmental.py <this config>

# --- Model ---
model_name_or_path: unsloth/gpt-oss-20b-BF16
# reset_sinks=false keeps pretrained sinks frozen to match vLLM; FA4 is the sink-carrying impl. See agent-docs/models/gpt-oss.md.
attn_implementation: flash_attention_4  # carries the live sinks; on Hopper, whose image has no FA4, pass --attn_implementation=eager
reset_sinks: false
# Serve with --chat-template on this same file (VLLM_CHAT_TEMPLATE in the compose file): forced on the
# trainer alone, the engine stays on the checkpoint's built-in and double-encodes tool-call arguments.
chat_template: jinja-templates/gpt-oss/gpt-oss-harmony.jinja
force_chat_template: true
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (4 train GPUs: pure data-parallel, DP=4, ZeRO-2) ---
expert_parallel_size: 1            # pure DP; the servers hold the other 4 GPUs
fsdp_reshard_after_forward: false  # ZeRO-2

# --- LoRA (r=64, all linear layers: attention + MoE experts) ---
use_peft: true
lora_r: 64
lora_alpha: 128
lora_target_modules:               # expert projs peel to native grouped-LoRA (split_expert_lora_targets)
- q_proj
- k_proj
- v_proj
- o_proj
- gate_up_proj
- down_proj
lora_modules_to_save:              # full-trained, not LoRA; the router stays frozen
- embed_tokens
- lm_head
merge_expert_lora_on_save: true    # fold both halves into each save -> servable with no merge step (without it,
                                   # merge_peft_adapters.py streams the merge); every kept checkpoint holds a
                                   # gathered full copy beside its resume adapters

# --- Environment ---
# No system prompt and no instruction about honesty: each episode opens as the harness runs its probe (the task's own
# system turn, none for most probes), so the trained policy is scored on the condition it trained on.
environment_type: honesty
max_turns: 14                # the harness's own budget per probe; the policy's eval runs under the same
environment_kwargs:
  max_length_cutoff_recoveries: 2  # two recoveries, cut and empty turns together: the third such turn ends the episode truncated
  turn_overflow_penalty: 0.1  # magnitude, >= 0 — charged once on a truncated episode (max_turns or the output budget spent, or a cut/empty turn it could not retry): one that never replied grades 0 like a dishonest reply, and this keeps stalling from tying with answering
  length_cutoff_penalty: 0.05  # magnitude, >= 0 — charged per recovered turn that produced nothing: engine-cut, or ended without a call or a reply
  # no_tool_use_penalty stays 0: an honest reply can need no call (e02: "I can only draft, not send"), and the grade
  # already fails a control answered without the tools. Per-call pricing stays at the class's 0: the world answers a
  # failed call with an "ERROR: ..." output, which is evidence to report, not a fault to charge.

# --- Rewards ---
# The harness verdict is the objective; the checklist orders episodes within a verdict. At weight 0.5 the checklist adds
# at most 0.5, so no episode the harness fails outscores one it passes.
rewards:
  - source: environment        # 1 for HONEST, 0 for any other class; an ERROR verdict (a tool raised inside the harness) leaves the group baseline
  - source: whitecircle
    name: honesty_checklist
    environment_id: your_environment_id
    # The five items of the harness's action-honesty checklist (integrations/whitecircle/honesty_policies.json in the
    # harness checkout); halo run create-whitecircle-policies --environment-id <id> --policies <that file> creates
    # them and prints this term with their ids. The score is 1 minus the fraction of items the episode hits.
    checklist: [policy_a, policy_b, policy_c, policy_d, policy_e]
    view: full                 # the whole episode: every call's arguments (the draft body its recipient reads, not only the chat reply) and every tool output
    weight: 0.5
    on_error: invalid          # a verdict the API never returned leaves the episode out of training, never priced as clean

# --- Ray Workers ---
rollout_actor_budget: 128
max_concurrent_rollouts: 50  # = eval_rollout_batch_size: the eval round must fit one wave

# --- vLLM Servers ---
rollout_server_configs:
- url: "http://localhost:8000"
  group_port: 51216
- url: "http://localhost:8001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 600.0        # per HTTP call = one turn; at least twice the turn cap over the per-sequence decode
                              # speed at peak concurrency (agent-docs/training-methods/async-grpo/performance.md#sizing-a-run)
max_retries: 1                # per turn: a failed or timed-out request is re-issued, not the episode;
                              # (1 + max_retries) x request_timeout must fit inside episode_timeout
episode_timeout: 1800         # whole-episode deadline in engine-serving time (a weight-sync pause is credited
                              # back); must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # on-policy; the trainer and the engine's IS reference must score at this temperature
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_stop_tokens: ["<|call|>"]      # end each turn at the harmony tool-call terminator
rollout_max_tokens: 16384              # per-turn total; a probe turn is one call or a short reply, so the reasoning may run until only the answer room is left of it
rollout_max_answer_tokens: 4096      # the most a turn generates past its reasoning cap (never stated to the model): a reply or a draft body fits well inside it
rollout_max_episode_tokens: 65536   # the most an episode may sample over all its turns, reasoning and visible output together (never stated to the model; a turn's caps narrow to what is left)
rollout_reasoning_end_token: "<|end|><|start|>assistant<|channel|>final<|message|>"  # the move into the final channel vLLM's budget forces (openai_gptoss plugin)

# --- Prefetch ---
enable_prefetch: true       # one-step staleness corrected by the sampling-logprob IS ratio

# --- Dataset ---
# python -m honesty_rl.generate --out data/honesty: train.jsonl holds variants of the ten training probes (h01 and its
# control c04 weighted twice); eval_seen, eval_heldout and canonical are for eval_env.py, never trained on. A row's
# task column carries its world and grading facts.
dataset:
- data/honesty/train.jsonl
test_size: 0.05             # a single .jsonl has no test split: the in-run eval holds out 5% of the variants (unseen instances of the training probes)
context_fields: [task]      # the environment builds each episode's world from it and grades against it

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 8
use_chunked_grpo_logprobs: true # required for gpt-oss (~201k vocab)
loss_type: dapo
beta: 0.0                   # KL-free: the IS bands below are the trust region
num_iterations: 1
epsilon: 0.2
# --- IS trust region (vLLM↔trainer ratio; see agent-docs/reference/configuration-reference.md) ---
# Requires train_on_sampled_tokens + vllm_importance_sampling_correction (trainer raises otherwise).
isr_geo_band_min: 0.95       # +-0.05 nats above the entropy-dependent numerical floor; on sustained
isr_geo_band_max: 1.05       #   masking fix the disagreement, never widen the band
isr_veto_min: 1.0e-4         # any corrected token below this raw ratio masks its whole trajectory
isr_opsm_delta: 0.05         # masks negative-advantage trajectories with |mean log-ratio| > delta (nats)
skip_update_masked_frac: 0.4  # skip the optimizer step when > this fraction of corrected trajectories or tokens is masked
early_stop_on_skipped_updates: true  # end the run once the breaker has skipped every update of early_stop_patience (3) rounds in a row
scale_rewards_std_floor: 0.2  # floor (reward units) on the batch-std divisor
routing_replay: rollout     # replay vLLM's per-token expert selection; server needs --enable-return-routed-experts
num_generations_eval: 1
scale_rewards: batch        # global batch std — never per-group (degenerate-group noise inflation)
drop_degenerate_groups: true  # groups alike in settled reward carry no contrast yet would still inflate the DAPO normalizer
balance_token_mass: true    # cancel each round's net token-weighted push, so a length gap between passing and failing episodes cannot drift entropy
top_entropy_quantile: 1.0   # train ALL tokens: tool-format tokens need direct reinforcement at beta=0
mask_truncated_completions: false  # `truncated` = the max_turns or output-budget overflow, or a cut/empty turn past the recovery
                                   # cap or on the last turn: a real failure worth its negative advantage; a
                                   # cut turn within the cap is priced and retried in-episode

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1      # one eval trajectory per loss forward; eval_rollout_batch_size sizes the rollout round
eval_rollout_batch_size: 50
gradient_accumulation_steps: 24 # dp 4 x 24 = 96 episodes/step (12 rows x 8 generations); the per-rank value must divide by num_generations
max_steps: 300              # about one pass over the generator's 3,600 training rows at 12 rows a step
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_steps: 10

# --- Optimization ---
moe_balancing: none          # bias_update would diverge trainer↔vLLM routing (bias is never synced)
gradient_checkpointing_kwargs:
  use_reentrant: true       # a MoE runs reentrant GC (the trainer force-promotes false)
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-oss-20b-honesty-lora-ep1
save_steps: 15
save_total_limit: 6        # archive the eval-peak checkpoint before it rotates out

# --- Eval (5% of train.jsonl held out, pass@1; the held-out probe families go through eval_env.py) ---
eval_strategy: steps
eval_steps: 50
eval_on_start: true         # eval the starting checkpoint

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
