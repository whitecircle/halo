# Async GRPO with Environments training template — see agent-docs/training-methods/grpo/async-grpo/README.md.
# Launch: start a vLLM server on the GPUs the trainer does not take, then
#   torchrun --nproc_per_node=4 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
attn_implementation: flash_attention_2
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids; a native-tool
# environment_type below also needs a matching --tool-call-parser, or the server 400s every rollout.

# --- Environment (EnvironmentConfig fields) ---
environment_type: react_math
# Available: react_math, react_search, native_math, native_coding, native_combined,
#            swe, codeforces, mcp, qa_search, code_contests, exam_qa
max_turns: 10
# --- Rewards (agent-docs/training-methods/grpo/rewards.md) ---
# A sum of terms, each weight x score^exponent over a score in [0, 1]; the environment's per-turn and
# shaping terms add on top.
rewards:
  - source: environment      # the env's own grade, logged as reward/objective; weight 1.0, exponent 1.0
  # - {source: judge, name: quality, weight: 0.3, requirements: [{name: correctness, description: "..."}]}
  # - {source: reward_model, name: preference, weight: 0.5, url: "http://localhost:8100", model: <BT model id>}
  # judge needs OPENROUTER_API_KEY; reward_model needs a served BT model (vllm --runner pooling / sglang --is-embedding)

# --- Environment kwargs (per environment: agent-docs/training-methods/grpo/environments/README.md) ---
# environment_kwargs:
#   timeout_per_test: 5          # code_contests / codeforces, seconds per test case
#   search_backend: duckduckgo   # qa_search, open-book exam_qa
#   reasoning_effort: null       # every environment: low / medium / high, or random (drawn per episode)
# Shared kwargs: agent-docs/training-methods/grpo/environments/README.md; native-tool shaping: .../environments/native-tool-use.md

# --- Ray Workers (AsyncTrainingConfig fields) ---
num_rollout_workers: 16
max_concurrent_rollouts: null  # default: 4 × this rank's share of the rollout workers
# eval_rollout_batch_size: null  # rows per rank in one evaluation rollout round; null = the eval batch
ray_address: null  # null = local, or "head-node:6379"

# --- vLLM Server - Single Server (AsyncTrainingConfig fields; vllm_group_port is a GRPOConfig field) ---
# rollout_backend: vllm  # vllm or sglang
rollout_server_url: "http://localhost:8000"
vllm_group_port: 51216  # NCCL group port for weight sync
rollout_connection_timeout: 120.0
sync_weights_every_n_steps: 1
# model_name: null         # model name sent in the rollout requests; null = model_name_or_path
# request_timeout: 120.0   # seconds per rollout-server HTTP call
# episode_timeout: 1200.0  # wall-clock deadline for one rollout episode in seconds; must stay below the NCCL watchdog
# max_retries: 3           # retries after a failed rollout-server request (total attempts = max_retries + 1)
# retry_base_wait: 1.0     # base wait in seconds for the exponential backoff between retries

# --- vLLM Server - Multi-Server (uncomment to use) ---
# rollout_server_configs:
#   - url: "http://localhost:8000"
#     group_port: 51216
#   - url: "http://localhost:8001"
#     group_port: 51217

# --- Rollout Generation (AsyncTrainingConfig fields) ---
rollout_temperature: 0.7
rollout_top_p: 0.95
rollout_max_tokens: 8192
# rollout_max_thinking_tokens: null   # per-turn reasoning-token budget; vLLM only
# rollout_chat_template_kwargs: {}    # chat-template variables sent with every rollout request
# rollout_stop_tokens: []             # special-token strings that end a turn (e.g. gpt-oss "<|call|>")
# train_on_sampled_tokens: true       # the engine's sampled token ids (vLLM needs --return-tokens-as-token-ids)
# max_train_row_tokens: null          # longest training row a rank takes; null = the model's context window

# --- Effort-length reward economy (agent-docs/training-methods/grpo/async-grpo/rollouts.md#effort-length-reward) ---
# effort_length_penalty_k0: null      # capped, effort-conditioned price on reasoning tokens (null = off)
# effort_length_penalty_c_max: 0.1    # that price's cap, in reward units
# effort_length_floor_weight: 0.0     # weight of the under-use floor (0 = off)
# effort_length_floor_budgets: 0.75   # the floor's reference, in per-turn thinking budgets

# --- Prefetch (AsyncTrainingConfig fields) ---
enable_prefetch: false    # needs a rollout_server_configs list of 2+ servers; with one server the
                          # trainer auto-disables it (that server stops serving during weight sync)
num_prefetch_batches: 1

# --- Dataset (EnvironmentalGRPOScriptArguments fields) ---
dataset:
- path/to/dataset  # HuggingFace dataset or s3://bucket/path
test_size: 0.05
prompt_field: prompt
answer_field: answer
# context_fields: null   # extra dataset columns handed to the environment as context
# No system_prompt on this surface: the rollout conversation opens with the environment's own system
# prompt. Environments that accept an override take it under environment_kwargs (e.g. qa_search).

# --- Sequence Lengths ---
max_prompt_length: null  # prompt filter (drop over-long rows), not a truncation length; null = keep all

# --- GRPO ---
num_generations: 4
beta: 0.01
num_iterations: 1
epsilon: 0.2
scale_rewards: batch     # global batch std; a per-group std divides by ~0 on a uniform group
# drop_degenerate_groups: true      # mask GRPO groups whose completions all scored the same reward out of the loss
# use_chunked_grpo_logprobs: false  # vocab-chunked log-probs instead of full [B, T, vocab] logits (large-vocab models on long completions)
# routing_replay: none              # MoE routing replay: none, recompute (R2), or rollout (R3; needs a capture-capable server)
# --- Advantage shaping (AdvantageShapingArguments; agent-docs/training-methods/grpo/async-grpo/objective.md#advantages) ---
# advantage_mode: mean              # mean, qae (+advantage_quantile), asymmetric (+advantage_pos_scale,
#                                     advantage_neg_scale; 0 = full negative mask), neg_mask_hard
#                                     (+advantage_hard_group_threshold)
# scale_rewards_std_floor: 0.0      # floor on the std divisor in advantage scaling; 0 = off
# --- IS trust region (engine<->trainer ratio; all eight knobs: agent-docs/training-methods/grpo/async-grpo/objective.md#trust-region-masks) ---
# isr_band_min: null                # token band on the raw ratio; a band arms only when both bounds are set
# isr_band_max: null
# isr_geo_band_min: null            # trajectory band on exp(mean log-ratio)
# isr_geo_band_max: null
# isr_veto_min: null                # any corrected token below this raw ratio masks its whole trajectory

# --- Training ---
per_device_train_batch_size: 2
per_device_eval_batch_size: 4   # global eval batch must divide by num_generations_eval at any world size
gradient_accumulation_steps: 8
num_train_epochs: 2.0
learning_rate: 5.0e-06
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 50

# --- Optimization ---
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: adamw_torch_fused

# --- Output ---
output_dir: checkpoints/environmental-grpo
save_strategy: steps
save_steps: 500
eval_strategy: steps
eval_steps: 500
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb
log_completions: true        # per-sample console table
save_completions: true       # trajectories → <output_dir>/completions/*.parquet
num_completions_to_print: 3

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42

# --- PEFT (optional) ---
use_peft: false
# lora_r: 64
# lora_alpha: 128
# lora_dropout: 0.05
# lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
# lora_task_type: CAUSAL_LM
