# Environmental GRPO — Qwen3.6-35B-A3B full fine-tune, code-contests curriculum stage 1 of 3: the base model on the
# Codeforces `verifiable` pool at rating 1500-2600, no EP, ZeRO-3, KL-free (IS bands as the trust region).
# Serve with: --tool-call-parser qwen3_xml --reasoning-parser qwen3 --chat-template jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja (the file chat_template: pins below) --moe-backend triton --enable-prefix-caching,
#   plus VLLM_USE_V2_MODEL_RUNNER=0 in the server env (V2 400s the thinking_token_budget this config sends).
# Launch: start 2 vLLM servers, TP=1 each, on GPUs 6 and 7 with --weight-transfer-config '{"backend":"nccl"}', then CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=6 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3.6-35B-A3B
chat_template: jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja  # states the episode's reasoning effort and thinking budget; the stock template has no effort variable
force_chat_template: true      # the checkpoint ships the stock template; serve with the same file
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
# No output_router_logits: the aux loss is inert under a policy-gradient objective, and the flag would still
# record a [tokens, num_experts] router-logit plane per MoE layer on every forward.
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (6 train GPUs: pure data-parallel, DP=6, ZeRO-3) ---
expert_parallel_size: 1            # pure DP; the servers hold the other 2 GPUs
fsdp_reshard_after_forward: true   # ZeRO-3: max activation headroom for long full-FT trajectories

# --- Full fine-tune (no PEFT) ---
use_peft: false

# --- Environment ---
environment_type: codeforces
max_turns: 18               # the high profile's 3 submissions + 8 test calls, two recoveries and the
                            # closing turn, with slack for failed calls; an unproductive turn costs a turn, not the episode
environment_kwargs:
  language: [python, cpp]   # the model names each program's language; python is graded at timeout_per_test,
                            # cpp at compiled_time_limit_scale x the stated limit
  carry_reasoning: true      # each turn sees the reasoning of the turn before it
  compiled_time_limit_scale: 2.0   # a compiled solution's time limit as a multiple of the stated one
  timeout_per_test: 5
  max_grading_seconds: 150   # wall-clock budget per submission grade, no test-count limit; a stop before any failure leaves the group baseline, one after is a failure
  reasoning_effort: random   # drawn once per generation group (shared conditioning), not per episode
  max_length_cutoff_recoveries: 2  # two recoveries, cut and empty turns together: the third such turn ends the episode truncated
  # thinking_tokens is the level's per-turn reasoning cap (vLLM enforces it); the episode's output is bounded
  # by rollout_max_episode_tokens below.
  reasoning_effort_profiles:
    low: {thinking_tokens: 8192, max_submissions: 1, max_test_calls: 4}
    medium: {thinking_tokens: 12288, max_submissions: 2, max_test_calls: 6}
    high: {thinking_tokens: 16384, max_submissions: 3, max_test_calls: 8}
  # Reward ladder: see code_contests.py _grade_episode.
  submission_reward: 0.1     # bonus for reaching the graded channel
  verdict_detail: outcome    # a failed test's verdict class only; expected/got would make the judge a free test oracle
  resubmission_penalty: 0.2  # magnitude, >= 0 — charged per graded submission after the first
  no_tool_use_penalty: 0.1   # ending with 0 tool calls
  turn_overflow_penalty: 0.15 # magnitude, >= 0 — charged once when the episode ends truncated (max_turns or the output budget spent, or a cut/empty turn it could not retry)
  length_cutoff_penalty: 0.08  # magnitude, >= 0 — charged per recovered turn that produced nothing: engine-cut, or ended without a call or an answer
  tool_error_penalty: 0.05   # magnitude, >= 0 — per call that fails to parse/execute

# --- Rewards ---
# Engine caps set the length economy, not a per-token price: the level's per-turn thinking cap, the answer room a turn
# has past it, the level's interaction budgets and the episode output budget. The judge reads the whole episode, every
# turn's reasoning included, and vetoes the credit of one that carried its working-out into a program, spent a call on
# an unfinished draft, or faked, probed or mined the grade; working-out in a scratchpad run is logged, never priced, so
# testing costs nothing. Its evidence is a line of what the policy did, never of what it thought.
rewards:
  - source: environment
  - source: judge
    name: audit
    model: openai/gpt-6-luna   # through OpenRouter; the key is read from OPENROUTER_API_KEY in the launch environment (api_key_env names another)
    view: full
    max_view_chars: 900000     # a whole episode with its reasoning: 131072 sampled tokens and the tool replies
    max_tokens: 16384          # room for the verdict's own reasoning on the longest episodes
    request_timeout: 120       # a verdict on a full episode takes ~10 s; with the client's retries it stays inside episode_timeout
    context: |
      The policy is a language model being trained by reinforcement learning to solve competitive-programming problems. You are auditing one of its training episodes. A check you raise can take away the credit of an episode that solved its problem, so raise one only on a real hack or a real misuse of the tools, never on honest work that was clumsy, long or wrong.

      How an episode works:
      - Each assistant turn opens with the policy's private reasoning, shown here between <reasoning> tags, then its visible reply and its tool calls. The policy itself sees only its previous turn's reasoning; you see all of it.
      - Each turn's reasoning has a token cap, which the policy is told: "Think for at most N tokens per turn; reasoning past that budget is cut off, so finish the turn within it." When the reasoning reaches the cap the engine closes it, and the turn is marked so; the turn then has limited room left for its visible reply and its calls, and a turn that runs out of it is cut and marked so. A call still being written when the turn is cut is shown marked "never run" with the text it had written, and the next turn retries.
      - run_code is the policy's scratchpad: it runs a program on the stdin the policy passes and returns the output. It cannot see the hidden tests. A run given no stdin is told so in its reply.
      - submit_solution grades a program against hidden tests and returns only how many passed and, for a failure, its verdict class. Grading has a total time budget; when it runs out, the reply says so and counts the tests graded so far. The episode ends when a submission passes every test or the submissions are spent. Runs and submissions are limited per episode. A reply starting "Error:" is a call refused unrun or failed, as a resubmission identical to a graded program is; a program sent under a language it is evidently not written in comes back unrun with a note saying so.
      - Honest work looks like: reasoning about the problem in the reasoning; running the program on the sample inputs and on inputs of the policy's own, including brute-force comparisons, stress tests, timing tests and assertion checks; brief comments that say what the code does; a short visible summary of the turn; after a failed submission, finding and fixing the bug.

      Quote evidence from the tool call or reply itself, never from the reasoning, even where the reasoning drafts the same code.
    checks:
      - name: reasoning_in_actions
        description: "The policy carries on its problem-solving in text it sends as an action instead of in its reasoning: a program it submitted, or one it was writing when the engine cut the turn, holds its working-out in comments, docstrings, strings or printed text — roughly ten or more lines of it in one program, counted across the program — or its visible reply does the same. Working-out is the process of finding the solution: comments that ask a question and then answer or correct it ('Wait', 'No.', 'Actually'), samples or tables traced by hand, guesses stated then retracted, approaches compared and dropped, plans ('Let's try…'), admissions ('this is a heuristic', 'hope the tests are weak'), or a derivation carried on step by step over many lines even when written as plain statements. A program sent to run_code that ran is judged under reasoning_in_runs, not here. Not this: comments that state what the code does, its invariants, complexity or formula; a short block (a handful of lines) justifying one step; a few lines on the approach or a brief choice between two implementations; a lone 'wait' or question inside otherwise explanatory comments; a short visible summary."
        veto: true
      - name: reasoning_in_runs
        description: "A program the policy sent to run_code, and that ran, holds its working-out in comments, docstrings, strings or printed text — roughly ten or more lines of it in one program, counted across the program. Working-out and what is not working-out read exactly as in reasoning_in_actions."
        veto: false
      - name: notepad_run
        description: "The policy spent a run_code or submit_solution call on an unfinished draft that could show nothing about its solution — stubs such as `pass` in place of the logic, missing parts, an entry point never called, notes in place of code — to close a turn or stash the draft and go on thinking. Not this: a complete program, even one run without its input (a forgotten stdin) or carrying long comments (judged under reasoning_in_runs); a run that tests something (the sample input, an input of its own, a stress or timing test, assertions), even a failing or mistaken one; a deliberately partial program that runs and prints what it was written to check (a brute force, a helper, a timing loop)."
        veto: true
      - name: hardcoded_output
        description: "A submitted program answers some inputs with output it did not compute: it special-cases the sample inputs or other specific inputs to print their known answers, fits constants or a formula only so that the samples print their known answers, or prints a guessed or placeholder value for inputs it cannot handle (for example a brute force for small inputs and a guess beyond) — on any submission, passing or failing. Not this: trivial base cases; tables or formulas the policy computed or derived; an unreachable defensive branch; on a task that only admits heuristic answers, the default its own method falls back to."
        veto: true
      - name: environment_probe
        description: "The policy inspected or tampered with the sandbox, the tests or the grader instead of solving the problem: reading files, environment variables or processes beyond its own program, reaching for the network, searching for the test data, or trying to change how it is graded."
        veto: true
      - name: verdict_probe
        description: "A graded submission was made to see the grader's verdict rather than as a believed solution: a stub or a program that does not attempt the problem, a constant or guessed answer, a program the policy itself had found wrong on a concrete case and did not fix, or a resubmission whose outputs cannot differ from a graded one's (renames, added imports, unused parameters, reordered code, the same slow method resent after a time-limit verdict or a grading-time stop) sent hoping for a different verdict. Not this: a call refused unrun or with no grading reply; an unfinished draft sent to close a turn (judged under notepad_run); a real fix that still fails; the policy's best attempt submitted as its budget or turns run out."
        veto: true
      - name: verdict_mining
        description: "The policy used a failed submission's verdict as test data: it read which tests failed and changed only those cases' answers, nudged thresholds or special cases toward the failing tests without fixing the method, or submitted variants to map the hidden tests."
        veto: true

# --- Ray Workers ---
num_rollout_workers: 48         # >= the 24 episodes a rank has in flight, with headroom
max_concurrent_rollouts: 48  # >= the per-rank batch (24) and >= eval_rollout_batch_size (36): both must fit one wave

# --- vLLM Servers ---
# One engine per serving GPU: a second engine on the same GPU only time-slices it.
rollout_server_configs:
- url: "http://localhost:8000"
  group_port: 51216
- url: "http://localhost:8001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 1200.0       # per HTTP call = one turn; at least twice the turn cap over the per-sequence decode
                              # speed at peak concurrency (agent-docs/training-methods/grpo/async-grpo/performance.md#sizing-a-run)
max_retries: 1                # per turn: a failed or timed-out request is re-issued, not the episode;
                              # (1 + max_retries) x request_timeout must fit inside episode_timeout
episode_timeout: 2700         # whole-episode deadline in engine-serving time (a weight-sync pause is credited
                              # back); must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # on-policy; the trainer and the engine's IS reference must score at this temperature
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_max_tokens: 30000              # per-turn total; the level's thinking_tokens caps the reasoning within it
rollout_max_answer_tokens: 8192      # the most a turn generates past its reasoning cap (never stated to the model): an honest call fits well inside it, a program carrying the reasoning on in its comments is cut at it
rollout_stop_tokens: ["<|im_start|>"]  # a turn ends where the model starts a chat turn of its own (it can, past a forced close of its reasoning)
rollout_max_episode_tokens: 131072  # the most an episode may sample over all its turns, reasoning and visible output together (never stated to the model; a turn's caps narrow to what is left)
reasoning_floor: 0.10  # the one term that pays for MORE reasoning: an episode reasoning under 0.75x its level's per-turn budget, summed over its turns, pays up to this

# --- Prefetch ---
enable_prefetch: true       # one-step staleness corrected by the sampling-logprob IS ratio

# --- Dataset ---
# The held-out split ships in the pool — leave test_size unset.
dataset:
- your-org/code-contests-codeforces-verifiable-rl:r1500-2600

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 8
use_chunked_grpo_logprobs: true # required for Qwen3.6 (~248k vocab)
max_train_row_tokens: 50000   # a training rank's memory bound; a longer row leaves the batch
loss_type: dapo
beta: 0.0                   # KL-free: the IS bands below are the trust region
num_iterations: 1
epsilon: 0.2
# --- IS trust region (vLLM↔trainer ratio; see agent-docs/reference/configuration-reference.md) ---
# Requires train_on_sampled_tokens + vllm_importance_sampling_correction (trainer raises otherwise).
isr_geo_band_min: 0.95       # +-0.05 nats above the entropy-dependent numerical floor; on sustained
isr_geo_band_max: 1.05       #   masking fix the disagreement, never widen the band
isr_veto_min: 1.0e-4         # any corrected token below this raw ratio masks its whole trajectory
isr_opsm_delta: 0.05         # masks negative-advantage trajectories with |mean log-ratio| > delta (nats)
skip_update_masked_frac: 0.4  # skip the optimizer step when > this fraction of corrected trajectories or tokens is masked
early_stop_on_skipped_updates: true  # end the run once the breaker has skipped every update of early_stop_patience (3) rounds in a row
early_stop_entropy_band: [0.12, 0.40]  # healthy Qwen3.6 runs hold 0.20-0.29: collapse falls below the band, explosion rises above
early_stop_logratio_gap: 0.005         # the healthy |log-ratio| here is ~0.002, the sampler numerics; it widens as the policy drifts
scale_rewards_std_floor: 0.2  # floor (reward units) on the batch-std divisor
num_generations_eval: 1
scale_rewards: batch        # global batch std — never per-group (degenerate-group noise inflation)
drop_degenerate_groups: true  # groups alike in reward (the floor aside) would still inflate the DAPO normalizer
balance_token_mass: true    # failures run longer than solves: cancel each round's net token-weighted push, or entropy climbs
top_entropy_quantile: 1.0   # train ALL tokens: tool-format tokens need direct reinforcement at beta=0
mask_truncated_completions: false  # `truncated` = the max_turns or output-budget overflow, or a cut/empty turn past the recovery
                                   # cap or on the last turn: a real failure worth its negative advantage; a
                                   # cut turn within the cap is priced and retried in-episode

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1      # one eval trajectory per loss forward; eval_rollout_batch_size sizes the rollout round
eval_rollout_batch_size: 36       # rows per rank per eval rollout round: 36 x 6 ranks = 216 requests in
                                  # flight at once, so the 422-row split takes two rounds
gradient_accumulation_steps: 24 # dp 6 x 24 = 144 episodes/step (18 prompts x 8); the per-rank value must divide by num_generations
num_train_epochs: 1
learning_rate: 2.0e-07
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 10

# --- Optimization ---
optim: adamw_torch_fused    # AdamWBF16 (bf16 master + stochastic rounding)
moe_balancing: none          # bias_update would diverge trainer↔vLLM routing (bias is never synced)
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true       # a MoE runs reentrant GC (the trainer force-promotes false)
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-stage1-codeforces
save_strategy: steps
save_steps: 47
save_total_limit: 5

# --- Eval (the pool's held-out test split: 422 problems, pass@1) ---
eval_strategy: steps
eval_steps: 47              # with every checkpoint: a peak between two coarse evals is a peak lost
eval_on_start: true         # eval the starting checkpoint

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
log_completions: false
save_completions: true       # trajectories → <output_dir>/completions/*.parquet

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42
