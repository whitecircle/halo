# Environmental GRPO — Qwen3.6-35B-A3B full fine-tune, code-contests curriculum stage 3 of 3: the HardTests
# `extra-hard` band (rating 2600-3500), no EP, ZeRO-3, KL-free (IS bands as the trust region).
# Serve with: --tool-call-parser qwen3_xml --reasoning-parser qwen3 --chat-template jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja (the file chat_template: pins below) --moe-backend triton --enable-prefix-caching,
#   plus VLLM_USE_V2_MODEL_RUNNER=0 in the server env (V2 400s the thinking_token_budget this config sends).
# Launch: start 2 vLLM servers, TP=1 each, on GPUs 6 and 7 with --weight-transfer-config '{"backend":"nccl"}', then CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=6 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-stage2-hard/checkpoint-200  # weights only: the optimizer starts fresh
model_name: Qwen/Qwen3.6-35B-A3B   # the id the rollout servers serve; unset, the path above would be sent as the model id
chat_template: jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja  # states the episode's reasoning effort and thinking budget; the stock template has no effort variable
force_chat_template: true      # the checkpoint ships the stock template; serve with the same file
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
# No output_router_logits: the aux loss is inert under a policy-gradient objective, and the flag still runs
# transformers' load-balancing loss — a layers x tokens x top_k x experts int64 one-hot, tens of GB here.
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (6 train GPUs: pure data-parallel, DP=6, ZeRO-3) ---
expert_parallel_size: 1            # pure DP; the servers hold the other 2 GPUs
fsdp_reshard_after_forward: true   # ZeRO-3: max activation headroom for long full-FT trajectories

# --- Full fine-tune (no PEFT) ---
use_peft: false

# --- Environment ---
environment_type: codeforces
max_turns: 18               # the high profile's 3 submissions + 8 test calls, two cut-turn recoveries and the
                            # closing turn, with slack for failed calls; a cut turn costs a turn, not the episode
environment_kwargs:
  language: [python, cpp]   # the model names each program's language; python is graded at timeout_per_test,
                            # cpp at compiled_time_limit_scale x the stated limit
  carry_reasoning: true      # each turn sees the reasoning of the turn before it
  compiled_time_limit_scale: 2.0   # a compiled solution's time limit as a multiple of the stated one
  timeout_per_test: 5
  stop_on_first_failure: false
  max_grading_seconds: 150   # wall-clock budget per submission grade, no test-count limit; a budget stop scores the graded prefix
  reasoning_effort: random   # drawn once per generation group (shared conditioning), not per episode
  max_length_cutoff_recoveries: 2  # two recoveries: the third turn cut inside its budget ends the episode truncated
  # thinking_tokens is an ENGINE cap that also bounds the turn total (thinking + answer headroom).
  reasoning_effort_profiles:
    low: {thinking_tokens: 8192, max_submissions: 1, max_test_calls: 4}
    medium: {thinking_tokens: 12288, max_submissions: 2, max_test_calls: 6}
    high: {thinking_tokens: 16384, max_submissions: 3, max_test_calls: 8}
  # Reward ladder: see code_contests.py _grade_episode.
  submission_reward: 0.1     # bonus for reaching the graded channel
  execution_progress_reward: 0.05
  verdict_detail: outcome    # FAIL / pass count only (the Codeforces contract); expected/got would make the judge a free test oracle
  resubmission_penalty: 0.2  # magnitude, >= 0 — charged per graded submission after the first
  improved_resubmission_refund: 0.75  # of that price, earned back by beating every earlier result: a fix is cheap, a re-roll is not
  no_tool_use_penalty: 0.1   # ending with 0 tool calls
  multi_turn_reward: 0       # off: a bounty for a second call pays a judge probe like a scratchpad run
  tool_success_reward: 0     # any per-call pay is farmable by duplicate re-runs
  turn_overflow_penalty: 0.1 # magnitude, >= 0 — charged when the episode burns max_turns
  length_cutoff_penalty: 0.08  # magnitude, >= 0 — charged per engine-cut turn the episode recovers from
  tool_error_penalty: 0.05   # magnitude, >= 0 — per call that fails to parse/execute

# --- Rewards ---
rewards:
  - source: environment   # the pass fraction of the submitted solution
    exponent: 2.0         # convex partial credit: half-right earns a quarter

# --- Ray Workers ---
num_rollout_workers: 48         # >= the 24 episodes a rank has in flight, with headroom
max_concurrent_rollouts: 48  # >= the per-rank batch (24) and >= eval_rollout_batch_size (34): both must fit one wave

# --- vLLM Servers ---
# One engine per serving GPU: a second engine on the same GPU only time-slices it.
rollout_server_configs:
- url: "http://localhost:8000"
  group_port: 51216
- url: "http://localhost:8001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 1200.0       # per HTTP call = one turn; at least twice the turn cap over the per-sequence decode
                              # speed at peak concurrency (agent-docs/training-methods/grpo/async-grpo/performance.md#sizing-a-run)
max_retries: 1                # a timeout re-runs the WHOLE episode; attempts x request_timeout must stay
                              # under the retry budget at DIST_NCCL_TIMEOUT_MINUTES=60
episode_timeout: 2700         # whole-episode wall clock; must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # on-policy; the trainer and the engine's IS reference must score at this temperature
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_max_tokens: 30000              # per-turn total: thinking budget + a 12k answer headroom (code + call after </think>)
rollout_max_thinking_tokens: 18000     # global CoT ceiling >= the profiles' high
effort_length_penalty_k0: 0.03         # reasoning tokens are priced per level: -min(c_max, k(level) x tokens / 8192), with k
effort_length_penalty_c_max: 0.1       #   falling by e per 25 effort units (low 25, medium 50, high 100): low pays ~20x high
effort_length_floor_weight: 0.05       # the one term that pays for MORE reasoning: an episode whose turns together reason
                                       #   under 0.75x one turn's thinking_tokens pays up to this; price + floor < a resubmission

# --- Prefetch ---
enable_prefetch: true       # one-step staleness corrected by the sampling-logprob IS ratio

# --- Dataset ---
# Every band config of this repo carries the same held-out `test` split — leave test_size unset.
dataset:
- your-org/code-contests-hardtests-rl:extra-hard

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 12          # 12 prompts x 12: on a frontier pool a problem solved once in twelve still yields a contrast
use_chunked_grpo_logprobs: true # required for Qwen3.6 (~248k vocab)
max_train_row_tokens: 50000   # a training rank's memory bound; a longer row leaves the batch
loss_type: dapo
advantage_mode: asymmetric   # failures run far longer than solves, so under a token-level normalizer
advantage_neg_scale: 0.7     #   their negatives carry the gradient mass
beta: 0.0                   # KL-free: the IS bands below are the trust region
num_iterations: 1
epsilon: 0.2
epsilon_high: 0.28        # inert at num_iterations=1 (PPO ratio ≡ 1)
# --- IS trust region (vLLM↔trainer ratio; see agent-docs/reference/configuration-reference.md) ---
# Requires train_on_sampled_tokens + vllm_importance_sampling_correction (trainer raises otherwise).
isr_engine_reference: false  # the engine re-score costs server headroom (--gpu-memory-utilization <= 0.80)
isr_geo_band_min: 0.95       # +-0.05 nats above the entropy-dependent numerical floor; on sustained
isr_geo_band_max: 1.05       #   masking fix the disagreement, never widen the band
isr_veto_min: 1.0e-4         # any corrected token below this raw ratio masks its whole trajectory
isr_opsm_delta: 0.05         # masks negative-advantage trajectories with |mean log-ratio| > delta (nats)
skip_update_masked_frac: 0.4  # skip the optimizer step when > this fraction of corrected trajectories or tokens is masked
scale_rewards_std_floor: 0.2  # floor (reward units) on the batch-std divisor
num_generations_eval: 1
scale_rewards: batch        # global batch std — never per-group (degenerate-group noise inflation)
drop_degenerate_groups: true  # all-alike groups would still inflate the DAPO normalizer
top_entropy_quantile: 1.0   # train ALL tokens: tool-format tokens need direct reinforcement at beta=0
mask_truncated_completions: false  # `truncated` means ONLY the max_turns overflow — a real failure worth its
                                   # negative advantage; a length-cut TURN is priced and retried in-episode

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1      # one eval trajectory per loss forward; eval_rollout_batch_size sizes the rollout round
eval_rollout_batch_size: 34       # rows per rank per eval rollout round: 34 x 6 ranks = 204 requests in
                                  # flight at once, so the 400-row split takes two rounds
gradient_accumulation_steps: 24 # dp 6 x 24 = 144 episodes/step (12 prompts x 12); the per-rank value must divide by num_generations
num_train_epochs: 1              # one pass over the pool: the stage runs to the end of its data, and the evals
                                 # say which checkpoint to keep
learning_rate: 3.0e-07
max_grad_norm: 1.0
lr_scheduler_type: constant_with_warmup  # the useful length of a frontier stage is read off its evals, not fixed in advance
warmup_steps: 10

# --- Optimization ---
optim: adamw_torch_fused    # AdamWBF16 (bf16 master + stochastic rounding)
moe_balancing: none          # bias_update would diverge trainer↔vLLM routing (bias is never synced)
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true       # a MoE runs reentrant GC (the trainer force-promotes false)
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-stage3-extra-hard
save_strategy: steps
save_steps: 25
save_total_limit: 3              # archive the eval-peak checkpoint before it rotates out

# --- Eval (the pool's held-out split: 400 problems, 100 per band; pass@1) ---
eval_strategy: steps
eval_steps: 25                   # with every checkpoint: a peak between two coarse evals is a peak lost
eval_on_start: true         # eval the starting checkpoint

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
log_completions: false
save_completions: true       # trajectories → <output_dir>/completions/*.parquet
num_completions_to_print: 2

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42
