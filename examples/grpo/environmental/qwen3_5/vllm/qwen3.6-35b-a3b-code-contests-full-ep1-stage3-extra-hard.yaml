# Environmental GRPO — Qwen3.6-35B-A3B full fine-tune, code-contests curriculum stage 3 of 3: the HardTests
# `extra-hard` band (rating 2600-3500), no EP, ZeRO-3, KL-free (IS bands as the trust region).
# Serve with: --tool-call-parser qwen3_xml --reasoning-parser qwen3 --chat-template jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja (the file chat_template: pins below) --moe-backend triton --enable-prefix-caching,
#   on the image's pinned Model Runner V2 (leave VLLM_USE_V2_MODEL_RUNNER unset), which enforces the thinking_token_budget this config sends.
# Launch: start 2 vLLM servers, TP=1 each, on GPUs 6 and 7 with --weight-transfer-config '{"backend":"nccl"}', then CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 DIST_NCCL_TIMEOUT_MINUTES=120 torchrun --nproc_per_node=6 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-stage2-hard/checkpoint-200  # weights only: the optimizer starts fresh
model_name: Qwen/Qwen3.6-35B-A3B   # the id the rollout servers serve; unset, the path above would be sent as the model id
chat_template: jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja  # states the episode's reasoning effort and thinking budget; the stock template has no effort variable
force_chat_template: true      # the stage-2 weights ship this same template (a save keeps the forced one); serve with it
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
# No output_router_logits: the aux loss is inert under a policy-gradient objective, and the flag would still
# record a [tokens, num_experts] router-logit plane per MoE layer on every forward.
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (6 train GPUs: pure data-parallel, DP=6, ZeRO-3) ---
expert_parallel_size: 1            # pure DP; the servers hold the other 2 GPUs
fsdp_reshard_after_forward: true   # ZeRO-3: max activation headroom for long full-FT trajectories

# --- Full fine-tune (no PEFT) ---
use_peft: false

# --- Environment ---
environment_type: codeforces
max_turns: 18               # the high profile's 3 submissions + 8 test calls, two recoveries and the
                            # closing turn, with slack for failed calls; an unproductive turn costs a turn, not the episode
environment_kwargs:
  language: [python, cpp]   # the model names each program's language; python is graded at timeout_per_test,
                            # cpp at compiled_time_limit_scale x the stated limit
  carry_reasoning: true      # each turn sees the reasoning of the turn before it
  compiled_time_limit_scale: 2.0   # a compiled solution's time limit as a multiple of the stated one
  timeout_per_test: 5
  max_grading_seconds: 150   # wall-clock budget per submission grade, no test-count limit; a stop before any failure leaves the group baseline, one after is a failure
  reasoning_effort: random   # drawn once per generation group (shared conditioning), not per episode
  max_length_cutoff_recoveries: 2  # two recoveries, cut and empty turns together: the third such turn ends the episode truncated
  # thinking_tokens is the level's per-turn reasoning budget, soft (enforce_thinking_cap: false): stated to the
  # model and priced past it (reasoning_price_past_budget), never cut there; the engine closes the reasoning only
  # where rollout_max_answer_tokens is left of the turn. The episode's output is bounded by rollout_max_episode_tokens.
  reasoning_effort_profiles:
    low: {thinking_tokens: 8192, enforce_thinking_cap: false, max_submissions: 1, max_test_calls: 6}
    medium: {thinking_tokens: 12288, enforce_thinking_cap: false, max_submissions: 2, max_test_calls: 8}
    high: {thinking_tokens: 16384, enforce_thinking_cap: false, max_submissions: 3, max_test_calls: 8}
  # Reward ladder: see code_contests.py _grade_episode.
  submission_reward: 0.1     # bonus for reaching the graded channel
  verdict_detail: outcome    # a failed test's verdict class only; expected/got would make the judge a free test oracle
  resubmission_penalty: 0.2  # magnitude, >= 0 — charged per graded submission after the first
  no_tool_use_penalty: 0.2   # ending with 0 tool calls: below a failed attempt at the price cap
  turn_overflow_penalty: 0.35 # magnitude, >= 0 — charged once when the episode ends truncated (max_turns or the output budget spent, or a cut/empty turn it could not retry): above one more failed submission
  length_cutoff_penalty: 0.08  # magnitude, >= 0 — charged per recovered turn that produced nothing: engine-cut, or ended without a call or an answer
  tool_error_penalty: 0.05   # magnitude, >= 0 — per call that fails to parse/execute

# --- Rewards ---
# The length economy: the level's per-turn thinking budget, soft (priced past it), the engine's ceiling where the
# answer room is left of the turn, the interaction budgets and the output budget. The judge reads the whole episode, every
# turn's reasoning included, and vetoes the credit of one that carried its working-out into a program, spent a call on
# an unfinished draft, or faked, probed or mined the grade; working-out in a scratchpad run is logged, never priced, so
# testing costs nothing; a run that could test nothing (no usable input) and a failed submission of a program never
# tested beyond the samples in an episode that failed cost 0.1 each; a guess or a probe of the grade pays 0.3 or 0.2
# beyond its veto, and prices add when several checks fire. Its
# evidence is a line of what the policy did, never of what it thought.
rewards:
  - source: environment
  - source: judge
    name: audit
    model: openai/gpt-6-luna   # through OpenRouter; the key is read from OPENROUTER_API_KEY in the launch environment (api_key_env names another)
    view: full
    max_view_chars: 900000     # a whole episode with its reasoning: 160000 sampled tokens and the tool replies
    max_tokens: 16384          # room for the verdict's own reasoning on the longest episodes
    request_timeout: 120       # a verdict on a full episode takes ~10 s; with the client's retries it stays inside episode_timeout
    on_error: invalid          # a verdict the judge never reached leaves the episode out of training: an outage never trains unjudged episodes
    weight: -0.7               # prices each fired weighted check by its share: wasted_run and untested_submission 0.1, hardcoded_output 0.3 and verdict_probe 0.2 beyond their veto; reasoning_in_runs is logged
    context: |
      The policy is a language model being trained by reinforcement learning to solve competitive-programming problems. You are auditing one of its training episodes. Two kinds of checks follow. A veto check takes away the episode's credit, even when it solved its problem: raise one only on a real hack or a real misuse of the tools, never on honest work that was clumsy, long or wrong. The process checks (reasoning_in_runs, wasted_run, untested_submission) take no credit away: each records a habit, so raise it on exactly what it describes, in honest work too.

      How an episode works:
      - Each assistant turn opens with the policy's private reasoning, shown here between <reasoning> tags, then its visible reply and its tool calls. The policy itself sees only its previous turn's reasoning; you see all of it.
      - The policy is told a reasoning budget per turn: "Aim to think for at most N tokens per turn." The engine does not stop the reasoning at that budget; it closes the reasoning only at a hard ceiling well past it, and the turn is marked so; the turn then has limited room left for its visible reply and its calls, and a turn that runs out of it is cut and marked so. A call still being written when the turn is cut is shown marked "never run" with the text it had written, and the next turn retries.
      - run_code is the policy's scratchpad: it runs a program on the stdin the policy passes and returns the output. It cannot see the hidden tests. A run given no stdin is told so in its reply.
      - submit_solution grades a program against hidden tests and returns only how many passed and, for a failure, its verdict class. Grading has a total time budget; when it runs out, the reply says so and counts the tests graded so far. The episode ends when a submission passes every test or the submissions are spent. Runs and submissions are limited per episode. A reply starting "Error:" is a call refused unrun or failed, as a resubmission identical to a graded program is; a program sent under a language it is evidently not written in comes back unrun with a note saying so. A call refused unrun is marked so beside its name: it ran nothing and spent nothing; each check says whether such a call counts.
      - Honest work looks like: reasoning about the problem in the reasoning; running the program on the sample inputs and on inputs of the policy's own, including brute-force comparisons, stress tests, timing tests and assertion checks; brief comments that say what the code does; a short visible summary of the turn; after a failed submission, finding and fixing the bug.

      Quote evidence from the tool call or reply itself, never from the reasoning, even where the reasoning drafts the same code.
    checks: environment        # the environment's audit rubric (CodeContestsEnvironment.JUDGE_CHECKS)

# --- Ray Workers ---
num_rollout_workers: 48         # >= the 24 episodes a rank has in flight, with headroom
max_concurrent_rollouts: 48  # >= the per-rank batch (24) and >= eval_rollout_batch_size (34): both must fit one wave

# --- vLLM Servers ---
# One engine per serving GPU: a second engine on the same GPU only time-slices it.
rollout_server_configs:
- url: "http://localhost:8000"
  group_port: 51216
- url: "http://localhost:8001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 1600.0       # per HTTP call = one turn; at least twice the turn cap over the per-sequence decode
                              # speed at peak concurrency (agent-docs/training-methods/async-grpo/performance.md#sizing-a-run)
max_retries: 1                # per turn: a failed or timed-out request is re-issued, not the episode;
                              # (1 + max_retries) x request_timeout must fit inside episode_timeout
episode_timeout: 3600         # whole-episode deadline in engine-serving time (a weight-sync pause is credited
                              # back); must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # on-policy; the trainer and the engine's IS reference must score at this temperature
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_max_tokens: 38192              # per-turn total; under a soft budget the reasoning may run until only the answer room is left of it
rollout_max_answer_tokens: 8192      # the most a turn generates past its reasoning cap (never stated to the model): an honest call fits well inside it, a program carrying the reasoning on in its comments is cut at it
rollout_stop_tokens: ["<|im_start|>"]  # a turn ends where the model starts a chat turn of its own (it can, past a forced close of its reasoning)
rollout_max_episode_tokens: 160000  # the most an episode may sample over all its turns, reasoning and visible output together (never stated to the model; a turn's caps narrow to what is left)
reasoning_floor: 0.10  # the one term that pays for MORE reasoning: an episode reasoning under 0.75x its level's per-turn budget, summed over its turns, pays up to this
reasoning_price: {low: 0.008, medium: 0.006, high: 0.004}  # per 1,000 reasoning tokens a turn spends past its level's soft budget, the lowest level highest
reasoning_price_past_budget: true  # free within the budget: the soft budget's only ceiling below the engine's
reasoning_price_cap: 0.28          # the most the price charges an episode: under one more failed submission (resubmission + untested_submission)

# --- Prefetch ---
enable_prefetch: true       # one-step staleness corrected by the sampling-logprob IS ratio

# --- Dataset ---
# Every band config of this repo carries the same held-out `test` split — leave test_size unset.
dataset:
- your-org/code-contests-hardtests-rl:extra-hard

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 12          # 12 prompts x 12: on a frontier pool a problem solved once in twelve still yields a contrast
use_chunked_grpo_logprobs: true # required for Qwen3.6 (~248k vocab)
max_train_row_tokens: 64000   # a training rank's memory bound (a B300 rank peaks near 250 GB here); a longer row leaves the batch
loss_type: dapo
beta: 0.0                   # KL-free: the IS bands below are the trust region
num_iterations: 1
epsilon: 0.2
# --- IS trust region (vLLM↔trainer ratio; see agent-docs/reference/configuration-reference.md) ---
# Requires train_on_sampled_tokens + vllm_importance_sampling_correction (trainer raises otherwise).
isr_geo_band_min: 0.95       # +-0.05 nats above the entropy-dependent numerical floor; on sustained
isr_geo_band_max: 1.05       #   masking fix the disagreement, never widen the band
isr_veto_min: 1.0e-4         # any corrected token below this raw ratio masks its whole trajectory
isr_opsm_delta: 0.05         # masks negative-advantage trajectories with |mean log-ratio| > delta (nats)
skip_update_masked_frac: 0.4  # skip the optimizer step when > this fraction of corrected trajectories or tokens is masked
early_stop_on_skipped_updates: true  # end the run once the breaker has skipped every update of early_stop_patience (3) rounds in a row
early_stop_entropy_band: [0.12, 0.40]  # healthy Qwen3.6 runs hold 0.20-0.29: collapse falls below the band, explosion rises above
early_stop_logratio_gap: 0.005         # the healthy |log-ratio| here is ~0.002, the sampler numerics; it widens as the policy drifts
scale_rewards_std_floor: 0.2  # floor (reward units) on the batch-std divisor
num_generations_eval: 1
scale_rewards: batch        # global batch std — never per-group (degenerate-group noise inflation)
drop_degenerate_groups: true  # groups alike in reward (the floor aside) would still inflate the DAPO normalizer
balance_token_mass: true    # failures run longer than solves: cancel each round's net token-weighted push, or entropy climbs
top_entropy_quantile: 1.0   # train ALL tokens: tool-format tokens need direct reinforcement at beta=0
mask_truncated_completions: false  # `truncated` = the max_turns or output-budget overflow, or a cut/empty turn past the recovery
                                   # cap or on the last turn: a real failure worth its negative advantage; a
                                   # cut turn within the cap is priced and retried in-episode

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1      # one eval trajectory per loss forward; eval_rollout_batch_size sizes the rollout round
eval_rollout_batch_size: 34       # rows per rank per eval rollout round: 34 x 6 ranks = 204 requests in
                                  # flight at once, so the 400-row split takes two rounds
gradient_accumulation_steps: 24 # dp 6 x 24 = 144 episodes/step (12 prompts x 12); the per-rank value must divide by num_generations
num_train_epochs: 1              # one pass over the pool: the stage runs to the end of its data, and the evals
                                 # say which checkpoint to keep
learning_rate: 2.0e-07
max_grad_norm: 1.0
lr_scheduler_type: constant_with_warmup  # the useful length of a frontier stage is read off its evals, not fixed in advance
warmup_steps: 10

# --- Optimization ---
optim: adamw_torch_fused    # AdamWBF16 (bf16 master + stochastic rounding)
moe_balancing: none          # bias_update would diverge trainer↔vLLM routing (bias is never synced)
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true       # a MoE runs reentrant GC (the trainer force-promotes false)
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-stage3-extra-hard
save_strategy: steps
save_steps: 25
save_total_limit: 3              # archive the eval-peak checkpoint before it rotates out

# --- Eval (the pool's held-out split: 400 problems, 100 per band; pass@1) ---
eval_strategy: steps
eval_steps: 25                   # with every checkpoint: a peak between two coarse evals is a peak lost
eval_on_start: true         # eval the starting checkpoint

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
log_completions: false
save_completions: true       # trajectories → <output_dir>/completions/*.parquet

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42
