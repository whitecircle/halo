# Environmental GRPO — Qwen3.6-35B-A3B on Codeforces, LoRA (r=64, attention projections), EP=4, ZeRO-2,
# KL-free (bands + IS masking as trust region).
# Serve with: --tool-call-parser qwen3_xml --reasoning-parser qwen3 --moe-backend triton, and
#   VLLM_USE_V2_MODEL_RUNNER=0 in the server env (Model Runner V2 rejects the thinking_token_budget
#   this config sends with a 400 on every rollout).
#   (hermes does NOT parse Qwen3.5/3.6 XML tool calls — rollouts silently return no tool_calls).
# vLLM only: rollout_backend sglang is rejected for this family (no fused expert gather) and under EP.
# Launch: start 2 vLLM servers on GPUs 4-7 with --weight-transfer-config '{"backend":"nccl"}', then
#   CUDA_VISIBLE_DEVICES=0,1,2,3 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=4 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3.6-35B-A3B
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
model_init_kwargs:
  output_router_logits: true
  router_aux_loss_coef: 0.001
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (4 train GPUs: EP=4 single dispatch group, DP=4) ---
expert_parallel_size: 4            # ep_size == GPUs-in-the-job = one DeepEP group; EP ⊥ DP
fsdp_reshard_after_forward: false  # ZeRO-2 for the non-expert base params; ZeRO-3 is rejected under EP
ep_buffer_backend: legacy          # DeepEP V1 Buffer, intranode only; elastic's 32-bit wire-index guard
                                   # breaks at these tokens/rank

# --- LoRA (r=64, attention projections only) ---
# Expert projections need EP grouped adapters (split_expert_lora_targets) — attention-only stays on plain PEFT.
use_peft: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_task_type: CAUSAL_LM
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj

# --- Environment ---
environment_type: codeforces
max_turns: 12               # high's worst case (3 subs + 6 scratchpad runs) plus room to recover
                            # from a length-cutoff turn, which costs a turn instead of the episode
environment_kwargs:
  language: python
  timeout_per_test: 5
  stop_on_first_failure: false
  max_grading_seconds: 150   # wall-clock budget per submission grade, no test-count limit — see
                             # gptoss/vllm/gptoss-20b-code-contests-lora-ep1.yaml for the derivation
  reasoning_effort: random   # drawn once per generation group (shared conditioning), not per episode
  # max_output_size (grader stdout cap, NOT a generation budget) stays at the env default.
  # One profile per effort level: CoT budget + interaction. Submissions scale with effort, one repair
  # everywhere — a single submission strands near-misses; high funds the full verdict->fix loop.
  # NO behavior bounties: a tested-submission bonus drowns in the group baseline or gets ritual-farmed,
  # so the interaction ladder is the differentiator and the objective the only large channel.
  # thinking_tokens is an ENGINE cap that also bounds the turn total (thinking + global answer headroom).
  reasoning_effort_profiles:
    low: {thinking_tokens: 4096, max_submissions: 2, max_test_calls: 2, token_cost: 0.05}
    medium: {thinking_tokens: 8192, max_submissions: 3, max_test_calls: 4, token_cost: 0.02}
    high: {thinking_tokens: 16384, max_submissions: 3, max_test_calls: 6}
  # token_cost: reward units per 1k generated tokens (both channels), charged by the trainer.
  # A PRICE, not a target: length floors/bands are farmable; a cost can only be avoided by
  # economy, which is the desired cheap-tier behavior. High thinks free; the ladder prices compute.
  # Reward ladder: see code_contests.py _compute_reward.
  submission_reward: 0.25    # bonus for reaching the graded channel
  execution_progress_reward: 0.05
  no_tool_use_penalty: 0.1   # ending with 0 tool calls
  multi_turn_reward: 0.05    # binary, once per episode, gated on a real submission
  tool_success_reward: 0     # env default; any per-call pay is farmable by duplicate re-runs
  turn_overflow_penalty: 0.1 # magnitude, >= 0 — charged when the episode burns max_turns
  tool_error_penalty: 0.05   # magnitude, >= 0 — applied as minus per call that fails to parse/execute

# --- Ray Workers ---
num_rollout_workers: 32
max_concurrent_rollouts: 32

# --- vLLM Servers ---
rollout_server_configs:
- url: "http://localhost:8000"
  group_port: 51216
- url: "http://localhost:8001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 300.0        # per HTTP call
episode_timeout: 2700         # whole-episode wall clock; must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.1     # >1 flattens sampling for exploration pressure: guards the interaction strategy
                            # against early sharpening (the IS geo-band/veto price the extra off-policyness)
rollout_top_p: 0.95
rollout_max_tokens: 22000              # per-turn total: thinking budget + a 4k answer headroom
                                       # (the headroom must leave a finished thought room to emit its tool call)
rollout_max_thinking_tokens: 18000     # global CoT ceiling >= the profiles' high
reasoning_compliance_weight: 0   # OFF: a reward floor on under-band CoT is exploitable — the policy grows CoT to the floor while
                                 # the visible channel inflates; length control is engine-side (per-effort caps)

# --- Prefetch ---
enable_prefetch: true       # one-step staleness corrected by the sampling-logprob IS ratio

# --- Dataset ---
# Held-out eval split ships in the dataset — leave test_size unset.
# The two pools scripts/environments/preparation/prepare_code_dataset.py writes, listed side by
# side — the loader concatenates them, so no merged pool has to exist. The held-out split is the
# codeforces pool's own: deepcoder-taco ships train only (its source has no test split), so it
# contributes training rows and nothing to the eval set. Placeholder paths: point them at the
# --output_dir you wrote (agent-docs/training-methods/grpo/environments/code-contests.md#preparation).
dataset:
- /mnt/s3_datasets/codeforces-verifiable-rl
- /mnt/s3_datasets/deepcoder-taco-rl

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 8
use_chunked_grpo_logprobs: true # required for Qwen3.6 (~248k vocab)
loss_type: dapo
advantage_mode: neg_mask_hard  # zero negative advantages in hard groups; the entropy brake at beta=0
advantage_hard_group_threshold: 0.5      # hard = no member reached this reward/objective
beta: 0.0                   # KL-free; drift observability = sampling/logratio_mean + entropy + eval
num_iterations: 1
epsilon: 0.2
epsilon_high: 0.28        # inert at num_iterations=1 (PPO ratio ≡ 1)
# --- IS trust region (vLLM↔trainer ratio; see agent-docs/reference/configuration-reference.md) ---
# Requires train_on_sampled_tokens + vllm_importance_sampling_correction (trainer raises otherwise).
isr_geo_band_min: 0.98       # trajectory geometric-mean band; on sustained masking lower LR, never widen the band
isr_geo_band_max: 1.02
isr_veto_min: 1.0e-4         # any corrected token below this raw ratio masks its whole trajectory
isr_opsm_delta: 0.05         # masks negative-advantage trajectories with |mean log-ratio| > delta (nats)
skip_update_masked_frac: 0.4  # zero the step's gradient when > this fraction of trajectories is masked
scale_rewards_std_floor: 0.2  # floor (reward units) on the batch-std divisor
num_generations_eval: 1
scale_rewards: batch        # global batch std — never per-group (degenerate-group noise inflation)
drop_degenerate_groups: true  # all-alike groups would still inflate the DAPO normalizer
top_entropy_quantile: 1.0   # train ALL tokens: tool-format tokens need direct reinforcement at beta=0
mask_truncated_completions: false  # `truncated` covers ONLY the max_turns overflow (a length-cut TURN is
                                   # priced and retried in-episode, and its fragment is skipped at tokenization),
                                   # and a turn-budget burn is a real failure worth its negative advantage

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 4
gradient_accumulation_steps: 24 # dp 4 x 24 = 96 episodes/step; per-rank value must divide by num_generations
steps_per_generation: 24        # must equal gradient_accumulation_steps (pin explicitly)
max_steps: 300              # the cosine horizon must match the run's USEFUL length, not the dataset's:
                            # at a full-epoch (~1.2k-step) horizon the LR is still 97% of peak at step 150
                            # — the whole run effectively trains at peak LR
num_train_epochs: 1
learning_rate: 3.0e-06
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 10

# --- Optimization ---
optim: adamw_torch_fused    # AdamWBF16 (bf16 master + stochastic rounding)
moe_balancing: none          # bias_update would diverge trainer↔vLLM routing (bias is never synced)
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true       # EP requires reentrant GC
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-lora-ep4
save_strategy: steps
save_steps: 15
save_total_limit: 6        # bounds checkpoint disk; archive the eval-peak checkpoint before it rotates out

# --- Eval (held-out test split, 200 problems, pass@1) ---
eval_strategy: steps
eval_steps: 50

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
log_completions: false
save_completions: true       # trajectories → <output_dir>/completions/*.parquet
num_completions_to_print: 2

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42
