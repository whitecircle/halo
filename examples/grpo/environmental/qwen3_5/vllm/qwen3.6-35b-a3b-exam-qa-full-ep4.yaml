# Environmental GRPO — Qwen3.6-35B-A3B on WebInstruct-verified (exam QA), closed-book by default
# (open_book enables search), EP=4.
# Serve with: --tool-call-parser qwen3_xml --reasoning-parser qwen3 --moe-backend triton
#   (hermes does NOT parse Qwen3.5/3.6 XML tool calls — rollouts silently return no tool_calls).
# Launch: start a vLLM server on GPUs 4-7 with --weight-transfer-config '{"backend":"nccl"}', then CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nproc_per_node=4 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3.6-35B-A3B
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
model_init_kwargs:
  output_router_logits: true
moe_balancing: none  # explicit aux_loss is REJECTED on a GRPO trainer (it never enters the loss); router logits stay on for MoE metrics
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (EP=4: one dispatch group on the 4 train GPUs, DP=4) ---
expert_parallel_size: 4

# --- Environment ---
environment_type: exam_qa
max_turns: 5
# environment_kwargs:
#   open_book: true           # search tools on
#   search_backend: duckduckgo

# --- Ray Workers ---
num_rollout_workers: 16

# --- Rollout Generation ---
rollout_temperature: 0.7
rollout_max_tokens: 8192

# --- Prefetch ---
enable_prefetch: false    # one rollout_server_url, and that engine stops serving during weight sync, so the
                          # trainer auto-disables prefetch; it needs a rollout_server_configs list of 2+ servers

# --- Dataset ---
# Exact-match grading is clean for Integer/Float/Multiple-Choice answer_type rows;
# Expression-type answers under-credit — filter on answer_type offline if that matters.
dataset:
- TIGER-Lab/WebInstruct-verified
test_size: 0.01
prompt_field: question

# --- Sequence Lengths ---
max_prompt_length: null  # prompt filter (drop over-long rows), not a truncation length; null = keep all

# --- GRPO ---
num_generations: 4
beta: 0.0  # KL-free. Non-zero beta under use_peft: false makes
           # the script load a second full 35B model as the reference (there is no adapter to
           # disable instead), beside the EP-sharded policy this topology exists to fit
num_iterations: 1
epsilon: 0.2
scale_rewards: batch     # global batch std — never per-group (degenerate-group noise inflation)

# --- Training ---
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 1.0
learning_rate: 1.0e-06
lr_scheduler_type: cosine
warmup_steps: 20

# --- Optimization ---
gradient_checkpointing_kwargs:
  use_reentrant: true   # a MoE runs reentrant GC (the trainer force-promotes false)

# --- Output ---
output_dir: checkpoints/env-grpo-qwen3.6-35b-a3b-exam-qa-full-ep4
save_steps: 100
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
log_completions: true        # per-sample console table
num_completions_to_print: 3

# --- PEFT ---
use_peft: false
