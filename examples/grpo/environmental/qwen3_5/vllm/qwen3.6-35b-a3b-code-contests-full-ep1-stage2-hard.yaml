# Environmental GRPO — Qwen3.6-35B-A3B full fine-tune, code-contests curriculum stage 2 of 3: the HardTests
# `hard` band (rating 2000-2599), no EP, ZeRO-3, KL-free
# (bands + IS masking as trust region).
# Serve with: --tool-call-parser qwen3_xml --reasoning-parser qwen3 --moe-backend triton --enable-prefix-caching
#   (opt-in for this hybrid family; a multi-turn episode re-sends its context every turn), and
#   VLLM_USE_V2_MODEL_RUNNER=0 in the server env (Model Runner V2 rejects the thinking_token_budget
#   this config sends with a 400 on every rollout).
#   (hermes does not parse Qwen3.5/3.6 XML tool calls, so rollouts return no tool_calls).
# This file targets vLLM; the sibling `../sglang/` config runs the same recipe on SGLang.
# Launch: start 2 vLLM servers, TP=1 each, on GPUs 6 and 7 with --weight-transfer-config '{"backend":"nccl"}', then
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=6 scripts/training/environmental_grpo.py <this config>
#   Six trainer ranks, not four: one ~100k-token trajectory peaks near 200 GB of activations on its rank
#   (batch 1, per-layer GC), so the 70 GB of ZeRO-3 param/grad/optimizer shards at DP=4 left no margin
#   at DP=4; DP=6 shards them to ~47 GB.

# --- Model ---
model_name_or_path: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-stage1-medium/checkpoint-150  # the previous stage's eval-best checkpoint, weights only (fresh optimizer)
model_name: Qwen/Qwen3.6-35B-A3B   # the id the rollout servers serve; unset, the checkpoint path above would be sent as the model id
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
# No output_router_logits: the aux loss is inert under the policy-gradient objective (the trainer warns),
# and transformers still runs the load-balancing loss whenever the flag is on — its one-hot expansion is
# layers x tokens x top_k x experts int64, tens of GB on a 100k-token trajectory (moe_balancing: none below).
# train_on_sampled_tokens (default on) needs the server flag --return-tokens-as-token-ids.

# --- Parallelism (6 train GPUs: pure data-parallel, DP=6, ZeRO-3) ---
expert_parallel_size: 1            # pure DP; vLLM holds the other 2 GPUs
fsdp_reshard_after_forward: true   # ZeRO-3: max activation headroom for long full-FT trajectories

# --- Full fine-tune (no PEFT) ---
use_peft: false

# --- Environment ---
environment_type: codeforces
max_turns: 12               # high's worst case (3 subs + 6 scratchpad runs) plus room to recover
                            # from a length-cutoff turn, which costs a turn, not the episode
environment_kwargs:
  language: python
  timeout_per_test: 5
  stop_on_first_failure: false
  max_grading_seconds: 150   # wall-clock budget per submission grade, no test-count limit — see
                             # gptoss/vllm/gptoss-20b-code-contests-lora-ep1.yaml for the derivation
  reasoning_effort: random   # drawn once per generation group (shared conditioning), not per episode
  max_length_cutoff_recoveries: 2  # a cut turn spends a turn but no budget; past two recoveries the episode ends truncated
  # max_output_size (grader stdout cap, NOT a generation budget) stays at the env default.
  # One profile per effort level: CoT budget + interaction. Submissions scale with effort, one repair
  # everywhere — a single submission strands near-misses; high funds the full verdict->fix loop.
  # NO behavior bounties: a tested-submission bonus drowns in the group baseline or gets ritual-farmed,
  # so the interaction ladder is the differentiator and the objective the only large channel.
  # thinking_tokens is an ENGINE cap that also bounds the turn total (thinking + global answer headroom).
  reasoning_effort_profiles:
    # Harder problems need a longer thought at every level: at 4k the low level cannot reach a tool call
    # on 2000+ problems, so its groups fail as a block and carry no signal. The ladder still spans 2x.
    low: {thinking_tokens: 8192, max_submissions: 2, max_test_calls: 2}
    medium: {thinking_tokens: 12288, max_submissions: 3, max_test_calls: 4}
    high: {thinking_tokens: 16384, max_submissions: 3, max_test_calls: 6}
  # No token_cost: a per-token price is paid within the group, so the sibling that reasons less wins it
  # regardless of outcome at every effort level; the thinking caps and interaction budgets price effort.
  # Reward ladder: see code_contests.py _compute_reward.
  submission_reward: 0.1     # bonus for reaching the graded channel; small so a weak submission cannot out-earn a careful one
  pass_fraction_exponent: 2.0  # convex partial credit: a half-right submission earns a quarter of a solve
  execution_progress_reward: 0.05
  verdict_detail: outcome    # FAIL / pass count only (the Codeforces contract): shown expected/got made the judge a free test oracle
  resubmission_penalty: 0.1  # magnitude, >= 0 — each graded submission after the first; prices probing the judge
  no_tool_use_penalty: 0.1   # ending with 0 tool calls
  multi_turn_reward: 0.05    # binary, once per episode, gated on a real submission
  tool_success_reward: 0     # env default; any per-call pay is farmable by duplicate re-runs
  turn_overflow_penalty: 0.1 # magnitude, >= 0 — charged when the episode burns max_turns
  tool_error_penalty: 0.05   # magnitude, >= 0 — applied as minus per call that fails to parse/execute

# --- Ray Workers ---
num_rollout_workers: 32
max_concurrent_rollouts: 34  # = eval_rollout_batch_size: the eval round must fit one wave; training needs fewer

# --- vLLM Servers ---
rollout_server_configs:
- url: "http://localhost:8000"
  group_port: 51216
- url: "http://localhost:8001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 1200.0       # per HTTP call; this family decodes at ~25-50 tok/s per sequence on the 0.26
                              # triton-MoE path (TP=1, ~40 concurrent), so a 22k-token turn needs up to ~15 min
                              # (300 s timed out every high-effort turn and re-ran the whole episode)
max_retries: 1                # a timeout re-runs the WHOLE episode; 2 attempts x 1200 s stays under the
                              # 80%-of-watchdog retry budget at DIST_NCCL_TIMEOUT_MINUTES=60
episode_timeout: 2700         # whole-episode wall clock; must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # on-policy; the trainer scores at this temperature and the engine's IS reference must match
                            # against early sharpening (the IS geo-band/veto price the extra off-policyness)
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_max_tokens: 22000              # per-turn total: thinking budget + a 4k answer headroom
                                       # (2k left a finished thought too little room to emit its tool call)
rollout_max_thinking_tokens: 18000     # global CoT ceiling >= the profiles' high
reasoning_compliance_weight: 0   # OFF: the under-band floor is farmable — a padded CoT meets it;
                                 # length control is engine-side instead (per-effort caps)

# --- Prefetch ---
enable_prefetch: true       # one-step staleness corrected by the sampling-logprob IS ratio

# --- Dataset ---
# One stage of the curriculum: the HardTests pool's `hard` config (rating 2000-2599), published by
# prepare_code_dataset.py --push_bands. Every stage config of the repo carries the same 400-problem
# held-out `test` split (100 per band), so the evals of all three stages compare directly — leave
# test_size unset. The Codeforces pool (`your-org/code-contests-codeforces-rl:hard`) has the same shape.
dataset:
- your-org/code-contests-hardtests-rl:hard

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 8
use_chunked_grpo_logprobs: true # required for Qwen3.6 (~248k vocab)
loss_type: dapo
advantage_mode: asymmetric   # failures run 3-4x longer than solves, so under the token-level normalizer
advantage_neg_scale: 0.7     #   their negatives carry the gradient mass and push entropy up; 0.7 nets ~0
beta: 0.0                   # KL-free; drift observability = sampling/logratio_mean + entropy + eval
num_iterations: 1
epsilon: 0.2
epsilon_high: 0.28        # inert at num_iterations=1 (PPO ratio ≡ 1)
# --- IS trust region (vLLM↔trainer ratio; see agent-docs/reference/configuration-reference.md) ---
# Requires train_on_sampled_tokens + vllm_importance_sampling_correction (trainer raises otherwise).
isr_engine_reference: false  # the engine re-score costs server headroom (an fp32 log-softmax over the vocabulary per
                             #   prefill chunk; --gpu-memory-utilization <= 0.80) and removes only the trainer<->engine part of the floor
isr_geo_band_min: 0.95       # +-0.05 nats above the entropy-dependent numerical floor (~0.003/token at sampling entropy
isr_geo_band_max: 1.05       #   0.4, ~0.04 at 1.0); on sustained masking at LOW entropy fix the disagreement, never widen
isr_veto_min: 1.0e-4         # any corrected token below this raw ratio masks its whole trajectory
isr_opsm_delta: 0.05         # masks negative-advantage trajectories with |mean log-ratio| > delta (nats)
skip_update_masked_frac: 0.4  # skip the optimizer step when > this fraction of corrected trajectories or tokens is masked
scale_rewards_std_floor: 0.2  # floor (reward units) on the batch-std divisor
num_generations_eval: 1
scale_rewards: batch        # global batch std — never per-group (degenerate-group noise inflation)
drop_degenerate_groups: true  # all-alike groups would still inflate the DAPO normalizer
top_entropy_quantile: 1.0   # train ALL tokens: tool-format tokens need direct reinforcement at beta=0
mask_truncated_completions: false  # `truncated` means ONLY the max_turns overflow (a length-cut TURN is
                                   # priced and retried in-episode, and its fragment is skipped at tokenization),
                                   # and a turn-budget burn is a real failure worth its negative advantage

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 4      # rows per eval loss-forward chunk
eval_rollout_batch_size: 34       # the 400-problem eval split in two one-wave rounds across 6 ranks (8 rows padded)
gradient_accumulation_steps: 16 # dp 6 x 16 = 96 episodes/step; per-rank value must divide by num_generations
steps_per_generation: 16        # must equal gradient_accumulation_steps (pin explicitly)
max_steps: 150              # one stage's horizon: the cosine reaches ~0 where the band's signal thins
                            # (groups all-solved); the next stage starts from this stage's eval-best checkpoint
num_train_epochs: 1
learning_rate: 2.0e-07      # full-FT LR; decays to ~0 over the 150-step horizon (LoRA sibling: 3e-6)
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 10

# --- Optimization ---
optim: adamw_torch_fused    # AdamWBF16 (bf16 master + stochastic rounding)
moe_balancing: none          # bias_update would diverge trainer↔vLLM routing (bias is never synced)
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false      # overridden to True at runtime: the ep1 grouped-GEMM expert layer counts as EP (the trainer warns)
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-stage2-hard
save_strategy: steps
save_steps: 50              # full checkpoints are ~70 GB — coarser cadence, tighter limit than LoRA
save_total_limit: 2         # 2 kept + 1 writing fits the volume at the size above

# --- Eval (the pool's held-out split: 400 problems, 100 per band, shared by every stage; pass@1) ---
eval_strategy: steps
eval_steps: 50
eval_on_start: true         # the previous stage's checkpoint on the shared split: the number this stage is measured against

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
log_completions: false
save_completions: true       # trajectories → <output_dir>/completions/*.parquet
num_completions_to_print: 2

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false
seed: 42
