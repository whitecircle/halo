# Environmental GRPO — Qwen3.6-35B-A3B full fine-tune on code_contests, SGLang backend, no EP, ZeRO-3, KL-free (IS bands as the trust region).
# rollout_max_thinking_tokens and carry_reasoning are vLLM-only, so rollout_max_tokens is the per-turn bound.
# Serve with: 2x TP=1 sglang-server on ports 30000/30001, --moe-runner-backend triton (auto-picked runners repack the expert weights each sync writes), SGLANG_CHAT_TEMPLATE=jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja (the file chat_template: pins below)
#   --tool-call-parser auto (without it tool calls stay text and every episode scores 0), --reasoning-parser qwen3, NCCL_CUMEM_ENABLE=1 in the server env.
# Launch: CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 DIST_NCCL_TIMEOUT_MINUTES=60 torchrun --nproc_per_node=6 scripts/training/environmental_grpo.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3.6-35B-A3B
chat_template: jinja-templates/qwen3/qwen3.6-reasoning-effort.jinja  # states the episode's reasoning effort and thinking budget; the stock template has no effort variable
force_chat_template: true      # the checkpoint ships the stock template; serve with the same file
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
# No output_router_logits: the aux loss is inert under the policy-gradient objective, and the flag
# would still record a [tokens, num_experts] router-logit plane per MoE layer on every forward.

# --- Parallelism (6 train GPUs: pure data-parallel, DP=6, ZeRO-3) ---
expert_parallel_size: 1            # pure DP; the servers hold the other 2 GPUs
fsdp_reshard_after_forward: true   # ZeRO-3: max activation headroom for long full-FT trajectories

# --- Full fine-tune (no PEFT) ---
use_peft: false

# --- Environment ---
environment_type: codeforces
max_turns: 16               # an unproductive turn costs a turn, not the episode
environment_kwargs:
  language: python
  timeout_per_test: 5
  max_grading_seconds: 150   # wall-clock budget per submission grade, no test-count limit; a stop before any failure leaves the group baseline, one after is a failure
  reasoning_effort: random
  max_length_cutoff_recoveries: 2  # two recoveries, cut and empty turns together: the third such turn ends the episode truncated
  # One profile per effort level. thinking_tokens is a soft per-turn budget (enforce_thinking_cap: false), priced
  # past it (reasoning_price_past_budget); SGLang caps no reasoning, so nothing cuts CoT below rollout_max_tokens.
  reasoning_effort_profiles:
    low: {thinking_tokens: 8192, enforce_thinking_cap: false, max_submissions: 1, max_test_calls: 2}
    medium: {thinking_tokens: 12288, enforce_thinking_cap: false, max_submissions: 2, max_test_calls: 4}
    high: {thinking_tokens: 16384, enforce_thinking_cap: false, max_submissions: 3, max_test_calls: 6}
  submission_reward: 0.1     # bonus for reaching the graded channel
  verdict_detail: outcome    # a failed test's verdict class only; expected/got would make the judge a free test oracle
  resubmission_penalty: 0.2  # magnitude, >= 0 — charged per graded submission after the first
  no_tool_use_penalty: 0.2
  turn_overflow_penalty: 0.35
  length_cutoff_penalty: 0.08  # magnitude, >= 0 — charged per recovered turn that produced nothing: engine-cut, or ended without a call or an answer
  tool_error_penalty: 0.05

# --- Rewards ---
# The length economy: the level's per-turn thinking budget, soft (priced past it; SGLang caps no reasoning),
# the turn limit, the interaction budgets and the output budget. The judge reads the whole episode, every
# turn's reasoning included, and vetoes the credit of one that carried its working-out into a program, spent a call on
# an unfinished draft, or faked, probed or mined the grade; working-out in a scratchpad run is logged, never priced, so
# testing costs nothing; a run that could test nothing (no usable input) and a failed submission of a program never
# tested beyond the samples in an episode that failed cost 0.1 each; a guess or a probe of the grade pays 0.3 or 0.2
# beyond its veto, and prices add when several checks fire. Its
# evidence is a line of what the policy did, never of what it thought.
rewards:
  - source: environment
  - source: judge
    name: audit
    model: openai/gpt-6-luna   # through OpenRouter; the key is read from OPENROUTER_API_KEY in the launch environment (api_key_env names another)
    view: full
    max_view_chars: 900000     # a whole episode with its reasoning: 131072 sampled tokens and the tool replies
    max_tokens: 16384          # room for the verdict's own reasoning on the longest episodes
    request_timeout: 120       # a verdict on a full episode takes ~10 s; with the client's retries it stays inside episode_timeout
    on_error: invalid          # a verdict the judge never reached leaves the episode out of training: an outage never trains unjudged episodes
    weight: -0.7               # prices each fired weighted check by its share: wasted_run and untested_submission 0.1, hardcoded_output 0.3 and verdict_probe 0.2 beyond their veto; reasoning_in_runs is logged
    context_file: examples/grpo/environmental/code-contests-judge/gemma4-qwen3.6-sglang.txt
    checks: environment        # the environment's audit rubric (CodeContestsEnvironment.JUDGE_CHECKS)

# --- Ray Workers ---
num_rollout_workers: 32
max_concurrent_rollouts: 34  # = eval_rollout_batch_size: the eval round must fit one wave

# --- Rollout servers (SGLang) ---
rollout_backend: sglang
rollout_server_configs:
- url: "http://localhost:30000"
  group_port: 51216
- url: "http://localhost:30001"
  group_port: 51217
rollout_connection_timeout: 180.0
request_timeout: 1200.0       # per HTTP call = one turn; at least twice the turn cap over the per-sequence decode
                              # speed at peak concurrency (agent-docs/training-methods/async-grpo/performance.md#sizing-a-run)
max_retries: 1                # per turn: a failed or timed-out request is re-issued, not the episode;
                              # (1 + max_retries) x request_timeout must fit inside episode_timeout
episode_timeout: 2700         # whole-episode deadline in engine-serving time (a weight-sync pause is credited
                              # back); must stay below the NCCL watchdog (DIST_NCCL_TIMEOUT_MINUTES)

# --- Rollout Generation ---
rollout_temperature: 1.0     # on-policy; the trainer and the engine's IS reference must score at this temperature
rollout_top_p: 1.0           # a top-p cut renormalizes uncertain positions, which the geometric band below reads as drift
rollout_max_tokens: 30000              # per-turn bound; SGLang enforces no thinking cap below it
rollout_max_episode_tokens: 131072  # the most an episode may sample over all its turns, reasoning and visible output together (never stated to the model; with no reasoning cap to keep an answer room past, a turn starts only while a whole rollout_max_tokens is left of it)
reasoning_floor: 0.05  # the one term that pays for MORE reasoning: an episode reasoning under 0.75x its level's per-turn budget, summed over its turns, pays up to this
reasoning_price: {low: 0.008, medium: 0.006, high: 0.004}  # per 1,000 reasoning tokens a turn spends past its level's soft budget, the lowest level highest
reasoning_price_past_budget: true  # free within the budget: the soft budget's only ceiling below the turn limit (SGLang caps no reasoning)
reasoning_price_cap: 0.28          # the most the price charges an episode: under one more failed submission (resubmission + untested_submission)

# --- Prefetch ---
enable_prefetch: true

# --- Dataset ---
# HardTests problems with sound checkers, banded by Codeforces rating; `medium` is 1500-1999.
dataset:
- your-org/code-contests-hardtests-rl:medium

# --- Sequence Lengths ---
max_prompt_length: null

# --- GRPO objective: KL-free, bands as the trust region ---
num_generations: 8
use_chunked_grpo_logprobs: true # required for Qwen3.6 (~248k vocab)
loss_type: dapo
beta: 0.0
num_iterations: 1
epsilon: 0.2
isr_geo_band_min: 0.95       # +-0.05 nats above the entropy-dependent numerical floor; on sustained masking fix the disagreement, never widen the band
isr_geo_band_max: 1.05
isr_veto_min: 1.0e-4
isr_opsm_delta: 0.05
skip_update_masked_frac: 0.4
early_stop_on_skipped_updates: true  # end the run once the breaker has skipped every update of early_stop_patience (3) rounds in a row
scale_rewards_std_floor: 0.2
num_generations_eval: 1
scale_rewards: batch
drop_degenerate_groups: true
balance_token_mass: true    # failures run longer than solves: cancel each round's net token-weighted push, or entropy climbs
top_entropy_quantile: 1.0
mask_truncated_completions: false  # `truncated` = the max_turns or output-budget overflow, or a cut/empty turn past the recovery
                                   # cap or on the last turn: a real failure worth its negative advantage; a
                                   # cut turn within the cap is priced and retried in-episode

# --- Training ---
per_device_train_batch_size: 1
per_device_eval_batch_size: 1      # one eval trajectory per loss forward; eval_rollout_batch_size sizes the rollout round
eval_rollout_batch_size: 34
gradient_accumulation_steps: 16
max_steps: 300              # the cosine horizon must match the run's useful length, not the dataset's
learning_rate: 2.0e-07
lr_scheduler_type: cosine
warmup_steps: 10

# --- Optimization ---
moe_balancing: none
gradient_checkpointing_kwargs:
  use_reentrant: true       # a MoE runs reentrant GC (the trainer force-promotes false)
fp32_grad_reduce: true

# --- Output ---
output_dir: checkpoints/env-grpo-qwen3.6-35b-a3b-code-contests-full-ep1-sglang
save_steps: 50
save_total_limit: 2

# --- Eval ---
eval_strategy: steps
eval_steps: 50
eval_on_start: true         # eval the starting checkpoint

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: ["wandb"]
