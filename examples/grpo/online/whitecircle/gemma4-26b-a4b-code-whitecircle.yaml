# Online GRPO, Gemma-4 26B-A4B on code-security prompts, rewarded by two White Circle terms: the security policy set
# and the quality policy set of `halo run create-whitecircle-policies`, each its own term. vLLM on GPU 0, EP=2 trainer on GPUs 1,2.
# Create the policies and paste the rewards block `halo run create-whitecircle-policies` prints, start the vLLM server, then:
#   WHITECIRCLE_API_KEY=wc-... CUDA_VISIBLE_DEVICES=1,2 halo launch grpo/online examples/grpo/online/whitecircle/gemma4-26b-a4b-code-whitecircle.yaml -n 2
# See human-docs/cookbooks/halo-whitecircle-cookbook.md.

# --- Model ---
model_name_or_path: google/gemma-4-26B-A4B-it
# Resolves to sdpa_flex_sliding on CUDA: compiled FlexAttention on the sliding layers, matmul attention on the
# 512-wide global layers (agent-docs/models/gemma4.md); naming it skips the redirect warning a flash request gets.
attn_implementation: sdpa
moe_balancing: none        # Gemma4 has no aux-loss wiring and no bias-update support

# --- Parallelism (EP=2: one dispatch group on the 2 train GPUs) ---
expert_parallel_size: 2

# --- Dataset ---
# "Write a ... code that ..." requests, many of which invite an insecure implementation.
dataset: CyberNative/Code_Vulnerability_Security_DPO
test_size: 0.02
prompt_field: question

# --- Rewards ---
# Paste the block `halo run create-whitecircle-policies` prints; each set is one term with its own weight.
rewards:
  - source: whitecircle
    name: security
    environment_id: your_environment_id
    policies: [policy_a, policy_b, policy_c, policy_d]
    weight: 1.0
  - source: whitecircle
    name: quality
    environment_id: your_environment_id
    policies: [policy_e, policy_f]
    weight: 0.5

# --- GRPO ---
beta: 0.0
num_iterations: 1
epsilon: 0.15
scale_rewards: group
num_generations: 8
temperature: 1.0
loss_type: grpo

# --- Training ---
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
max_steps: 200
gradient_checkpointing_kwargs:
  use_reentrant: true   # EP requires reentrant GC
learning_rate: 1.0e-06
lr_scheduler_type: constant

# --- Sequence lengths ---
max_prompt_length: 1024
max_completion_length: 2048

# --- vLLM generation ---
use_vllm: true
vllm_mode: server
vllm_server_host: 127.0.0.1

# --- Output ---
output_dir: checkpoints/online-grpo-gemma4-26b-a4b-code-whitecircle
save_strategy: "no"
logging_steps: 1
logging_first_step: true
report_to: []
log_completions: true
