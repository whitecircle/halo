# Online GRPO smoke — Qwen3.6-35B-A3B on GSM8K, 3 steps, EP=2 (train GPUs 1,2 + vLLM GPU 0).
# Launch: vllm-server with --weight-transfer-config '{"backend":"nccl"}' --moe-backend triton (GPU 0;
#   the auto-picked Blackwell MoE backends repack the expert weights this sync writes), then
#   CUDA_VISIBLE_DEVICES=1,2 torchrun --nproc_per_node=2 scripts/training/online_grpo/rlvr.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3.6-35B-A3B
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
model_init_kwargs:
  output_router_logits: true
moe_balancing: none  # explicit aux_loss is REJECTED on a GRPO trainer (it never enters the loss); router logits stay on for MoE metrics

# --- Parallelism (EP=2: one dispatch group on 2 GPUs, DP=2) ---
expert_parallel_size: 2

# --- Dataset ---
dataset: openai/gsm8k:main@train   # @train rather than the bare spec: with test_size set, a dataset
                                   # that ships a 'test' split is concatenated and re-split, pulling
                                   # GSM8K's held-out benchmark rows into training
test_size: 0.01                    # 1% holdout carved out of train only
prompt_field: question

# --- Rewards ---
rewards:
  - source: accuracy   # the last \boxed{} equals the answer, weight 1.0

# --- GRPO Hyperparameters ---
beta: 0.0
num_iterations: 1
epsilon: 0.15
scale_rewards: group
num_generations: 4
temperature: 1.0
loss_type: grpo

# --- MoE precision ---
fp32_router: true

# --- Training ---
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
max_steps: 3
learning_rate: 1.0e-06
lr_scheduler_type: constant
max_prompt_length: 256
max_completion_length: 256

# --- vLLM Generation ---
use_vllm: true
vllm_mode: server

# --- Output ---
output_dir: checkpoints/online-grpo-qwen3.6-35b-a3b-smoke
save_strategy: "no"

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: []

# --- PEFT ---
use_peft: false
