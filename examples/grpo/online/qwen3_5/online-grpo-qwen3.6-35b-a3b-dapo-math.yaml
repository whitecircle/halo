# Online GRPO (RLVR) — Qwen3.6-35B-A3B on DAPO-Math-17k, rule-based accuracy reward, EP=2 (train GPUs 1,2 + vLLM GPU 0).
# See agent-docs/training-methods/grpo/online.md.
# Launch: vllm-server with --weight-transfer-config '{"backend":"nccl"}' --moe-backend triton (GPU 0;
#   the auto-picked Blackwell MoE backends repack the expert weights this sync writes), then
#   CUDA_VISIBLE_DEVICES=1,2 torchrun --nproc_per_node=2 scripts/training/grpo/online.py <this config>

# --- Model ---
model_name_or_path: Qwen/Qwen3.6-35B-A3B
attn_implementation: sdpa  # FA2 crashes Qwen3.5 M-RoPE varlen path
model_init_kwargs:
  output_router_logits: true
moe_balancing: none  # explicit aux_loss is REJECTED on a GRPO trainer (it never enters the loss); router logits stay on for MoE metrics

# --- Parallelism (EP=2: one dispatch group on the 2 train GPUs, DP=2) ---
expert_parallel_size: 2

# --- Dataset ---
# The DAPO paper's RL corpus repackaged for TRL: plain question in `prompt`, final integer answer in `solution`.
dataset: open-r1/DAPO-Math-17k-Processed:en
test_size: 0.01
answer_field: solution
system_prompt: "Solve the problem step by step and put your final numeric answer in \\boxed{}."

# --- Rewards ---
rewards:
  - source: accuracy   # the last \boxed{} equals the answer, weight 1.0

# --- GRPO Hyperparameters ---
beta: 0.0
num_iterations: 1
epsilon: 0.15
scale_rewards: group
num_generations: 8
temperature: 1.0
loss_type: grpo

# --- Training ---
per_device_train_batch_size: 1
num_train_epochs: 1.0
gradient_accumulation_steps: 8
gradient_checkpointing_kwargs:
  use_reentrant: true   # EP requires reentrant GC (the trainer force-promotes false)
learning_rate: 1.0e-06
lr_scheduler_type: cosine
warmup_steps: 20

# --- Sequence Lengths ---
max_prompt_length: 1024
max_completion_length: 4096

# --- vLLM Generation ---
use_vllm: true
vllm_mode: server

# --- Output ---
output_dir: checkpoints/online-grpo-qwen3.6-35b-a3b-dapo-math
save_steps: 200
eval_strategy: steps
eval_steps: 200
save_total_limit: 3
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb
log_completions: true

# --- PEFT (optional) ---
use_peft: false
