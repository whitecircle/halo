# RLVR Online GRPO template — rule-based rewards (math accuracy, format), DistributedGRPOTrainer.
# Dataset rows: {"prompt": ..., "answer": ...}. See agent-docs/training-methods/grpo/online-grpo.md.
# Usage: start a vLLM server with --weight-transfer-config '{"backend": "nccl"}', then
#   torchrun --nproc_per_node=4 scripts/training/online_grpo/rlvr.py <this config> — add
#   --expert_parallel_size/--tensor_parallel_size here; accelerate launch stays an option for plain DP.

# --- Model ---
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
attn_implementation: sdpa
# moe_balancing: auto        # MoE router balancing method; auto resolves per model (the aux loss is inert under a policy-gradient loss, so the MoE recipes set none)

# --- Parallelism ---
# expert_parallel_size: 1    # expert distribution size: how many distinct expert subsets to create (ep_group_size must divide the NVLink domain)

# --- Dataset ---
dataset: trl-lib/DeepMath-103K
test_size: 0.01
prompt_field: prompt      # DeepMath ships chat-form prompts (role/content list) — consumed natively
answer_field: solution    # DeepMath's ground-truth column is `solution` (there is no `answer` column)
# system_prompt: null       # prepended to every conversation
# reasoning_effort: null    # chat-template reasoning-effort steer (low/medium/high), random (sampled per prompt), or null; needs a template that reads it

# --- Rewards (agent-docs/training-methods/grpo/rewards.md) ---
# A sum of terms, each weight x score^exponent over a score in [0, 1]; one TRL reward function per term,
# named after it.
rewards:
  - source: accuracy         # the last \boxed{} equals the answer; name: accuracy, weight 1.0
  # - {source: format, weight: 0.5, pattern: "<think>.*?</think>\\s*<answer>.*?</answer>"}
  # - {source: judge, name: quality, weight: 0.3, requirements: [{name: correctness, description: "..."}]}
  # - {source: reward_model, name: preference, weight: 0.5, url: "http://localhost:8100", model: <BT model id>}
  # judge needs OPENROUTER_API_KEY; reward_model needs a served BT model (vllm --runner pooling / sglang --is-embedding)

# --- GRPO Hyperparameters ---
beta: 0.0
num_iterations: 1
epsilon: 0.15
scale_rewards: group
num_generations: 8
temperature: 1.0
loss_type: grpo
# use_chunked_grpo_logprobs: false  # vocab-chunked log-probs instead of full [B, T, vocab] logits (large-vocab models on long completions)

# --- Advantage shaping (AdvantageShapingArguments, exclusive with use_rlrr; agent-docs/training-methods/grpo/online-grpo.md) ---
# advantage_mode: mean              # mean, qae (+advantage_quantile), asymmetric (+advantage_pos_scale,
#                                     advantage_neg_scale; 0 = full negative mask), neg_mask_hard
#                                     (+advantage_hard_group_threshold)
# scale_rewards_std_floor: 0.0      # floor on the std divisor in advantage scaling; 0 = off
# drop_degenerate_groups: false     # mask GRPO groups whose completions all scored the same reward out of the loss

# --- RLRR (arXiv:2601.23058; ranking advantages replace the group-normalized ones, so scale_rewards and the shaping knobs stay unset with it) ---
# use_rlrr: false
# rlrr_mode: hrr                    # hrr (hybrid; rlrr_tau 0.1 is its rank-correction magnitude, Eq. 3) or prr (pure relative)
# rlrr_lambda: 2048.0               # length-bin granularity of the rlrr_length_rerank re-ranking (Eq. 6)
# rlrr_correctness_clip: true       # correctness-aware clipping (Eq. 5): rlrr_correctness_threshold 0.5 counts as
#                                     correct, rlrr_xi_pos 1.0e-03 caps / rlrr_xi_neg -1.0e-03 floors; rlrr_std_normalize false

# --- SDPG (arXiv:2606.04036; privileged-teacher reverse-KL OPD term on top of the GRPO loss) ---
# use_sdpg: false
# opd_positive_advantage_only: true  # the OPD term on positive-advantage tokens only
# sdpg_hint_template: "\n[Hint] The correct answer is: {answer}. Do NOT state that you were given the answer.\n"  # appended to the last user turn for the TEACHER forward only
# sdpg_loss: reverse_kl             # reverse_kl, forward_kl or unnormalized_kl; sdpg_temperature 1.0
# The beta schedule (sdpg_beta_base, sdpg_beta_warmup_steps, sdpg_beta_decay_steps): agent-docs/training-methods/distillation/online-sdpg.md#configuration

# --- Training ---
per_device_train_batch_size: 2
per_device_eval_batch_size: 8   # global eval batch must divide by num_generations at any world size
num_train_epochs: 1.0
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
optim: adamw_torch_fused
learning_rate: 5.0e-06
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 20
seed: 42

# --- Sequence Lengths ---
max_prompt_length: 1024
max_completion_length: 2048

# --- vLLM Generation ---
use_vllm: true
vllm_mode: server
vllm_server_host: 0.0.0.0   # the address the TRAINER DIALS, not a bind address (Linux connects
                            # 0.0.0.0 to loopback); a server on another host needs its real
                            # address here, or vllm_server_base_url instead
vllm_server_port: 8000

# --- Output ---
output_dir: checkpoints/rlvr-online-grpo
save_strategy: steps
save_steps: 200
eval_strategy: steps
eval_steps: 200
save_total_limit: 5
save_only_model: true

# --- Logging ---
logging_steps: 1
logging_first_step: true
report_to: wandb
log_completions: true

# --- Data ---
dataloader_num_workers: 0
remove_unused_columns: false

# --- PEFT (optional) ---
use_peft: false
# lora_r: 64
# lora_alpha: 128
# lora_dropout: 0.05
# lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
# lora_task_type: CAUSAL_LM
