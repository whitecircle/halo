# EFA overlay for docker-compose.vllm.yml — the weight-sync group and the trainer's other
# collectives ride the fabric. Layer it after the base:
#   docker compose -f docker-compose.vllm.yml -f docker-compose.vllm.efa.yml up -d vllm-server
# The host supplies the EFA driver and /dev/infiniband; a trainer on another node also needs
# VLLM_GROUP_HOST when the default-route NIC is not the one the server can reach.

x-efa: &efa
  devices:
    - /dev/infiniband:/dev/infiniband
  ulimits:
    memlock: -1
  environment:
    # Naming the plugin's net makes a missing or broken plugin fail group formation instead of
    # silently falling back to sockets.
    - NCCL_NET=${NCCL_NET:-Libfabric}
    - NCCL_NET_PLUGIN=${NCCL_NET_PLUGIN:-ofi}
    - NCCL_IB_DISABLE=${NCCL_IB_DISABLE:-0}
    # The bootstrap and rendezvous ride the ENA interface. NCCL's exclusion list must name lo: an
    # excluded-only list still ranks loopback first, and a server advertising 127.0.0.1 to a trainer
    # on another node fails formation. Name the interface outright when the exclusion is too coarse.
    - NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-^lo,docker,veth,tailscale}

services:
  vllm-server:
    <<: *efa
  training:
    <<: *efa
