site_name: Halo
site_description: 'Halo — install, configure, and run the Halo LLM training toolkit: pre-training and 12 post-training methods with EP/CP/TP/ETP parallelism for MoE and dense models.'
site_author: White Circle
copyright: 'Copyright &copy; 2026 <a href="https://whitecircle.com">White Circle</a> — Apache-2.0 · hello@whitecircle.ai · Generated with the <a href="https://claude.com/claude-code">Claude Code</a> <code>docs</code> skill'
repo_url: https://github.com/whitecircle/halo
repo_name: whitecircle/halo
edit_uri: edit/main/agent-docs/
docs_dir: agent-docs

# Auto-link inline-code repo paths (`src/...`, `scripts/...`, configs) to GitHub source.
hooks:
  - mkdocs_hooks/github_links.py

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra:
  version: "1.0.0"

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

validation:
  links:
    anchors: warn
    unrecognized_links: warn

# Navigation is organized by topic so each section's nav matches its index page. Files keep
# their on-disk directory (data/, optimization/, reference/, …), so relative links stay valid.
nav:
  - Get Started:
    - index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - Configuration Guide: getting-started/configuration.md
    - Choosing a Training Method: getting-started/choosing-a-method.md
  - Training Methods:
    - training-methods/index.md
    - Training Callbacks: training-methods/callbacks.md
    - Supervised Learning:
      - SFT: training-methods/sft.md
      - Pre-training (from scratch): training-methods/pretraining.md
    - Preference Optimization:
